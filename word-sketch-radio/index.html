<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fffef7">
<title>Sketchradio — Poem · Voice · Sketch · World</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#fffef7}iframe{position:fixed;inset:0;width:100%;height:100dvh;border:0;background:#fffef7}
#boot{position:fixed;inset:0;z-index:3;display:grid;place-items:center;background:#fffef7;color:#080a08;font:900 10px ui-monospace,monospace;letter-spacing:.12em}#boot.off{display:none}
</style>
</head>
<body>
<div id="boot">SKETCHRADIO</div>
<iframe id="sketchsong" title="Sketchradio instrument" src="../word-sketch-song/"></iframe>
<script>
(()=>{
  const frame=document.getElementById('sketchsong');
  const boot=document.getElementById('boot');
  const radioURL=new URL('radio.js?v=3',location.href).href;
  const deepURL=new URL('radio-deep.js?v=3',location.href).href;
  const audioURL=new URL('radio-audio-fix.js?v=3',location.href).href;
  const inject=(d,src,ok,fail)=>{const s=d.createElement('script');s.src=src;s.onload=ok;s.onerror=fail;d.body.appendChild(s)};
  const start=()=>{
    try{
      const d=frame.contentDocument;
      if(!d||d.getElementById('sketchradio-runtime'))return;
      const mark=d.createElement('meta');mark.id='sketchradio-runtime';d.head.appendChild(mark);
      inject(d,radioURL,()=>inject(d,deepURL,()=>inject(d,audioURL,()=>boot.classList.add('off'),()=>{boot.textContent='AUDIO HEAR LAYER FAILED'}),()=>{boot.textContent='RADIO DEEP LAYER FAILED'}),()=>{boot.textContent='RADIO LAYER FAILED'});
    }catch(e){boot.textContent='SKETCHRADIO BOOT FAILED'}
  };
  frame.addEventListener('load',start);
  try{if(frame.contentDocument?.readyState==='complete')start()}catch{}
})();
</script>
</body>
</html>
