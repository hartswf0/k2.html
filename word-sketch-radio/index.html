<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fffef7">
<title>Sketchradio — Poem · Voice · Sketch · World</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#fffef7}iframe{position:fixed;inset:0;width:100%;height:100dvh;border:0;background:#fffef7}
#boot{position:fixed;inset:0;z-index:3;display:grid;place-items:center;background:#fffef7;color:#080a08;font:900 10px ui-monospace,monospace;letter-spacing:.12em}#boot.off{display:none}
</style>
</head>
<body>
<div id="boot">SKETCHRADIO</div>
<iframe id="sketchsong" title="Sketchradio instrument" src="../word-sketch-song/"></iframe>
<script>
(()=>{
  const frame=document.getElementById('sketchsong');
  const boot=document.getElementById('boot');
  const radioURL=new URL('radio.js',location.href).href;
  const deepURL=new URL('radio-deep.js',location.href).href;
  frame.addEventListener('load',()=>{
    try{
      const d=frame.contentDocument;
      if(!d||d.getElementById('sketchradio-runtime'))return;
      const mark=d.createElement('meta');mark.id='sketchradio-runtime';d.head.appendChild(mark);
      const a=d.createElement('script');a.src=radioURL;
      a.onload=()=>{const b=d.createElement('script');b.src=deepURL;b.onload=()=>boot.classList.add('off');b.onerror=()=>{boot.textContent='RADIO DEEP LAYER FAILED'};d.body.appendChild(b)};
      a.onerror=()=>{boot.textContent='RADIO LAYER FAILED'};
      d.body.appendChild(a);
    }catch(e){boot.textContent='SKETCHRADIO BOOT FAILED'}
  });
})();
</script>
</body>
</html>
