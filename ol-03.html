<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>ORBITAL LOOM: ENGINEER</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-pink: #ff00ff;
            --neon-amber: #ffaa00;
            --bg-color: #050505;
            --font-main: 'Courier New', monospace;
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
        body { margin: 0; overflow: hidden; background-color: var(--bg-color); font-family: var(--font-main); color: #fff; }

        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }

        /* HUD */
        #top-hud {
            position: absolute; top: 20px; left: 20px; right: 20px;
            display: flex; justify-content: space-between; align-items: flex-start;
            pointer-events: auto;
        }

        .panel {
            background: rgba(10, 10, 10, 0.9);
            border: 1px solid #333;
            border-left: 4px solid var(--neon-blue);
            padding: 15px;
            border-radius: 4px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }

        h1 { margin: 0; font-size: 16px; letter-spacing: 2px; color: #fff; text-transform: uppercase; }
        .sub { font-size: 10px; color: #888; margin-top: 4px; }

        /* BUTTONS */
        button {
            background: #222; border: 1px solid #444; color: #ccc;
            padding: 10px 16px; font-family: inherit; font-size: 11px; font-weight: bold;
            cursor: pointer; text-transform: uppercase; letter-spacing: 1px;
            transition: all 0.2s;
        }
        button:hover { border-color: #fff; color: #fff; }
        button.active { background: var(--neon-blue); color: #000; border-color: var(--neon-blue); box-shadow: 0 0 15px rgba(0, 243, 255, 0.4); }
        
        #btn-power { background: #ff3300; color: #fff; border: none; }
        #btn-power.on { background: #00ff66; color: #000; }

        /* ENGINEERING DECK (Bottom Controls) */
        #controls {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; flex-direction: column; gap: 8px; pointer-events: auto; 
            width: 90%; max-width: 600px;
            background: rgba(0,0,0,0.8); border: 1px solid #333; padding: 10px; border-radius: 8px;
        }

        .deck-row {
            display: flex; justify-content: space-between; align-items: center; gap: 10px;
        }

        .label { font-size: 10px; color: #888; width: 50px; }

        /* Custom Slider */
        input[type=range] {
            -webkit-appearance: none; flex: 1; height: 4px; background: #333; border-radius: 2px; outline: none;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 16px; height: 16px; background: var(--neon-blue); border-radius: 50%; cursor: pointer; box-shadow: 0 0 10px var(--neon-blue);
        }

        .mode-group { display: flex; gap: 2px; }
        .mode-btn { flex: 1; padding: 8px; font-size: 9px; min-width: 60px; }

        /* RETICLE */
        #reticle {
            position: absolute; top: 50%; left: 50%; width: 6px; height: 6px;
            background: rgba(255,255,255,0.8); border-radius: 50%;
            transform: translate(-50%, -50%); pointer-events: none;
            box-shadow: 0 0 0 2px rgba(0,0,0,0.5); transition: 0.2s;
        }
        #reticle.hover { width: 20px; height: 20px; background: transparent; border: 2px solid var(--neon-blue); border-radius: 4px; transform: translate(-50%, -50%) rotate(45deg); }

        #XRButton { position: absolute !important; bottom: 140px !important; left: 50% !important; transform: translateX(-50%) !important; }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div id="top-hud">
            <div class="panel">
                <h1>Orbital Loom</h1>
                <div class="sub" id="status-text">SYSTEM STANDBY</div>
            </div>
            <button id="btn-power">INITIALIZE</button>
        </div>

        <div id="reticle"></div>

        <div id="controls">
            <!-- Source Selector -->
            <div class="deck-row">
                <div class="label">SOURCE</div>
                <div class="mode-group">
                    <button class="mode-btn active" onclick="setSource('SYNTH', this)">SYNTH</button>
                    <button class="mode-btn" onclick="setSource('RADIO', this)">RADIO</button>
                    <button class="mode-btn" onclick="setSource('SAMPLE', this)">SAMPLE</button>
                </div>
            </div>

            <!-- Size/Gate Slider -->
            <div class="deck-row">
                <div class="label">SIZE</div>
                <input type="range" min="0.1" max="1.5" step="0.1" value="0.8" oninput="setSize(this.value)">
            </div>

            <!-- Camera Controls -->
            <div class="deck-row" id="cam-controls">
                <div class="label">VIEW</div>
                <div class="mode-group">
                    <button class="mode-btn active" onclick="setCam('INSIDE', this)">INSIDE</button>
                    <button class="mode-btn" onclick="setCam('OUTSIDE', this)">ORBIT</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { XRButton } from 'three/addons/webxr/XRButton.js';

        // --- CONFIG ---
        const RINGS = 8;
        const SLOTS = 16;
        const RADIUS = 2.5;
        const HEIGHT = 0.6;
        const COLORS = [0xff0000, 0xff7700, 0xffff00, 0x00ff00, 0x00ffff, 0x0000ff, 0xff00ff, 0xffffff];

        // --- STATE ---
        const state = {
            isPlaying: false,
            bpm: 120,
            source: 'SYNTH', // SYNTH, RADIO, SAMPLE
            gate: 0.8,       // Duration/Size
            hover: null
        };

        // --- AUDIO ENGINE ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const master = audioCtx.createGain();
        master.gain.value = 0.4;
        
        // Effects Chain
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 5000;
        
        const delay = audioCtx.createDelay();
        delay.delayTime.value = 0.25;
        const delayFb = audioCtx.createGain();
        delayFb.gain.value = 0.2;
        delay.connect(delayFb);
        delayFb.connect(delay);

        filter.connect(master);
        delay.connect(master);
        master.connect(audioCtx.destination);

        function playSound(ringIdx) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            
            const t = audioCtx.currentTime;
            const dur = state.gate * 0.5; // Scale duration by gate
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            // Source Logic
            if(state.source === 'SYNTH') {
                // Classic Synth tones
                osc.type = ringIdx < 4 ? 'triangle' : 'sawtooth';
                const freq = 110 * Math.pow(1.059, ringIdx * 2); 
                osc.frequency.setValueAtTime(freq, t);
                
                gain.gain.setValueAtTime(0, t);
                gain.gain.linearRampToValueAtTime(0.4, t + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.001, t + dur + 0.1);
                
                osc.connect(gain);
            } 
            else if(state.source === 'RADIO') {
                // FM Modulation for "Tuning" sound
                osc.type = 'square';
                const freq = 50 + (ringIdx * 150);
                osc.frequency.setValueAtTime(freq, t);
                
                const lfo = audioCtx.createOscillator();
                lfo.type = 'sawtooth';
                lfo.frequency.value = 100 + (Math.random() * 500);
                const lfoGain = audioCtx.createGain();
                lfoGain.gain.value = 1000;
                
                lfo.connect(lfoGain);
                lfoGain.connect(osc.frequency);
                lfo.start(t); lfo.stop(t+dur);

                gain.gain.setValueAtTime(0.3, t);
                gain.gain.linearRampToValueAtTime(0, t + dur);
                
                osc.connect(gain);
            }
            else { // SAMPLE Mode Simulation (Percussive/Chopped)
                osc.type = 'sine';
                if(ringIdx % 2 === 0) {
                    // Kick/Tom simulation
                    osc.frequency.setValueAtTime(150, t);
                    osc.frequency.exponentialRampToValueAtTime(0.01, t + 0.2);
                    gain.gain.setValueAtTime(0.8, t);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
                } else {
                    // Hi-hat/Glitch simulation (White Noise approx via high freq FM)
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(8000, t);
                    gain.gain.setValueAtTime(0.2, t);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
                }
                osc.connect(gain);
            }

            // Routing
            gain.connect(filter);
            if(state.source === 'RADIO') gain.connect(delay); // Add delay to radio for space

            osc.start(t);
            osc.stop(t + dur + 0.5);
        }

        // --- 3D SCENE ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.6, 0.1); 

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);
        
        document.body.appendChild(XRButton.createButton(renderer, {
            optionalFeatures: ['dom-overlay'], 
            domOverlay: { root: document.getElementById('ui-layer') } 
        }));

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, 1.6, -1);

        const light = new THREE.PointLight(0xffffff, 2, 20);
        light.position.set(0, 5, 0);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0xffffff, 0.2));

        // --- TOWER BUILDER ---
        const tower = new THREE.Group();
        tower.position.y = 0; 
        scene.add(tower);

        const slotW = (Math.PI * 2 * RADIUS) / SLOTS * 0.9;
        const boxGeo = new THREE.BoxGeometry(slotW, HEIGHT * 0.9, 0.2); // Base geometry
        const edgesGeo = new THREE.EdgesGeometry(boxGeo);

        const wireMat = new THREE.LineBasicMaterial({ color: 0x444444, opacity: 0.3, transparent: true });
        const activeMat = new THREE.MeshStandardMaterial({ 
            color: 0xffffff, emissive: 0xaaaaaa, emissiveIntensity: 0.8,
            roughness: 0.2, metalness: 0.8
        });

        const sensors = []; 

        for(let r=0; r<RINGS; r++) {
            const y = r * HEIGHT + (HEIGHT/2);
            for(let s=0; s<SLOTS; s++) {
                const angle = (s / SLOTS) * Math.PI * 2;
                
                const slotGroup = new THREE.Group();
                slotGroup.position.set(Math.sin(angle) * RADIUS, y, Math.cos(angle) * RADIUS);
                slotGroup.lookAt(0, y, 0);
                tower.add(slotGroup);

                // Sensor (Invisible Click Target)
                const sensor = new THREE.Mesh(boxGeo, new THREE.MeshBasicMaterial({ visible: false }));
                sensor.userData = { r: r, s: s, active: false, group: slotGroup };
                slotGroup.add(sensor);
                sensors.push(sensor);

                // Wireframe Frame
                const frame = new THREE.LineSegments(edgesGeo, wireMat);
                slotGroup.add(frame);

                // Active Brick
                const brick = new THREE.Mesh(boxGeo, activeMat.clone());
                brick.material.color.setHex(COLORS[r]);
                brick.material.emissive.setHex(COLORS[r]);
                brick.visible = false;
                
                // Pivot adjustment for scaling (scale from left edge usually looks better, but center is fine here)
                slotGroup.add(brick);
                
                sensor.userData.brick = brick;
                sensor.userData.frame = frame;
            }
        }

        // Scanner
        const scanGeo = new THREE.BoxGeometry(0.1, RINGS*HEIGHT, RADIUS*2.2);
        const scanMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.1 });
        const scanner = new THREE.Mesh(scanGeo, scanMat);
        scanner.position.y = (RINGS*HEIGHT)/2;
        tower.add(scanner);

        // --- INTERACTION ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const reticle = document.getElementById('reticle');
        
        const controller = renderer.xr.getController(0);
        controller.addEventListener('select', onTrigger);
        scene.add(controller);
        
        const laser = new THREE.Line(
            new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,-5)]),
            new THREE.LineBasicMaterial({ color: 0x00ffff, opacity: 0.5, transparent: true })
        );
        controller.add(laser);

        window.addEventListener('pointermove', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        });

        window.addEventListener('pointerdown', (e) => {
            if(e.target.tagName !== 'BUTTON' && e.target.tagName !== 'INPUT') onTrigger();
        });

        function onTrigger() {
            if(!audioCtx) return;
            if(audioCtx.state === 'suspended') audioCtx.resume();

            if(state.hover) {
                const s = state.hover;
                s.userData.active = !s.userData.active;
                updateSlotVisuals(s);
                if(s.userData.active) playSound(s.userData.r);
            }
        }

        function updateSlotVisuals(sensor) {
            const active = sensor.userData.active;
            const brick = sensor.userData.brick;
            brick.visible = active;
            
            // Apply current gate size immediately
            if(active) {
                brick.scale.x = state.gate; 
                if(navigator.vibrate) navigator.vibrate(10);
            }
        }

        // --- TOOLS ---
        window.setSource = (mode, el) => {
            state.source = mode;
            document.querySelectorAll('.mode-group button').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('status-text').innerText = "SOURCE: " + mode;
        };

        window.setSize = (val) => {
            state.gate = parseFloat(val);
            // Update all active bricks visually
            sensors.forEach(s => {
                if(s.userData.active) s.userData.brick.scale.x = state.gate;
            });
        };

        window.setCam = (mode, el) => {
            document.querySelectorAll('#cam-controls button').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            if(mode === 'INSIDE') {
                camera.position.set(0, 1.6, 0.1);
                controls.target.set(0, 1.6, -1);
            } else {
                camera.position.set(0, 4, 6);
                controls.target.set(0, 2, 0);
            }
        };

        document.getElementById('btn-power').onclick = (e) => {
            state.isPlaying = !state.isPlaying;
            e.target.innerText = state.isPlaying ? "STOP" : "INITIALIZE";
            e.target.classList.toggle('on');
            if(audioCtx.state === 'suspended') audioCtx.resume();
            document.getElementById('status-text').innerText = state.isPlaying ? "SEQUENCER RUNNING" : "STANDBY";
        };

        // --- LOOP ---
        const clock = new THREE.Clock();
        const tempMat = new THREE.Matrix4();

        renderer.setAnimationLoop(() => {
            const dt = clock.getDelta();
            controls.update();

            // Raycast
            if(renderer.xr.isPresenting) {
                tempMat.identity().extractRotation(controller.matrixWorld);
                raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
                raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMat);
            } else {
                raycaster.setFromCamera(mouse, camera);
            }

            const hits = raycaster.intersectObjects(sensors);
            
            if(state.hover && (!hits.length || hits[0].object !== state.hover)) {
                state.hover.userData.frame.material.color.setHex(0x444444);
                state.hover.userData.frame.material.opacity = 0.3;
                state.hover = null;
                reticle.classList.remove('hover');
            }

            if(hits.length) {
                const hit = hits[0].object;
                state.hover = hit;
                hit.userData.frame.material.color.setHex(0xffffff);
                hit.userData.frame.material.opacity = 1.0;
                reticle.classList.add('hover');
            }

            // Sequencer
            if(state.isPlaying) {
                const speed = (state.bpm / 60) * Math.PI / 2;
                scanner.rotation.y -= speed * dt * 0.5;
                const scanAng = scanner.rotation.y % (Math.PI*2);
                
                sensors.forEach(s => {
                    if(s.userData.active) {
                        let slotAng = (s.userData.s / SLOTS) * Math.PI * 2;
                        let diff = Math.abs(slotAng - Math.abs(scanAng));
                        if(diff > Math.PI) diff = (Math.PI*2) - diff;

                        // Visual Pulse based on Gate
                        // If gate is small, pulse is short. If gate is large, pulse sustains.
                        const triggerZone = 0.1 * state.gate;

                        if(diff < triggerZone) {
                            s.userData.brick.material.emissiveIntensity = 2.0;
                            if(!s.userData.triggered) {
                                playSound(s.userData.r);
                                s.userData.triggered = true;
                            }
                        } else {
                            s.userData.brick.material.emissiveIntensity = 0.8;
                            s.userData.triggered = false;
                        }
                    }
                });
            }

            renderer.render(scene, camera);
        });

        renderer.xr.addEventListener('sessionstart', () => {
            document.getElementById('cam-controls').style.display = 'none';
            tower.position.y = 0; 
        });
        renderer.xr.addEventListener('sessionend', () => {
            document.getElementById('cam-controls').style.display = 'flex';
        });

    </script>
</body>
</html>
