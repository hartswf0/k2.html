<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Project ATEK: Mobile Universe</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; font-family: 'Courier New', Courier, monospace; }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        #ui-layer {
            position: absolute;
            top: 10px;
            left: 10px;
            pointer-events: none;
            color: #00ffcc;
            text-shadow: 0 0 5px #00ffcc;
            background: rgba(0, 20, 20, 0.8);
            padding: 10px;
            border: 1px solid #00ffcc;
            border-radius: 8px;
            max-width: 300px;
            transition: opacity 0.3s;
        }

        h1 { margin: 0 0 5px 0; font-size: 16px; font-weight: bold; letter-spacing: 1px; }
        .stat-row { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 3px; }
        .label { color: #88aaaa; }
        .value { font-weight: bold; }
        
        #controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            pointer-events: none;
        }
        
        .btn {
            pointer-events: auto;
            background: rgba(0, 255, 204, 0.1);
            border: 1px solid #00ffcc;
            color: #00ffcc;
            padding: 10px 20px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            border-radius: 20px;
            backdrop-filter: blur(4px);
            text-transform: uppercase;
            font-size: 12px;
        }
        
        .btn:active { background: #00ffcc; color: #000; }

        #log {
            position: absolute;
            bottom: 60px;
            left: 10px;
            right: 10px;
            height: 100px;
            overflow: hidden;
            pointer-events: none;
            display: flex;
            flex-direction: column-reverse;
            font-size: 10px;
            color: rgba(255,255,255,0.7);
            text-shadow: 0 0 2px black;
        }
        .log-entry { margin-top: 2px; }
        .log-gold { color: #ffd700; font-weight: bold; }
    </style>
    
    <!-- Three.js Import Map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="ui-layer">
        <h1>PROJECT ATEK <span style="font-size: 10px; opacity: 0.7;">v1.0 Mobile</span></h1>
        <div class="stat-row"><span class="label">Agents:</span><span class="value" id="count-agents">0</span></div>
        <div class="stat-row"><span class="label">Symbionts (Gold):</span><span class="value" id="count-symbionts" style="color:#ffd700">0</span></div>
        <div class="stat-row"><span class="label">Avg Energy:</span><span class="value" id="avg-energy">0</span></div>
        <div class="stat-row"><span class="label">Generation:</span><span class="value" id="generation">0</span></div>
        <div class="stat-row"><span class="label">FPS:</span><span class="value" id="fps">0</span></div>
    </div>

    <div id="log"></div>

    <div id="controls">
        <button class="btn" id="reset-btn">Reset Simulation</button>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- CONFIGURATION ---
        const CONFIG = {
            GRID_SIZE: 32,          // World bounds (-16 to +16)
            MAX_AGENTS: 2500,       // InstancedMesh limit
            MAX_RESOURCES: 4000,    // Resource limit
            TICK_RATE: 10,          // Physics updates per second (throttle for mobile)
            START_AGENTS: 100,
            SYMBIOSIS_THRESHOLD: 0.15, // Similarity required to merge
            ENERGY_COST_MOVE: 2.0,
            ENERGY_GAIN_EAT: 30.0,
            ENERGY_DIVIDE_REQ: 150.0,
            MUTATION_RATE: 0.05
        };

        // --- UTILITIES ---
        const RND = (min, max) => Math.random() * (max - min) + min;
        const RND_INT = (min, max) => Math.floor(Math.random() * (max - min + 1) + min);
        const CLAMP = (val, min, max) => Math.min(Math.max(val, min), max);
        
        // Simple hash for sparse map: "x,y,z"
        const POS_KEY = (x, y, z) => `${x},${y},${z}`;

        // HUD Logger
        const logEl = document.getElementById('log');
        function log(msg, type = 'normal') {
            const div = document.createElement('div');
            div.className = type === 'gold' ? 'log-entry log-gold' : 'log-entry';
            div.textContent = `> ${msg}`;
            logEl.prepend(div);
            if (logEl.children.length > 6) logEl.lastChild.remove();
        }

        // --- CORE CLASSES ---

        // 1. GENOME (Bit-String equivalent)
        class Genome {
            constructor(parents = null) {
                // [R, G, B, MetabRate, SenseRad, SymbiosisFactor]
                this.dna = new Float32Array(6);

                if (parents) {
                    // Crossover
                    const p1 = parents[0].dna;
                    const p2 = parents[1] ? parents[1].dna : parents[0].dna;
                    
                    for(let i=0; i<6; i++) {
                        this.dna[i] = Math.random() > 0.5 ? p1[i] : p2[i];
                        // Mutation
                        if (Math.random() < CONFIG.MUTATION_RATE) {
                            this.dna[i] += RND(-0.1, 0.1);
                            this.dna[i] = CLAMP(this.dna[i], 0, 1);
                        }
                    }
                } else {
                    // Random Init
                    for(let i=0; i<6; i++) this.dna[i] = Math.random();
                    // Biases for interesting start
                    this.dna[3] = RND(0.3, 0.8); // Metab
                    this.dna[4] = RND(0.1, 0.5); // Sense
                }
            }

            // Metric for genetic distance
            distance(other) {
                let d = 0;
                for(let i=0; i<3; i++) d += Math.abs(this.dna[i] - other.dna[i]); // Color diff
                return d / 3;
            }

            getColor() {
                return new THREE.Color(this.dna[0], this.dna[1], this.dna[2]);
            }
        }

        // 2. AGENT (Autopoietic Unit)
        class Agent {
            constructor(x, y, z, parents = null) {
                this.pos = new THREE.Vector3(Math.floor(x), Math.floor(y), Math.floor(z));
                this.genome = new Genome(parents);
                this.energy = 50 + RND(0, 50);
                this.age = 0;
                this.isSymbiont = parents && parents.length === 2;
                this.id = Math.random().toString(36).substr(2, 9);
                
                // Active Inference State
                this.state = 'MOVE'; 
            }

            update(world) {
                this.age++;
                this.energy -= 0.5; // Base metabolic cost

                if (this.energy <= 0) return false; // Die

                // FSM / Active Inference
                if (this.energy > CONFIG.ENERGY_DIVIDE_REQ) {
                    this.tryDivide(world);
                } else if (this.energy < 20) {
                    this.state = 'PANIC'; // High mutation chance
                    this.move(world);
                } else {
                    // Standard Loop: Look for food
                    const foodLoc = this.sense(world);
                    if (foodLoc) {
                        this.moveTo(world, foodLoc);
                    } else {
                        this.moveRandom(world);
                    }
                }
                
                return true; // Alive
            }

            sense(world) {
                // Simplified "Octree" query - check immediate neighbors
                const range = 1 + Math.floor(this.genome.dna[4] * 2); // Sense radius 1-3
                let bestLoc = null;
                
                // Randomly sample neighbors to save CPU (Active Inference optimization)
                for(let i=0; i<4; i++) {
                    const dx = RND_INT(-range, range);
                    const dy = RND_INT(-range, range);
                    const dz = RND_INT(-range, range);
                    if (dx===0 && dy===0 && dz===0) continue;

                    const targetKey = POS_KEY(this.pos.x + dx, this.pos.y + dy, this.pos.z + dz);
                    if (world.resources.has(targetKey)) {
                        return new THREE.Vector3(this.pos.x + dx, this.pos.y + dy, this.pos.z + dz);
                    }
                }
                return null;
            }

            moveRandom(world) {
                const axis = RND_INT(0, 2);
                const dir = RND_INT(0, 1) * 2 - 1; // -1 or 1
                const move = new THREE.Vector3(0,0,0);
                if (axis === 0) move.x = dir;
                else if (axis === 1) move.y = dir;
                else move.z = dir;
                
                this.moveTo(world, this.pos.clone().add(move));
            }

            moveTo(world, targetPos) {
                // Bounds check
                const lim = CONFIG.GRID_SIZE / 2;
                if (Math.abs(targetPos.x) > lim || Math.abs(targetPos.y) > lim || Math.abs(targetPos.z) > lim) return;

                const key = POS_KEY(targetPos.x, targetPos.y, targetPos.z);
                
                // 1. Check Collision (Agents)
                if (world.agents.has(key)) {
                    const other = world.agents.get(key);
                    
                    // SYMBIOGENESIS CHECK
                    // Logic: If genomes similar, and random chance passes, MERGE.
                    const geneticDist = this.genome.distance(other.genome);
                    const symbiosisChance = (this.genome.dna[5] + other.genome.dna[5]) / 2;
                    
                    if (!this.isSymbiont && !other.isSymbiont && 
                        geneticDist < CONFIG.SYMBIOSIS_THRESHOLD && 
                        Math.random() < symbiosisChance) {
                        
                        // Perform Merge
                        world.spawnSymbiont(this, other);
                        return; // Both parents removed by spawnSymbiont
                    }
                    return; // Blocked
                }

                // 2. Move
                // Update Spatial Map
                world.agents.delete(POS_KEY(this.pos.x, this.pos.y, this.pos.z));
                this.pos.copy(targetPos);
                world.agents.set(key, this);
                this.energy -= CONFIG.ENERGY_COST_MOVE;

                // 3. Eat Resource?
                if (world.resources.has(key)) {
                    world.resources.delete(key);
                    this.energy += CONFIG.ENERGY_GAIN_EAT * (1 + this.genome.dna[3]); // Metab bonus
                }
            }

            tryDivide(world) {
                // Try to find empty spot
                for(let i=0; i<6; i++) { // Check 6 directions
                     // Simplified random check
                     const dx = RND_INT(-1, 1), dy = RND_INT(-1, 1), dz = RND_INT(-1, 1);
                     if (dx===0 && dy===0 && dz===0) continue;
                     
                     const spawnPos = this.pos.clone().add(new THREE.Vector3(dx, dy, dz));
                     const key = POS_KEY(spawnPos.x, spawnPos.y, spawnPos.z);
                     
                     if (!world.agents.has(key)) {
                         this.energy /= 2;
                         world.addAgent(spawnPos.x, spawnPos.y, spawnPos.z, [this]);
                         return;
                     }
                }
            }
        }

        // --- WORLD MANAGER (Sparse Voxel Logic) ---
        class World {
            constructor() {
                this.agents = new Map();     // Key: "x,y,z" -> Agent
                this.resources = new Map();  // Key: "x,y,z" -> {val}
                this.generation = 0;
                
                this.init();
            }

            init() {
                this.agents.clear();
                this.resources.clear();
                this.generation = 0;
                
                // Seed Agents
                for(let i=0; i<CONFIG.START_AGENTS; i++) {
                    const x = RND_INT(-10, 10);
                    const y = RND_INT(-10, 10);
                    const z = RND_INT(-10, 10);
                    if (!this.agents.has(POS_KEY(x,y,z))) {
                        this.addAgent(x, y, z);
                    }
                }
                
                // Seed Resources
                this.regenResources();
            }

            addAgent(x, y, z, parents=null) {
                if (this.agents.size >= CONFIG.MAX_AGENTS) return;
                const a = new Agent(x, y, z, parents);
                this.agents.set(POS_KEY(x, y, z), a);
            }

            spawnSymbiont(parentA, parentB) {
                // Remove parents
                this.agents.delete(POS_KEY(parentA.pos.x, parentA.pos.y, parentA.pos.z));
                this.agents.delete(POS_KEY(parentB.pos.x, parentB.pos.y, parentB.pos.z));

                // Create Symbiont at Parent A's location
                const child = new Agent(parentA.pos.x, parentA.pos.y, parentA.pos.z, [parentA, parentB]);
                child.energy = parentA.energy + parentB.energy + 50; // Bonus
                child.isSymbiont = true; // Flag for visual gold
                child.genome.dna[3] = 1.0; // Max metabolism
                
                this.agents.set(POS_KEY(child.pos.x, child.pos.y, child.pos.z), child);
                log("SYMBIOGENESIS EVENT! New Lifeform created.", "gold");
            }

            regenResources() {
                // Procedural noise-like generation
                const count = CONFIG.MAX_RESOURCES - this.resources.size;
                if (count <= 0) return;

                for(let i=0; i<50; i++) { // Add batch per tick
                    const x = RND_INT(-CONFIG.GRID_SIZE/2, CONFIG.GRID_SIZE/2);
                    const y = RND_INT(-CONFIG.GRID_SIZE/2, CONFIG.GRID_SIZE/2);
                    const z = RND_INT(-CONFIG.GRID_SIZE/2, CONFIG.GRID_SIZE/2);
                    const key = POS_KEY(x,y,z);
                    
                    if (!this.resources.has(key) && !this.agents.has(key)) {
                        this.resources.set(key, { val: 1 });
                    }
                }
            }

            tick() {
                this.generation++;
                this.regenResources();

                const agentsList = Array.from(this.agents.values());
                
                // Shuffle to prevent update order bias
                for (let i = agentsList.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [agentsList[i], agentsList[j]] = [agentsList[j], agentsList[i]];
                }

                let totalEnergy = 0;
                let symbiontCount = 0;

                for (const agent of agentsList) {
                    const alive = agent.update(this);
                    if (!alive) {
                        this.agents.delete(POS_KEY(agent.pos.x, agent.pos.y, agent.pos.z));
                    } else {
                        totalEnergy += agent.energy;
                        if (agent.isSymbiont) symbiontCount++;
                    }
                }
                
                return { count: this.agents.size, avgEnergy: (totalEnergy / (agentsList.length||1)).toFixed(1), symbionts: symbiontCount };
            }
        }

        // --- GRAPHICS ENGINE ---
        
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050505, 0.02);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(25, 20, 35);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Cap for mobile performance
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.5;

        // Lights
        const ambientLight = new THREE.AmbientLight(0x404040, 2);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 2);
        dirLight.position.set(10, 50, 25);
        scene.add(dirLight);

        // Instance Mesh Setup
        const geometry = new THREE.BoxGeometry(0.8, 0.8, 0.8);
        const material = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.4, metalness: 0.5 });
        
        // Agent Mesh
        const agentMesh = new THREE.InstancedMesh(geometry, material, CONFIG.MAX_AGENTS);
        agentMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
        agentMesh.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(CONFIG.MAX_AGENTS * 3), 3);
        scene.add(agentMesh);

        // Resource Mesh (Smaller, separate)
        const resGeo = new THREE.BoxGeometry(0.2, 0.2, 0.2);
        const resMat = new THREE.MeshBasicMaterial({ color: 0x445566, transparent: true, opacity: 0.6 });
        const resMesh = new THREE.InstancedMesh(resGeo, resMat, CONFIG.MAX_RESOURCES);
        scene.add(resMesh);

        // Grid Helper
        const grid = new THREE.GridHelper(CONFIG.GRID_SIZE, CONFIG.GRID_SIZE, 0x222222, 0x111111);
        scene.add(grid);
        
        // World Bound Box
        const boxGeo = new THREE.BoxGeometry(CONFIG.GRID_SIZE, CONFIG.GRID_SIZE, CONFIG.GRID_SIZE);
        const boxMat = new THREE.MeshBasicMaterial({ color: 0x333333, wireframe: true });
        const boxMesh = new THREE.Mesh(boxGeo, boxMat);
        scene.add(boxMesh);

        // --- MAIN LOOP ---

        const world = new World();
        const dummy = new THREE.Object3D();
        const _color = new THREE.Color();
        const goldColor = new THREE.Color(1, 0.84, 0);

        let lastTime = 0;
        let tickTimer = 0;

        function animate(time) {
            requestAnimationFrame(animate);

            const dt = time - lastTime;
            lastTime = time;

            controls.update();

            // Logic Throttle (10 ticks per second)
            tickTimer += dt;
            if (tickTimer > (1000 / CONFIG.TICK_RATE)) {
                const stats = world.tick();
                
                // Update UI
                document.getElementById('count-agents').innerText = stats.count;
                document.getElementById('count-symbionts').innerText = stats.symbionts;
                document.getElementById('avg-energy').innerText = stats.avgEnergy;
                document.getElementById('generation').innerText = world.generation;
                document.getElementById('fps').innerText = Math.round(1000/dt);
                
                tickTimer = 0;
            }

            // --- RENDER VISUALS ---
            
            // 1. Agents
            let idx = 0;
            for (const agent of world.agents.values()) {
                dummy.position.copy(agent.pos);
                
                // Visual Pulse for Symbionts
                if (agent.isSymbiont) {
                    const scale = 1 + Math.sin(time * 0.005) * 0.2;
                    dummy.scale.set(scale, scale, scale);
                    _color.copy(goldColor);
                } else {
                    dummy.scale.set(1, 1, 1);
                    _color.set(agent.genome.getColor());
                }

                dummy.updateMatrix();
                agentMesh.setMatrixAt(idx, dummy.matrix);
                agentMesh.setColorAt(idx, _color);
                idx++;
            }
            agentMesh.count = idx;
            agentMesh.instanceMatrix.needsUpdate = true;
            agentMesh.instanceColor.needsUpdate = true;

            // 2. Resources
            let rIdx = 0;
            for (const [key, res] of world.resources) {
                const parts = key.split(',').map(Number);
                dummy.position.set(parts[0], parts[1], parts[2]);
                dummy.scale.set(1, 1, 1);
                dummy.updateMatrix();
                resMesh.setMatrixAt(rIdx, dummy.matrix);
                rIdx++;
            }
            resMesh.count = rIdx;
            resMesh.instanceMatrix.needsUpdate = true;

            renderer.render(scene, camera);
        }

        // --- EVENTS ---
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        document.getElementById('reset-btn').addEventListener('click', () => {
            world.init();
            log("Universe Reset.");
        });

        // Start interactions
        document.body.addEventListener('touchstart', function() {
            controls.autoRotate = false;
        }, {once:true});
        document.body.addEventListener('mousedown', function() {
            controls.autoRotate = false;
        }, {once:true});

        log("Simulation Initialized.");
        log("Drag to Rotate. Pinch to Zoom.");
        
        requestAnimationFrame(animate);

    </script>
</body>
</html>
