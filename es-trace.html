<!doctype html>
<html lang="en">

<title>ES/TRACE — Requisite Variety</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" fill="white"/><path d="M11 15h13M11 15v34h13M53 15H40M53 15v34H40M31 8v48" fill="none" stroke="black" stroke-width="4"/></svg>'>
<script src="https://unpkg.com/soundfont-player@0.12.0/dist/soundfont-player.js"></script>
<style>
:root{
 --paper:#fff;--ink:#000;--signal:#f2ff00;--accent:#ff5b35;--cyan:#43f1e2;
 --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
 --touch:56px;--dock:68px;--head:56px;--lane:68px;--label:108px;--beat:42px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;margin:0;background:var(--paper);color:var(--ink)}
body{font-family:var(--mono);overflow:hidden;overscroll-behavior:none}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
button{touch-action:manipulation}
.loading{position:fixed;z-index:500;top:0;left:0;right:0;height:4px;overflow:hidden;pointer-events:none}
.loading.busy:after{content:"";display:block;width:28%;height:4px;background:var(--ink);animation:sweep .8s infinite cubic-bezier(.4,0,.2,1)}
@keyframes sweep{0%{transform:translateX(-120%)}100%{transform:translateX(430%)}}
.app{height:100dvh;display:grid;grid-template-rows:var(--head) minmax(0,1fr) 26px var(--dock);background:var(--paper)}
.top{display:flex;align-items:center;gap:8px;padding:0 8px;border-bottom:2px solid var(--ink);min-width:0}
.brand{font:800 12px/1 var(--mono);letter-spacing:.13em;white-space:nowrap}.brand small{display:block;margin-top:4px;font:7px var(--mono);letter-spacing:.03em;font-weight:500}
.top .grow{flex:1}.topStat{font:8px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconBtn,.topBtn{height:48px;min-width:48px;border:2px solid var(--ink);background:var(--paper);font:800 9px var(--mono);padding:0 10px}
.topBtn.ai.ready{background:var(--ink);color:var(--signal)}
.iconBtn:active,.topBtn:active,.dock button:active,.bigBtn:active{transform:translateY(2px)}
.main{position:relative;min-height:0;overflow:hidden}
.mode{position:absolute;inset:0;display:none;min-height:0;background:var(--paper)}.mode.active{display:flex;flex-direction:column}
.worldHead{height:58px;display:flex;align-items:center;gap:6px;padding:0 8px;border-bottom:1px solid var(--ink);flex:0 0 auto}
.worldTabs{display:flex;gap:4px}.worldTab{height:48px;min-width:52px;border:1px solid var(--ink);background:var(--paper);font:800 10px var(--mono)}.worldTab.on{background:var(--ink);color:var(--signal)}
.songMeta{min-width:0;margin-left:2px}.songMeta b{display:block;font:800 10px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}.songMeta span{display:block;font:7px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:48vw}
.worldHead .grow{flex:1}.mini{height:40px;min-width:44px;border:1px solid var(--ink);background:var(--paper);font:800 8px var(--mono)}
.timeline{position:relative;min-height:0;overflow:auto;flex:1;background:var(--paper);scrollbar-width:thin;overscroll-behavior:contain}
.timelineInner{position:relative;min-width:calc(var(--label) + 32 * var(--beat));padding-bottom:10px}
.measureGrid{position:absolute;left:var(--label);right:0;top:0;bottom:0;pointer-events:none;background-image:linear-gradient(to right,rgba(0,0,0,.13) 1px,transparent 1px);background-size:calc(var(--beat)*4) 100%}
.beatGrid{position:absolute;left:var(--label);right:0;top:0;bottom:0;pointer-events:none;background-image:linear-gradient(to right,rgba(0,0,0,.045) 1px,transparent 1px);background-size:var(--beat) 100%}
.playhead{position:absolute;z-index:25;top:0;bottom:0;left:calc(var(--label) + var(--pos,0) * var(--beat));width:3px;background:var(--accent);pointer-events:none}
.lane{height:var(--lane);display:grid;grid-template-columns:var(--label) minmax(calc(32 * var(--beat)),1fr);border-bottom:1px solid var(--ink)}
.laneLabel{position:sticky;left:0;z-index:20;background:var(--paper);border-right:2px solid var(--ink);height:var(--lane);padding:7px 7px 5px;overflow:hidden;cursor:pointer;touch-action:manipulation}.laneLabel b{display:block;font:800 9px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.laneLabel small{display:block;margin-top:4px;font:7px/1.2 var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.laneLabel .role{display:inline-block;margin-top:4px;padding:2px 4px;background:var(--ink);color:var(--paper);font:7px var(--mono)}
.laneBody{position:relative;height:var(--lane)}
.eventHit{position:absolute;top:0;height:var(--lane);min-width:48px;display:flex;align-items:center;justify-content:center;touch-action:manipulation;cursor:pointer;z-index:5}
.eventBar{height:22px;width:100%;min-width:7px;border:2px solid var(--ink);background:var(--paper);position:relative;overflow:hidden}.eventHit.sel .eventBar,.eventHit.playing .eventBar{background:var(--ink)}.eventHit.sel .eventBar:after{content:"";position:absolute;inset:4px;background:var(--signal)}
.noteDot{position:absolute;width:9px;height:9px;background:var(--ink);border:1px solid var(--ink);transform:translate(-50%,-50%);pointer-events:none}.noteDot.sel{background:var(--signal)}
.status{display:flex;align-items:center;gap:8px;padding:0 8px;border-top:1px solid var(--ink);font:7px var(--mono);white-space:nowrap;overflow:hidden}.status b{font-weight:800}.status .grow{flex:1;overflow:hidden;text-overflow:ellipsis}.status .pulse{width:8px;height:8px;background:var(--ink);flex:0 0 auto}.status .pulse.busy{animation:blink .5s steps(1) infinite}@keyframes blink{50%{background:var(--signal)}}
.dock{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:2px solid var(--ink);background:var(--paper)}.dock button{height:var(--dock);border:0;border-right:2px solid var(--ink);background:var(--paper);font:900 12px var(--mono);letter-spacing:.08em}.dock button:last-child{border-right:0}.dock button.primary{background:var(--signal)}.dock button.on{background:var(--ink);color:var(--signal)}
.sheet{position:fixed;z-index:300;left:0;right:0;bottom:0;max-height:88dvh;background:var(--paper);border-top:3px solid var(--ink);transform:translateY(105%);transition:transform .18s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}.sheet.open{transform:translateY(0)}
.sheetHead{height:58px;display:flex;align-items:center;gap:6px;padding:0 8px;border-bottom:1px solid var(--ink);flex:0 0 auto}.sheetHead b{font:900 12px var(--mono);letter-spacing:.1em}.sheetHead .grow{flex:1}.close{width:48px;height:48px;border:2px solid var(--ink);background:var(--paper);font:900 16px var(--mono)}
.sheetBody{overflow:auto;padding:10px 10px max(18px,env(safe-area-inset-bottom));min-height:0}.prompt{width:100%;height:108px;resize:none;border:2px solid var(--ink);background:var(--paper);padding:12px;font:700 16px/1.35 var(--mono)}
.prompt::placeholder{color:#000;opacity:.45}.makerRow{display:flex;gap:6px;margin-top:8px}.seg{flex:1;height:48px;border:2px solid var(--ink);background:var(--paper);font:800 9px var(--mono)}.seg.on{background:var(--ink);color:var(--signal)}
.bigBtn{width:100%;height:64px;margin-top:8px;border:3px solid var(--ink);background:var(--signal);font:900 15px var(--mono);letter-spacing:.1em}.bigBtn.secondary{background:var(--paper)}
.seedRow{display:flex;gap:5px;overflow-x:auto;margin-top:8px;padding-bottom:2px;scrollbar-width:none}.seedRow::-webkit-scrollbar{display:none}.seedChip{height:48px;flex:0 0 auto;border:1px solid var(--ink);background:var(--paper);padding:0 10px;font:8px var(--mono)}
.varietyRead{margin-top:9px;padding:8px;border:1px solid var(--ink);font:8px/1.45 var(--mono)}.varietyRead b{font-weight:900}.varietyRead .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.tagChip{padding:4px 6px;border:1px solid var(--ink);font:7px var(--mono)}
.keyBox{display:none;margin-top:9px;border:2px solid var(--ink);padding:8px}.keyBox.show{display:block}.keyRow{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:5px}.keyRow input{height:52px;border:2px solid var(--ink);padding:0 8px;font:9px var(--mono)}.keyMsg{margin-top:5px;font:7px/1.4 var(--mono)}
.tracePanel{padding:12px 12px calc(12px + env(safe-area-inset-bottom));overflow:auto}.traceHero{font:900 22px/1 var(--mono);margin:4px 0 14px}.traceGrid{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--ink)}.traceCell{min-height:68px;padding:8px;border-right:1px solid var(--ink);border-bottom:1px solid var(--ink)}.traceCell:nth-child(2n){border-right:0}.traceCell:nth-last-child(-n+2){border-bottom:0}.traceCell small{display:block;font:7px var(--mono)}.traceCell b{display:block;margin-top:5px;font:900 12px var(--mono)}
.causal{margin-top:10px;border-top:2px solid var(--ink)}.causal div{min-height:48px;padding:8px 2px;border-bottom:1px solid var(--ink);font:8px/1.45 var(--mono)}.causal small{display:block;font:7px var(--mono);font-weight:900;letter-spacing:.08em}.traceActions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}.traceActions button{height:52px;border:2px solid var(--ink);background:var(--paper);font:900 9px var(--mono)}
.sourceBox{display:none;margin-top:10px;border:2px solid var(--ink)}.sourceBox.show{display:block}.sourceBox textarea{display:block;width:100%;height:230px;border:0;padding:8px;resize:vertical;font:9px/1.45 var(--mono)}.sourceBtns{display:flex;border-top:1px solid var(--ink)}.sourceBtns button{height:48px;flex:1;border:0;border-right:1px solid var(--ink);background:var(--paper);font:800 8px var(--mono)}
.instrumentSearch{width:100%;height:52px;border:2px solid var(--ink);padding:0 9px;font:11px var(--mono)}.families{display:flex;gap:4px;overflow-x:auto;margin:8px 0;scrollbar-width:none}.family{height:48px;flex:0 0 auto;border:1px solid var(--ink);background:var(--paper);font:8px var(--mono);padding:0 9px}.family.on{background:var(--ink);color:var(--signal)}.instrumentList{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--ink);border-left:1px solid var(--ink)}.inst{min-height:54px;border:0;border-right:1px solid var(--ink);border-bottom:1px solid var(--ink);background:var(--paper);padding:7px;text-align:left;font:8px/1.25 var(--mono)}.inst b{display:block;font-size:9px}.inst:active{background:var(--signal)}
.tx{display:none;margin-top:10px;border:2px solid var(--ink)}.tx.show{display:block}.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--ink)}.tabs button{height:44px;border:0;border-right:1px solid var(--ink);background:var(--paper);font:8px var(--mono)}.tabs button.on{background:var(--ink);color:var(--signal)}.txBody{max-height:250px;overflow:auto;padding:8px;white-space:pre-wrap;word-break:break-word;font:8px/1.4 var(--mono)}
.desktopInspector{display:none}.resize{display:none}
@media(min-width:900px){
 :root{--head:50px;--dock:58px;--lane:54px;--label:124px;--beat:48px}
 .app{grid-template-rows:var(--head) minmax(0,1fr) 26px var(--dock)}
 .main{display:grid;grid-template-columns:minmax(420px,68%) 6px minmax(260px,32%)}
 .mode{position:relative;inset:auto}.mode.worldMode{grid-column:1;display:flex!important}.mode.traceMode{grid-column:3;display:flex!important;border-left:2px solid var(--ink)}
 .mode.makeMode{display:none!important}.resize{display:block;grid-column:2;cursor:col-resize;background:var(--paper);border-left:1px solid var(--ink);border-right:1px solid var(--ink)}.resize:active{background:var(--signal)}
 .dock{grid-template-columns:220px 220px 220px;justify-content:center}.dock button{border-left:2px solid var(--ink)}
 .sheet{left:auto;right:12px;width:520px;bottom:calc(var(--dock) + 10px);border:3px solid var(--ink);max-height:80dvh}.sheet.open{transform:translateY(0)}
 .tracePanel{padding-bottom:20px}.instrumentList{grid-template-columns:1fr 1fr 1fr}

}

<body>
<div class="loading" id="loading"></div>
<div class="app">
 <header class="top">
  <div class="brand">ES/TRACE<small>REQUISITE VARIETY</small></div>
  <div class="grow"></div>
  <div class="topStat" id="topStat">128 MIDI · 47 DRUMS · 4160 TAGS</div>
  <button class="topBtn ai" id="aiBtn">AI</button>
 </header>
 <main class="main" id="main">
  <section class="mode worldMode active" id="worldMode">
   <div class="worldHead">
    <div class="worldTabs"><button class="worldTab on" data-world="0">A</button><button class="worldTab" data-world="1">B</button><button class="worldTab" data-world="2">C</button></div>
    <div class="songMeta"><b id="songTitle">loading…</b><span id="songTags"></span></div><div class="grow"></div>
    <button class="mini" id="midiBtn">MIDI</button><button class="mini" id="diceBtn">↻</button>
   </div>
   <div class="timeline" id="timeline"><div class="timelineInner" id="timelineInner"><div class="measureGrid"></div><div class="beatGrid"></div><div class="playhead"></div><div id="lanes"></div></div></div>
  </section>
  <div class="resize" id="resize"></div>
  <section class="mode traceMode" id="traceMode">
   <div class="tracePanel">
    <div class="traceHero" id="traceHero">tap a sound</div>
    <div class="traceGrid" id="traceGrid"></div>
    <div class="causal" id="causal"></div>
    <div class="traceActions"><button id="instrumentBtn">INSTRUMENT</button><button id="sourceBtn">SOURCE</button></div>
    <div class="sourceBox" id="sourceBox"><textarea id="sourceText" spellcheck="false"></textarea><div class="sourceBtns"><button id="copySource">COPY</button><button id="applySource">APPLY</button></div></div>
    <div class="ai" style="margin-top:10px"><div class="keyRow"><input id="ask" placeholder="change selected…"><button class="topBtn" id="askBtn">AI</button></div></div>
    <div class="tx" id="tx"><div class="tabs"><button class="on" data-tab="result">RESULT</button><button data-tab="response">RESPONSE</button><button data-tab="reason">REASON</button><button data-tab="request">REQUEST</button></div><div class="txBody" id="txBody"></div></div>
   </div>
  </section>
 </main>
 <div class="status"><span class="pulse" id="pulse"></span><b id="statusVerb">READY</b><span class="grow" id="statusText">tap MAKE or PLAY</span><span id="laneCount">12 / 64</span></div>
 <nav class="dock"><button class="primary" id="makeBtn">MAKE</button><button id="playBtn">▶ PLAY</button><button id="traceBtn">TRACE</button></nav>
</div>

<section class="sheet" id="makeSheet">
 <div class="sheetHead"><b>MAKE 3</b><div class="grow"></div><button class="close" data-close="makeSheet">×</button></div>
 <div class="sheetBody">
  <textarea class="prompt" id="prompt" placeholder="gnawa bass + footwork + spectral strings + fluorescent airport"></textarea>
  <div class="makerRow"><button class="seg on" data-engine="ai">OPENAI</button><button class="seg" data-engine="local">LOCAL</button><button class="seg" id="surpriseBtn">SURPRISE</button></div>
  <div class="seedRow" id="seedRow"></div>
  <div class="varietyRead"><b>ABSORB</b> <span id="varietySummary">prompt → tags → rhythm → tuning → instruments → 3 divergent worlds</span><div class="tags" id="matchTags"></div></div>
  <div class="keyBox" id="keyBox"><div class="keyRow"><input id="keyInput" type="password" autocomplete="off" placeholder="OPENAI API KEY"><button class="topBtn" id="connectBtn">CONNECT</button></div><div class="keyMsg" id="keyMsg">key stays in this page only · local generation remains available</div></div>
  <button class="bigBtn" id="make3Btn">MAKE 3</button><button class="bigBtn secondary" id="local3Btn">LOCAL 3 NOW</button>
 </div>
</section>

<section class="sheet" id="instrumentSheet">
 <div class="sheetHead"><b>SOUND LIBRARY</b><div class="grow"></div><button class="close" data-close="instrumentSheet">×</button></div>
 <div class="sheetBody"><div class="makerRow" style="margin-top:0"><button class="seg on" data-soundkind="midi">MIDI · 128</button><button class="seg" data-soundkind="es">EARSKETCH · <span id="esCount">…</span></button></div><input class="instrumentSearch" id="instrumentSearch" placeholder="SEARCH SOUND" style="margin-top:8px"><div class="families" id="families"></div><div class="instrumentList" id="instrumentList"></div></div>
</section>
