<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>ORBITAL LOOM: MASONRY STACK</title>
    <style>
        :root {
            --c-gold: #D4AF37;
            --c-dark: #080808;
            --c-light: #e0e0e0;
            --c-active: #00ffaa;
            --font-stack: 'Courier New', Courier, monospace;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
        
        body {
            margin: 0; overflow: hidden;
            background-color: var(--c-dark);
            font-family: var(--font-stack);
            color: var(--c-light);
        }

        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between;
        }

        /* Top Bar */
        #top-hud {
            pointer-events: auto;
            padding: 20px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
            display: flex; justify-content: space-between; align-items: flex-start;
        }

        .brand {
            border-left: 4px solid var(--c-gold); padding-left: 12px;
        }
        .title { font-size: 18px; font-weight: 900; letter-spacing: 2px; color: var(--c-gold); }
        .subtitle { font-size: 10px; color: #888; text-transform: uppercase; margin-top: 4px; }

        #btn-engine {
            background: rgba(212, 175, 55, 0.15);
            border: 1px solid var(--c-gold); color: var(--c-gold);
            padding: 10px 20px; font-size: 11px; font-weight: bold;
            cursor: pointer; text-transform: uppercase;
            backdrop-filter: blur(4px);
        }
        #btn-engine.active { background: var(--c-gold); color: #000; box-shadow: 0 0 20px var(--c-gold); }

        /* XR Button Override */
        #XRButton {
            top: 20px !important; right: 20px !important; bottom: auto !important; left: auto !important;
            width: auto !important; background: rgba(0,20,10,0.9) !important;
            border: 1px solid var(--c-active) !important; color: var(--c-active) !important;
            font-family: var(--font-stack) !important; font-size: 11px !important;
            padding: 10px 20px !important; border-radius: 0 !important;
        }

        /* Toast */
        #toast {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85); border: 1px solid var(--c-active);
            color: var(--c-active); padding: 10px 20px; font-size: 14px; letter-spacing: 2px;
            opacity: 0; transition: opacity 0.3s; pointer-events: none;
            text-align: center; white-space: nowrap; border-radius: 4px;
            box-shadow: 0 0 30px rgba(0,255,170,0.2);
        }
        #toast.show { opacity: 1; }

        /* Bottom Deck */
        #deck-container {
            width: 100%; display: flex; justify-content: center;
            padding-bottom: max(30px, env(safe-area-inset-bottom));
            pointer-events: none;
        }

        #deck {
            pointer-events: auto;
            width: 95%; max-width: 460px;
            background: rgba(12, 12, 12, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 2px;
            padding: 15px;
            display: flex; flex-direction: column; gap: 15px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            position: relative;
        }
        
        /* Decorative screw heads */
        #deck::before, #deck::after {
            content: '+'; position: absolute; top: 10px; color: #333; font-family: monospace;
        }
        #deck::before { left: 10px; } #deck::after { right: 10px; }

        /* Mode Switcher */
        #mode-strip {
            display: flex; justify-content: center; gap: 20px; margin-bottom: 5px;
        }
        .mode-opt {
            font-size: 10px; color: #555; cursor: pointer; padding-bottom: 4px;
            border-bottom: 2px solid transparent; transition: all 0.2s;
        }
        .mode-opt.active { color: #fff; border-bottom-color: var(--c-gold); }

        /* Track Grid (8 Vertical Stacks visually) */
        #track-grid {
            display: grid; grid-template-columns: repeat(8, 1fr);
            gap: 6px; height: 44px;
        }
        .track-pad {
            background: #1a1a1a; border: 1px solid #333;
            display: flex; align-items: flex-end; justify-content: center;
            padding-bottom: 4px; cursor: pointer; position: relative;
            font-size: 9px; color: #666; font-weight: bold;
            transition: all 0.1s;
        }
        .track-pad.active {
            background: #2a2a2a; color: #fff;
            border-color: var(--t-color);
            box-shadow: 0 0 10px var(--t-color-dim);
        }
        .track-pad .bar {
            width: 4px; height: 4px; border-radius: 50%;
            background: var(--t-color); margin-bottom: 4px;
        }

        /* Controls */
        #controls {
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 10px;
        }

        #lcd-display {
            flex-grow: 1; text-align: center;
            font-family: monospace; font-size: 11px; color: var(--c-active);
            text-shadow: 0 0 8px rgba(0, 255, 170, 0.4);
            margin: 0 20px; overflow: hidden; white-space: nowrap;
        }

        .action-btn {
            width: 60px; height: 60px; border-radius: 50%;
            background: rgba(255,255,255,0.05); border: 2px solid #fff;
            color: #fff; font-size: 10px; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: transform 0.1s;
        }
        .action-btn:active { transform: scale(0.95); background: #fff; color: #000; }
        
        .tool-btn {
            width: 40px; height: 40px; border: 1px solid #444; background: transparent;
            color: #888; font-size: 9px; font-weight: bold; cursor: pointer;
        }
        .tool-btn:active { border-color: #fff; color: #fff; }

        /* Reticle */
        #reticle {
            position: absolute; top: 50%; left: 50%; width: 4px; height: 4px;
            transform: translate(-50%, -50%); background: #fff; border-radius: 50%;
            pointer-events: none; opacity: 0.5; transition: all 0.2s;
        }
        #reticle.active {
            width: 50px; height: 50px; background: transparent;
            border: 2px solid var(--c-active); opacity: 1;
            box-shadow: 0 0 20px var(--c-active);
        }

        /* Scanlines */
        #scanlines {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2;
            background: linear-gradient(rgba(0,0,0,0) 50%, rgba(0,0,0,0.15) 50%);
            background-size: 100% 4px; opacity: 0.6;
        }
    </style>
    <!-- Three.js Import -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="scanlines"></div>
    <div id="reticle"></div>

    <div id="ui-layer">
        <div id="top-hud">
            <div class="brand">
                <div class="title">ORBITAL LOOM</div>
                <div class="subtitle">MASONRY STACK // <span id="bpm-val">110</span> BPM</div>
            </div>
            <button id="btn-engine">START AUDIO</button>
        </div>

        <div id="toast">INIT SYSTEM</div>

        <div id="deck-container">
            <div id="deck">
                <div id="mode-strip">
                    <div class="mode-opt active" id="mode-place">PLACE BLOCK</div>
                    <div class="mode-opt" id="mode-tune">TUNE RING</div>
                </div>

                <div id="track-grid"></div>

                <div id="controls">
                    <button class="tool-btn" id="btn-del">DEL</button>
                    <div id="lcd-display">SELECT TRACK</div>
                    <button class="action-btn" id="btn-main">PLACE</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { XRButton } from 'three/addons/webxr/XRButton.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // --- CONFIG & DATA ---
        const CONFIG = {
            RINGS: 8,       // Vertical Tracks
            SLOTS: 16,      // Radial Steps
            RADIUS: 4,
            HEIGHT: 1.0,    // Ring Height
            BPM: 110
        };

        const TRACKS = [
            { name: "KICK", color: "#FF0055" },
            { name: "SNARE", color: "#FF5500" },
            { name: "HIHAT", color: "#FFCC00" },
            { name: "BASS", color: "#00FF55" },
            { name: "LEAD", color: "#00CCFF" },
            { name: "PAD", color: "#0055FF" },
            { name: "ARP", color: "#AA00FF" },
            { name: "NOISE", color: "#FFFFFF" }
        ];

        const GOLD_STATIONS = [
            { name: "GROOVE SALAD", url: "https://ice6.somafm.com/groovesalad-256-mp3" },
            { name: "DRONE ZONE", url: "https://ice6.somafm.com/dronezone-256-mp3" },
            { name: "DEF CON", url: "https://ice6.somafm.com/defcon-256-mp3" },
            { name: "SPACE STATION", url: "https://ice6.somafm.com/spacestation-128-mp3" },
            { name: "SECRET AGENT", url: "https://ice6.somafm.com/secretagent-128-mp3" }
        ];

        const MP3_CRATE = [
            { name: "ISTANA", bpm: 85 }, { name: "HOLY ERROR", bpm: 120 },
            { name: "AGOSTO", bpm: 95 }, { name: "EXCAVATION", bpm: 70 },
            { name: "TEST PATTERN", bpm: 140 }, { name: "AMBIENT 1", bpm: 0 },
            { name: "GLITCH 002", bpm: 130 }
        ];

        // --- STATE ---
        const state = {
            blocks: [],
            isPlaying: false,
            playheadAngle: 0,
            currentStep: 0,
            selectedTrack: 0,
            interactionMode: 'PLACE', // 'PLACE' or 'TUNE'
            hoverGrid: null, // { ringIdx, slotIdx }
            dragStart: null, // For tuning
            nextId: 1
        };

        // --- AUDIO ENGINE (HYBRID) ---
        class MasonAudio {
            constructor() {
                this.ctx = null;
                this.master = null;
                this.tracks = []; // 8 Track Objects

                // Pre-initialize tracks so UI can access names/types safely
                for(let i=0; i<CONFIG.RINGS; i++) {
                    this.tracks.push({
                        id: i,
                        type: i < 3 ? 'RADIO' : 'SYNTH', 
                        stationIdx: i % GOLD_STATIONS.length,
                        sampleIdx: i % MP3_CRATE.length,
                        audioEl: new Audio(),
                        sourceNode: null,
                        filter: null,
                        gain: null
                    });
                    this.tracks[i].audioEl.crossOrigin = "anonymous";
                    this.tracks[i].audioEl.loop = true;
                }
            }

            async init() {
                const AC = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AC();
                this.master = this.ctx.createGain();
                this.master.gain.value = 0.6;
                this.master.connect(this.ctx.destination);

                // Initialize Audio Nodes
                for(let i=0; i<CONFIG.RINGS; i++) {
                    const t = this.tracks[i];
                    
                    t.filter = this.ctx.createBiquadFilter();
                    t.gain = this.ctx.createGain();
                    
                    t.filter.connect(t.gain);
                    t.gain.connect(this.master);
                    t.gain.gain.value = 0; // Gate closed

                    // Setup Source if needed (safe to call now that ctx exists)
                    this.updateTrackSource(i);
                }
                
                await this.ctx.resume();
            }

            updateTrackSource(id) {
                const t = this.tracks[id];
                // Only manipulate nodes if they exist
                if(t.sourceNode) { 
                    try { t.sourceNode.disconnect(); } catch(e){} 
                    t.sourceNode = null;
                }

                if(t.type === 'RADIO') {
                    const st = GOLD_STATIONS[t.stationIdx];
                    t.audioEl.src = st.url;
                    
                    // Only attempt connections if AudioContext is initialized
                    if (this.ctx) {
                        try {
                            if (!t.sourceNode) t.sourceNode = this.ctx.createMediaElementSource(t.audioEl);
                            if (t.filter) t.sourceNode.connect(t.filter);
                            // We don't auto-play here, waiting for interaction or trigger to unmute
                            // t.audioEl.play().catch(e => console.log("Waiting for gesture...")); 
                        } catch(e) { console.warn(e); }
                    }
                    return st.name;
                } else {
                    return MP3_CRATE[t.sampleIdx].name; // Virtual Synth Mode
                }
            }

            trigger(id, duration) {
                if(!this.ctx || !this.tracks[id].gain) return;
                const t = this.tracks[id];
                const now = this.ctx.currentTime;

                if(t.type === 'RADIO') {
                    // Try to play if not playing
                    if(t.audioEl.paused) t.audioEl.play().catch(()=>{});
                    
                    // Gate the radio stream
                    t.gain.gain.cancelScheduledValues(now);
                    t.gain.gain.setValueAtTime(0, now);
                    t.gain.gain.linearRampToValueAtTime(0.8, now + 0.05);
                    t.gain.gain.linearRampToValueAtTime(0, now + duration);
                } else {
                    // Procedural Synth Fallback
                    const osc = this.ctx.createOscillator();
                    const env = this.ctx.createGain();
                    
                    const freqBase = 55 * (id + 1); // Harmonic series
                    osc.frequency.value = freqBase * (1 + (t.sampleIdx * 0.1)); // "Tuning" affects pitch
                    
                    osc.type = id % 2 === 0 ? 'square' : 'sawtooth';
                    if(id === 7) osc.type = 'triangle'; // Noise placeholder

                    osc.connect(env);
                    env.connect(this.master);
                    
                    env.gain.setValueAtTime(0.4, now);
                    env.gain.exponentialRampToValueAtTime(0.01, now + duration);
                    
                    osc.start(now);
                    osc.stop(now + duration);
                }
            }

            tune(trackId, delta) {
                const t = this.tracks[trackId];
                if(t.type === 'RADIO') {
                    let next = t.stationIdx + delta;
                    if(next >= GOLD_STATIONS.length) next = 0;
                    if(next < 0) next = GOLD_STATIONS.length - 1;
                    t.stationIdx = next;
                } else {
                    let next = t.sampleIdx + delta;
                    if(next >= MP3_CRATE.length) next = 0;
                    if(next < 0) next = MP3_CRATE.length - 1;
                    t.sampleIdx = next;
                }
                return this.updateTrackSource(trackId);
            }
        }

        // --- 3D SCENE ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x080808);
        scene.fog = new THREE.FogExp2(0x080808, 0.04);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 100);
        camera.position.set(0, 8, 14);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);

        document.body.appendChild(XRButton.createButton(renderer, {
            optionalFeatures: ['dom-overlay'],
            domOverlay: { root: document.getElementById('ui-layer') }
        }));

        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        bloom.threshold = 0; bloom.strength = 1.0; bloom.radius = 0.5;
        composer.addPass(bloom);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, (CONFIG.RINGS * CONFIG.HEIGHT)/2, 0);

        scene.add(new THREE.AmbientLight(0x404040, 2));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(5, 10, 5);
        scene.add(dirLight);

        // --- TOWER GEOMETRY ---
        const towerGroup = new THREE.Group();
        scene.add(towerGroup);

        // Core Texture
        const canvas = document.createElement('canvas');
        canvas.width = 512; canvas.height = 1024;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#111'; ctx.fillRect(0,0,512,1024);
        ctx.strokeStyle = '#333'; ctx.lineWidth = 2;
        // Draw bricks
        const rowH = 1024 / CONFIG.RINGS;
        for(let i=0; i<CONFIG.RINGS; i++) {
            const y = i * rowH;
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(512, y); ctx.stroke();
            // Offset logic
            const offset = (i % 2) * (512 / CONFIG.SLOTS / 2);
            for(let j=0; j<=CONFIG.SLOTS; j++) {
                const x = (j * (512/CONFIG.SLOTS)) + offset;
                ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y+rowH); ctx.stroke();
            }
        }
        const tex = new THREE.CanvasTexture(canvas);
        tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;

        // Core Cylinder
        const coreGeo = new THREE.CylinderGeometry(CONFIG.RADIUS-0.1, CONFIG.RADIUS-0.1, CONFIG.RINGS * CONFIG.HEIGHT, 32, 1);
        const coreMat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: 0.5, side: THREE.DoubleSide });
        const core = new THREE.Mesh(coreGeo, coreMat);
        core.position.y = (CONFIG.RINGS * CONFIG.HEIGHT) / 2 - (CONFIG.HEIGHT/2);
        towerGroup.add(core);

        // Hit Cylinder (For Raycast)
        const hitGeo = new THREE.CylinderGeometry(CONFIG.RADIUS+0.5, CONFIG.RADIUS+0.5, CONFIG.RINGS * CONFIG.HEIGHT, 32, 1);
        const hitMat = new THREE.MeshBasicMaterial({ visible: false, side: THREE.DoubleSide });
        const hitCylinder = new THREE.Mesh(hitGeo, hitMat);
        hitCylinder.position.y = core.position.y;
        towerGroup.add(hitCylinder);

        // Scanner Beam (Vertical)
        const scanGeo = new THREE.BoxGeometry(0.2, CONFIG.RINGS * CONFIG.HEIGHT + 2, 0.5);
        const scanMat = new THREE.MeshBasicMaterial({ color: 0x00ffaa, transparent: true, opacity: 0.5 });
        const scanner = new THREE.Mesh(scanGeo, scanMat);
        scanner.position.y = core.position.y;
        scanner.position.z = CONFIG.RADIUS + 1; // Start pos
        const pivot = new THREE.Group(); // Pivot at center
        pivot.add(scanner);
        scene.add(pivot);

        // Ghost Block (Arc)
        // Creating a curved block geometry
        function createArcBlock(color) {
            const innerR = CONFIG.RADIUS;
            const outerR = CONFIG.RADIUS + 0.6;
            const height = CONFIG.HEIGHT - 0.1;
            const arc = (Math.PI * 2) / CONFIG.SLOTS;
            
            const shape = new THREE.Shape();
            shape.absarc(0, 0, outerR, -arc/2 + 0.05, arc/2 - 0.05, false);
            shape.absarc(0, 0, innerR, arc/2 - 0.05, -arc/2 + 0.05, true); // hole
            
            const extrudeSettings = { depth: height, bevelEnabled: true, bevelSegments: 1, steps: 1, bevelSize: 0.05, bevelThickness: 0.05 };
            const geo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
            geo.rotateX(-Math.PI/2); // Align upright
            geo.center(); // Center pivot
            
            const mat = new THREE.MeshStandardMaterial({ 
                color: color, emissive: color, emissiveIntensity: 0.5,
                roughness: 0.3, metalness: 0.7
            });
            return new THREE.Mesh(geo, mat);
        }

        const ghost = createArcBlock(0xffffff);
        ghost.material = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: 0.3 });
        scene.add(ghost);

        // --- LOGIC ---
        const audio = new MasonAudio();
        const raycaster = new THREE.Raycaster();
        const clock = new THREE.Clock();

        const haptic = (p=10) => { if(navigator.vibrate) navigator.vibrate(p); };
        const showToast = (msg) => {
            const t = document.getElementById('toast');
            t.innerText = msg; t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 1500);
        };

        const getGridPos = (pt) => {
            let y = pt.y; if(y < 0) y = 0;
            const ringIdx = Math.floor(y / CONFIG.HEIGHT);
            
            const angle = Math.atan2(pt.x, pt.z); // Using X/Z for angle on XZ plane
            let normAngle = angle;
            if(normAngle < 0) normAngle += Math.PI * 2;
            
            // Apply offset for odd rings (Running Bond)
            const stepRad = (Math.PI * 2) / CONFIG.SLOTS;
            if (ringIdx % 2 === 1) {
                normAngle -= (stepRad / 2);
                if(normAngle < 0) normAngle += Math.PI * 2;
            }

            const slotIdx = Math.floor( (normAngle / (Math.PI * 2)) * CONFIG.SLOTS ) % CONFIG.SLOTS;
            return { ringIdx: Math.min(ringIdx, CONFIG.RINGS-1), slotIdx };
        };

        const placeGhost = (grid) => {
            const angleStep = (Math.PI * 2) / CONFIG.SLOTS;
            let angle = grid.slotIdx * angleStep + (angleStep/2); // Center of slot
            
            // Apply Offset
            if (grid.ringIdx % 2 === 1) angle += (angleStep / 2);

            const y = (grid.ringIdx * CONFIG.HEIGHT) + (CONFIG.HEIGHT/2);
            
            // Convert polar to cartesian
            // Note: atan2(x, z) implies z is cos, x is sin or similar.
            // Standard: x = r*sin(a), z = r*cos(a)
            ghost.position.set(Math.sin(angle) * CONFIG.RADIUS, y, Math.cos(angle) * CONFIG.RADIUS);
            ghost.rotation.y = angle;
        };

        const handleInteract = () => {
            if(!state.hoverGrid) return;
            haptic(20);

            if (state.interactionMode === 'PLACE') {
                // Toggle Block
                const existingIdx = state.blocks.findIndex(b => b.ring === state.hoverGrid.ringIdx && b.slot === state.hoverGrid.slotIdx);
                
                if (existingIdx >= 0) {
                    towerGroup.remove(state.blocks[existingIdx].mesh);
                    state.blocks.splice(existingIdx, 1);
                } else {
                    const ringId = state.hoverGrid.ringIdx; // Height determines Track
                    const color = TRACKS[ringId].color;
                    const mesh = createArcBlock(color);
                    
                    // Align
                    mesh.position.copy(ghost.position);
                    mesh.rotation.copy(ghost.rotation);
                    
                    towerGroup.add(mesh);
                    state.blocks.push({ id: state.nextId++, ring: ringId, slot: state.hoverGrid.slotIdx, mesh });
                    
                    audio.trigger(ringId, 0.1);
                }
            } else {
                // Tune Ring (Start Drag)
                state.dragStart = { x: 0, ring: state.hoverGrid.ringIdx }; // Simplified click-to-tune for now
                const name = audio.tune(state.hoverGrid.ringIdx, 1);
                document.getElementById('lcd-display').innerText = `TUNED: ${name}`;
                showToast(name);
            }
        };

        // --- RENDER LOOP ---
        const controller = renderer.xr.getController(0);
        controller.addEventListener('select', handleInteract);
        scene.add(controller);

        renderer.setAnimationLoop(() => {
            // Raycasting
            if(renderer.xr.isPresenting) raycaster.setFromCamera({x:0,y:0}, camera);
            else raycaster.setFromCamera({x:0,y:0}, camera);

            const hits = raycaster.intersectObject(hitCylinder);
            const reticle = document.getElementById('reticle');

            if(hits.length > 0) {
                const grid = getGridPos(hits[0].point);
                state.hoverGrid = grid;
                
                placeGhost(grid);
                ghost.visible = true;
                
                // Reticle styling
                const trackColor = TRACKS[grid.ringIdx].color;
                reticle.classList.add('active');
                reticle.style.borderColor = trackColor;
                reticle.style.boxShadow = `0 0 15px ${trackColor}`;
                
                // If Mode is TUNE, highlight entire ring? (Advanced visual, skipping for perf)
                if(state.interactionMode === 'PLACE') {
                    ghost.material.color.set(trackColor);
                } else {
                    ghost.material.color.set(0xffffff); // White for tool
                }

            } else {
                ghost.visible = false;
                state.hoverGrid = null;
                reticle.classList.remove('active');
            }

            // Sequencer
            if(state.isPlaying) {
                const dt = clock.getDelta();
                // Rotate Scanner
                const speed = (Math.PI * 2) * (CONFIG.BPM / 60) / 16; // 1 bar = 4 beats = 16 steps? No, 16 steps = 1 bar.
                // If 16 steps = 4 beats. 1 beat = 4 steps.
                // BPM = Beats Per Minute. 
                // Rotations per minute = BPM / 4.
                // Rads per sec = (BPM / 4) * 2PI / 60
                const rps = (CONFIG.BPM / 60) / 4; 
                pivot.rotation.y += rps * (Math.PI * 2) * dt;
                
                // Calc step
                // Normalize rotation to 0..1
                let normRot = (pivot.rotation.y % (Math.PI*2)) / (Math.PI*2);
                if(normRot < 0) normRot += 1;
                const currentStep = Math.floor(normRot * CONFIG.SLOTS);

                if(currentStep !== state.currentStep) {
                    state.currentStep = currentStep;
                    // Trigger
                    const active = state.blocks.filter(b => b.slot === currentStep);
                    active.forEach(b => {
                        // Offset timing for odd rings?
                        // Visually the scanner hits them at different times due to geometry? 
                        // Our scanner is straight vertical. Our blocks are rotated.
                        // So a straight scanner hits offset blocks later?
                        // Yes! Because we rotated the blocks, their center is at a different angle.
                        // So strictly speaking, we should trigger based on angle match.
                        // Simplified: Trigger now. 
                        audio.trigger(b.ring, 0.2);
                        b.mesh.scale.set(1.2, 1.2, 1.2);
                    });
                }
            }

            // Anim
            state.blocks.forEach(b => b.mesh.scale.lerp(new THREE.Vector3(1,1,1), 0.1));
            
            if(renderer.xr.isPresenting) renderer.render(scene, camera);
            else composer.render();
        });

        // --- UI ---
        const initBtn = document.getElementById('btn-engine');
        initBtn.onclick = async () => {
            if(!audio.ctx) await audio.init();
            else if(audio.ctx.state === 'suspended') audio.ctx.resume();
            state.isPlaying = !state.isPlaying;
            initBtn.innerText = state.isPlaying ? "STOP AUDIO" : "RESUME";
            initBtn.classList.toggle('active', state.isPlaying);
        };

        // Grid UI
        const gridUI = document.getElementById('track-grid');
        TRACKS.forEach((t, i) => {
            const div = document.createElement('div');
            div.className = `track-pad`;
            div.style.setProperty('--t-color', t.color);
            div.style.setProperty('--t-color-dim', t.color + '44');
            div.innerHTML = `<div class="bar"></div>${t.name}`;
            div.onclick = () => {
                haptic();
                // Selecting a track in the UI just highlights it, 
                // but in this Masonry mode, height determines track.
                // So this UI is mostly for Reference or Solo/Mute (future).
                document.getElementById('lcd-display').innerText = `${t.name}: ${audio.updateTrackSource(i)}`;
            };
            gridUI.appendChild(div);
        });

        // Mode Switch
        const mPlace = document.getElementById('mode-place');
        const mTune = document.getElementById('mode-tune');
        const mainBtn = document.getElementById('btn-main');

        mPlace.onclick = () => setMode('PLACE');
        mTune.onclick = () => setMode('TUNE');

        function setMode(m) {
            haptic();
            state.interactionMode = m;
            mPlace.classList.toggle('active', m === 'PLACE');
            mTune.classList.toggle('active', m === 'TUNE');
            mainBtn.innerText = m;
            mainBtn.style.borderColor = m === 'PLACE' ? '#fff' : 'var(--c-gold)';
            mainBtn.style.color = m === 'PLACE' ? '#fff' : 'var(--c-gold)';
        }

        // Bottom Btns
        document.getElementById('btn-main').onclick = handleInteract;
        document.getElementById('btn-del').onclick = () => {
            // Delete mode logic or instant delete hover?
            // Let's make it delete hover
            if(state.hoverGrid) {
                haptic();
                const idx = state.blocks.findIndex(b => b.ring === state.hoverGrid.ringIdx && b.slot === state.hoverGrid.slotIdx);
                if(idx >= 0) { towerGroup.remove(state.blocks[idx].mesh); state.blocks.splice(idx, 1); }
            }
        };

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight); composer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
