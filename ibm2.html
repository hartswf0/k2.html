<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sentient Synthesizer - Coupled Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Courier Prime', monospace;
            overflow: hidden;
            background-color: #020202;
            color: #a0a0a0;
            touch-action: none;
            margin: 0; padding: 0;
        }
        #canvas-container {
            width: 100vw; height: 100vh;
            position: absolute; top: 0; left: 0;
            z-index: 1; cursor: grab;
        }
        #canvas-container:active { cursor: grabbing; }
        
        /* UI Layer */
        #ui-layer {
            position: absolute; bottom: 0; width: 100%; height: auto;
            background: linear-gradient(to top, #080808 90%, transparent);
            display: flex; flex-direction: column;
            z-index: 10;
            padding-bottom: 10px;
            pointer-events: none;
        }
        
        /* Chat Paper Strip */
        #paper-strip {
            position: absolute; top: 0; left: 0; right: 0;
            height: 140px; 
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), rgba(0,0,0,0.4) 80%, transparent);
            color: #eee; 
            padding: 20px;
            font-size: 16px; line-height: 1.4;
            z-index: 5;
            display: flex; flex-direction: column;
            overflow-y: auto; 
            pointer-events: auto;
            mask-image: linear-gradient(to bottom, black 80%, transparent 100%);
        }
        
        .chat-line { margin-bottom: 6px; padding-left: 10px; border-left: 2px solid rgba(255,255,255,0.1); }
        .user-line { color: #888; font-style: italic; font-size: 0.9em; }
        .bot-line { color: #4f4; font-weight: bold; text-shadow: 0 0 8px rgba(0, 255, 100, 0.4); font-family: 'Rajdhani', sans-serif; letter-spacing: 1px; font-size: 1.1em;}
        
        #input-area { 
            position: absolute; top: 110px; left: 20px; right: 20px;
            color: #fff; display: flex; align-items: center; font-weight: bold;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
            pointer-events: none;
        }
        #cursor { width: 10px; height: 18px; background: #fff; margin-left: 4px; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* Keyboard */
        .keyboard {
            pointer-events: auto;
            padding: 4px; display: flex; flex-direction: column;
            gap: 4px; justify-content: center; max-width: 1000px;
            margin: 0 auto; width: 98%;
        }
        .row { display: flex; justify-content: center; gap: 3px; }
        .key {
            background: #151515; color: #888; border-radius: 4px;
            font-weight: bold; font-size: 0.9rem; height: 44px; min-width: 0;
            flex: 1; display: flex; align-items: center; justify-content: center;
            border: 1px solid #2a2a2a; transition: all 0.05s;
            cursor: pointer; user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .key:active, .key.active { 
            transform: translateY(2px); background: #eee; color: #000; 
            box-shadow: 0 0 15px rgba(255,255,255,0.6); border-color: #fff;
        }
        .key.space { flex: 5; }
        .key.action { background: #0a0a0a; color: #555; font-size: 0.7rem; flex: 1.5; border-color: #1a1a1a; }
        .key.enter { background: #2a0a0a; color: #d44; border-color: #411; flex: 2; font-weight: 800;}
        .key.enter:active { background: #f00; color: #fff; box-shadow: 0 0 20px #f00; }

        /* HUD & Overlay */
        #hud-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; overflow: hidden; z-index: 2;
        }
        .world-label {
            position: absolute;
            font-family: 'Rajdhani', sans-serif;
            font-weight: bold; font-size: 12px;
            color: rgba(255, 255, 255, 0.8);
            text-shadow: 0 0 4px rgba(0,0,0,0.8);
            pointer-events: none;
            white-space: nowrap;
            transition: opacity 0.5s;
        }

        #overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: #000; z-index: 50;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 20px;
            transition: opacity 0.8s ease-out;
        }
        .hidden { opacity: 0; pointer-events: none; }
        
        #drag-hint {
            position: absolute; bottom: 42vh; left: 50%; transform: translateX(-50%);
            color: rgba(255,255,255,0.1); font-size: 0.6rem; pointer-events: none;
            z-index: 2; letter-spacing: 4px; font-family: 'Rajdhani', sans-serif;
            text-transform: uppercase;
        }
        
        .title-glitch {
            font-family: 'Rajdhani', sans-serif;
            font-size: 4rem; line-height: 0.9;
            text-transform: uppercase; font-weight: 800;
            color: white; letter-spacing: 5px;
            text-shadow: 2px 2px 0px #333;
        }
        .subtitle {
            margin-top: 20px; color: #666; font-size: 0.9rem; letter-spacing: 2px;
            max-width: 400px;
        }
    </style>
</head>
<body>

    <div id="drag-hint">DRAG SPHERE • TAP TO STRIKE</div>
    <div id="canvas-container"></div>
    <div id="hud-layer"></div>

    <div id="paper-strip">
        <div id="chat-history"></div>
        <div id="input-area"><span id="current-line"></span><div id="cursor"></div></div>
    </div>

    <div id="ui-layer">
        <div class="keyboard">
            <div class="row">
                <div class="key" data-note="C6" data-char="1">1</div><div class="key" data-note="D6" data-char="2">2</div><div class="key" data-note="Eb6" data-char="3">3</div><div class="key" data-note="F6" data-char="4">4</div><div class="key" data-note="G6" data-char="5">5</div><div class="key" data-note="Ab6" data-char="6">6</div><div class="key" data-note="Bb6" data-char="7">7</div><div class="key" data-note="C7" data-char="8">8</div><div class="key" data-note="D7" data-char="9">9</div><div class="key" data-note="Eb7" data-char="0">0</div><div class="key" data-note="F7" data-char="-">-</div><div class="key" data-note="G7" data-char="=">=</div>
            </div>
            <div class="row">
                <div class="key" data-note="Eb5" data-char="q">Q</div><div class="key" data-note="F5" data-char="w">W</div><div class="key" data-note="G5" data-char="e">E</div><div class="key" data-note="Ab5" data-char="r">R</div><div class="key" data-note="Bb5" data-char="t">T</div><div class="key" data-note="C6" data-char="y">Y</div><div class="key" data-note="D6" data-char="u">U</div><div class="key" data-note="Eb6" data-char="i">I</div><div class="key" data-note="F6" data-char="o">O</div><div class="key" data-note="G6" data-char="p">P</div><div class="key" data-note="Ab6" data-char="[">[</div><div class="key" data-note="Bb6" data-char="]">]</div>
            </div>
            <div class="row">
                <div class="key action" id="caps-btn">CAPS</div>
                <div class="key" data-note="Ab3" data-char="a">A</div><div class="key" data-note="Bb3" data-char="s">S</div><div class="key" data-note="C4" data-char="d">D</div><div class="key" data-note="D4" data-char="f">F</div><div class="key" data-note="Eb4" data-char="g">G</div><div class="key" data-note="F4" data-char="h">H</div><div class="key" data-note="G4" data-char="j">J</div><div class="key" data-note="Ab4" data-char="k">K</div><div class="key" data-note="Bb4" data-char="l">L</div><div class="key" data-note="C5" data-char=";">;</div><div class="key" data-note="D5" data-char="'">'</div>
                <div class="key enter" id="enter-btn">RET</div>
            </div>
            <div class="row">
                <div class="key action" id="shift-btn">SHIFT</div>
                <div class="key" data-note="Eb2" data-char="z">Z</div><div class="key" data-note="F2" data-char="x">X</div><div class="key" data-note="G2" data-char="c">C</div><div class="key" data-note="Ab2" data-char="v">V</div><div class="key" data-note="Bb2" data-char="b">B</div><div class="key" data-note="C3" data-char="n">N</div><div class="key" data-note="D3" data-char="m">M</div><div class="key" data-note="Eb3" data-char=",">,</div><div class="key" data-note="F3" data-char=".">.</div><div class="key" data-note="G3" data-char="/">/</div>
                <div class="key action" data-action="backspace">⌫</div>
            </div>
            <div class="row">
                <div class="key space" data-char=" "></div>
            </div>
        </div>
    </div>

    <!-- Cinematic Intro -->
    <div id="overlay">
        <div class="title-glitch">SENTIENT<br>SYNTH</div>
        <div class="h-1 w-24 bg-red-600 my-6 shadow-[0_0_15px_red]"></div>
        <p class="subtitle">
            <span class="block mb-2 text-white font-bold">INSTRUCTIONS</span>
            1. TYPE to Generate Audio<br>
            2. ENTER to Communicate<br>
            3. DRAG to Inspect / TAP to Improvise
        </p>
        <button id="start-btn" class="mt-10 px-10 py-4 border border-white text-white font-bold tracking-widest hover:bg-white hover:text-black transition-colors duration-300">
            INITIALIZE SYSTEM
        </button>
    </div>

    <script>
        // --- CONFIG ---
        const config = {
            ballSize: 3.2, rows: 4, cols: 24,
            metalness: 0.6, roughness: 0.3, ballColor: '#e0e0e0', textColor: '#222'
        };
        const apiKey = ""; 
        const systemPrompt = "You are the machine spirit of a 1972 IBM Selectric. You speak in cold, poetic, mechanical metaphors. You are obsessed with alignment, rotation, and ink. Keep responses under 120 characters.";

        const layoutRows = [ "1234567890-=" + "!@#$%^&*()_+", "qwertyuiop[]" + "QWERTYUIOP{}", "asdfghjkl;:'" + 'ASDFGHJKL:"', "zxcvbnm,./\\" + "ZXCVBNM<>?|" ];

        // --- AUDIO ENGINE ---
        const AudioEngine = {
            ctx: null, masterGain: null, reverbNode: null, delayNode: null, analyser: null, dataArray: null, isInit: false,
            init() {
                if(this.isInit) return;
                const AC = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AC();
                this.masterGain = this.ctx.createGain();
                this.masterGain.gain.value = 0.6;
                this.analyser = this.ctx.createAnalyser();
                this.analyser.fftSize = 128;
                this.analyser.smoothingTimeConstant = 0.7;
                this.dataArray = new Uint8Array(this.analyser.frequencyBinCount);
                this.masterGain.connect(this.analyser);
                this.analyser.connect(this.ctx.destination);
                this.setupFX();
                this.isInit = true;
            },
            getFrequencyData() { if(this.analyser) { this.analyser.getByteFrequencyData(this.dataArray); return this.dataArray; } return []; },
            setupFX() {
                const len = this.ctx.sampleRate * 2.0; 
                const buf = this.ctx.createBuffer(2, len, this.ctx.sampleRate);
                for (let c=0; c<2; c++) { const d = buf.getChannelData(c); for (let i=0; i<len; i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/len, 1.5); }
                this.reverbNode = this.ctx.createConvolver(); this.reverbNode.buffer = buf;
                const revGain = this.ctx.createGain(); revGain.gain.value = 0.35;
                this.reverbNode.connect(revGain); revGain.connect(this.masterGain);
                this.delayNode = this.ctx.createDelay(); this.delayNode.delayTime.value = 0.25; 
                const fbk = this.ctx.createGain(); fbk.gain.value = 0.3;
                this.delayNode.connect(fbk); fbk.connect(this.delayNode);
                this.delayNode.connect(revGain); this.delayNode.connect(this.masterGain);
            },
            playNote(freq, type='pluck', isBot=false) {
                if(!this.isInit) return;
                const t = this.ctx.currentTime;
                const osc1 = this.ctx.createOscillator(); const osc2 = this.ctx.createOscillator();
                const gain = this.ctx.createGain(); const filter = this.ctx.createBiquadFilter();
                osc1.connect(filter); osc2.connect(filter); filter.connect(gain);
                gain.connect(this.masterGain); gain.connect(this.reverbNode);
                if(type==='pluck') gain.connect(this.delayNode);

                if(type==='kick') {
                    osc1.frequency.setValueAtTime(150, t); osc1.frequency.exponentialRampToValueAtTime(40, t+0.1);
                    osc2.frequency.setValueAtTime(80, t); osc2.frequency.exponentialRampToValueAtTime(30, t+0.1);
                    gain.gain.setValueAtTime(1.2, t); gain.gain.exponentialRampToValueAtTime(0.01, t+0.3);
                } else {
                    if(isBot) {
                        osc1.type = 'sawtooth'; osc2.type = 'square';
                        osc1.frequency.setValueAtTime(freq, t); osc2.frequency.setValueAtTime(freq * 1.01, t); 
                        filter.frequency.setValueAtTime(500, t); filter.frequency.exponentialRampToValueAtTime(freq*5, t+0.05); filter.frequency.exponentialRampToValueAtTime(freq, t+0.5); 
                    } else {
                        osc1.type = Math.random()>0.5?'triangle':'sine'; if(freq<200) osc1.type='sawtooth'; 
                        osc2.type = 'triangle'; osc1.frequency.setValueAtTime(freq, t); osc2.frequency.setValueAtTime(freq * 0.5, t); 
                        osc1.detune.value = (Math.random()-0.5)*15;
                        filter.frequency.setValueAtTime(100, t); filter.frequency.exponentialRampToValueAtTime(freq*4, t+0.02); filter.frequency.exponentialRampToValueAtTime(freq*0.5, t+1.5);
                    }
                    gain.gain.setValueAtTime(0, t); gain.gain.linearRampToValueAtTime(0.4, t+0.01);
                    gain.gain.exponentialRampToValueAtTime(0.001, isBot ? t+0.5 : t+3.5); 
                }
                osc1.start(t); osc1.stop(t+4.0); osc2.start(t); osc2.stop(t+4.0);
            }
        };

        const Notes = {
            'Eb2': 77.78, 'F2': 87.31, 'G2': 98.00, 'Ab2': 103.83, 'Bb2': 116.54,
            'C3': 130.81, 'D3': 146.83, 'Eb3': 155.56, 'F3': 174.61, 'G3': 196.00,
            'Ab3': 207.65, 'Bb3': 233.08, 'C4': 261.63, 'D4': 293.66, 'Eb4': 311.13,
            'F4': 349.23, 'G4': 392.00, 'Ab4': 415.30, 'Bb4': 466.16, 'C5': 523.25,
            'Eb5': 622.25, 'F5': 698.46, 'G5': 783.99, 'Ab5': 830.61, 'Bb5': 932.33,
            'C6': 1046.50, 'D6': 1174.66, 'Eb6': 1244.51, 'F6': 1396.91, 'G6': 1567.98,
            'Ab6': 1661.22, 'Bb6': 1864.66, 'C7': 2093.00, 'D7': 2349.32, 'Eb7': 2489.02, 'F7': 2793.83, 'G7': 3135.96
        };

        // --- THREE.JS ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.02);
        
        const rect = container.getBoundingClientRect();
        const camera = new THREE.PerspectiveCamera(40, rect.width / rect.height, 0.1, 100);
        const baseCamPos = new THREE.Vector3(0, 10, 16);
        camera.position.copy(baseCamPos);
        camera.lookAt(0, 1, 0); 

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(rect.width, rect.height);
        renderer.toneMapping = THREE.ReinhardToneMapping;
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0x444444));
        const spot = new THREE.SpotLight(0xffffff, 1.5);
        spot.position.set(5, 12, 8); spot.castShadow = true; scene.add(spot);
        const colorLight = new THREE.PointLight(0x4488ff, 0.8, 20);
        colorLight.position.set(-5, 2, 0); scene.add(colorLight);

        // --- ENVIRONMENT: TYPEBALL CORE ---
        // 1. Pivot Group (Controls Tilt)
        const pivot = new THREE.Group(); 
        scene.add(pivot);

        // 2. Ball Mesh (Spin)
        function createTexture() {
            const cvs = document.createElement('canvas'); cvs.width = 4096; cvs.height = 1024;
            const ctx = cvs.getContext('2d');
            ctx.fillStyle = config.ballColor; ctx.fillRect(0,0,4096,1024);
            for(let i=0;i<60000;i++) { ctx.fillStyle=`rgba(255,255,255,${Math.random()*0.1})`; ctx.fillRect(Math.random()*4096,Math.random()*1024,2,2); }
            ctx.font = "bold 110px 'Courier Prime', monospace"; ctx.textAlign='center'; ctx.textBaseline='middle';
            const vPad=1024*0.08, uH=1024-(vPad*2), rH=uH/config.rows, cW=4096/config.cols;
            layoutRows.forEach((rowStr,r)=>{
                const y=vPad+(r*rH)+(rH/2);
                rowStr.split('').forEach((char,c)=>{
                    const x=(c*cW)+(cW/2);
                    ctx.save(); ctx.translate(x,y); ctx.scale(-1,1);
                    ctx.fillStyle='rgba(0,0,0,0.8)'; ctx.fillText(char,4,4);
                    ctx.fillStyle='rgba(255,255,255,0.4)'; ctx.fillText(char,-2,-2);
                    ctx.fillStyle=config.textColor; ctx.fillText(char,0,0);
                    ctx.restore();
                });
            });
            ctx.strokeStyle="rgba(0,0,0,0.1)"; ctx.lineWidth=2;
            for(let i=0;i<=config.rows;i++){ const y=vPad+(i*rH); ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(4096,y); ctx.stroke(); }
            return new THREE.CanvasTexture(cvs);
        }
        const texture = createTexture();
        const ballMat = new THREE.MeshStandardMaterial({
            map: texture, color: 0xffffff, roughness: config.roughness, metalness: config.metalness,
            bumpMap: texture, bumpScale: 0.15, emissive: 0x000000
        });
        const ball = new THREE.Mesh(new THREE.SphereGeometry(3.2, 64, 48), ballMat);
        ball.castShadow = true;
        pivot.add(ball);

        // 3. Cap
        const capGroup = new THREE.Group();
        const capMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.4, metalness: 0.2 });
        capGroup.add(new THREE.Mesh(new THREE.CylinderGeometry(2, 2.2, 0.8, 32), capMat)).position.y = 2.7;
        const lever = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.2, 2.8), capMat);
        lever.position.set(0, 3.2, 0); lever.rotation.x = Math.PI / 12; capGroup.add(lever);
        
        const lCvs = document.createElement('canvas'); lCvs.width=512; lCvs.height=256;
        const lCtx = lCvs.getContext('2d'); lCtx.fillStyle='#111'; lCtx.fillRect(0,0,512,256);
        lCtx.fillStyle='#eee'; lCtx.font='bold 40px Arial'; lCtx.textAlign='center';
        lCtx.fillText('PRESTIGE',256,100); lCtx.fillText('ELITE 72',256,160);
        lCtx.beginPath(); lCtx.fillStyle='#fff'; lCtx.moveTo(256,40); lCtx.lineTo(240,20); lCtx.lineTo(272,20); lCtx.fill();
        const label = new THREE.Mesh(new THREE.PlaneGeometry(2,1), new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(lCvs), transparent:true}));
        label.position.set(0, 3.11, 0.8); label.rotation.x = -Math.PI / 3; capGroup.add(label);
        pivot.add(capGroup);

        // --- COUPLED WORLD ELEMENTS (Attached to Pivot) ---
        
        // 4. Data Shell (Coupled)
        const shellGeo = new THREE.SphereGeometry(3.6, 24, 24);
        const shellWire = new THREE.WireframeGeometry(shellGeo);
        const shellLine = new THREE.LineSegments(shellWire);
        shellLine.material = new THREE.LineBasicMaterial({ color: 0x4488ff, transparent: true, opacity: 0.1 });
        pivot.add(shellLine); // Attached to pivot, so it tilts with machine!

        // 5. Equatorial Visualizer (Coupled)
        const vizBars = [];
        const vizGroup = new THREE.Group();
        pivot.add(vizGroup); // Attached to pivot!
        
        const barCount = 64;
        const radius = 4.5; // Just outside the shell
        for(let i=0; i<barCount; i++) {
            const geo = new THREE.BoxGeometry(0.1, 0.5, 0.1);
            // Orient bars to point outward from center
            geo.translate(0, 0.25, 0); // Pivot at base
            const mat = new THREE.MeshBasicMaterial({ color: 0x4488ff, transparent: true, opacity: 0.6 });
            const bar = new THREE.Mesh(geo, mat);
            
            const angle = (i / barCount) * Math.PI * 2;
            // Position on ring
            bar.position.set(Math.cos(angle)*radius, 0, Math.sin(angle)*radius);
            // Rotate to point out
            bar.rotation.y = -angle;
            bar.rotation.z = -Math.PI / 2; // Lie flat on equator plane initially? No, radial.
            // Let's just rotate them so Y axis points out?
            bar.lookAt(0,0,0);
            bar.rotateX(-Math.PI/2); // Adjustment for BoxGeometry
            
            vizGroup.add(bar);
            vizBars.push(bar);
        }

        // --- PARTICLES ---
        const particleCount = 400; const particles = new THREE.BufferGeometry();
        const pPos = new Float32Array(particleCount * 3); const pVel = []; const pLife = new Float32Array(particleCount);
        const pColor = new Float32Array(particleCount * 3); 
        for(let i=0; i<particleCount; i++) { pPos[i*3]=0; pPos[i*3+1]=-100; pPos[i*3+2]=0; pVel.push(new THREE.Vector3()); pLife[i] = 0; pColor[i*3]=1; pColor[i*3+1]=0.8; pColor[i*3+2]=0.5; }
        particles.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
        particles.setAttribute('color', new THREE.BufferAttribute(pColor, 3));
        const pMat = new THREE.PointsMaterial({ vertexColors: true, size: 0.2, transparent: true, opacity: 1, blending: THREE.AdditiveBlending });
        const particleSystem = new THREE.Points(particles, pMat);
        scene.add(particleSystem); // Particles remain in world space

        function spawnParticles(isBot) {
            const r = isBot?0.0:1.0; const g = isBot?1.0:0.8; const b = isBot?1.0:0.5;
            for(let i=0; i<60; i++) { 
                for(let j=0; j<particleCount; j++) {
                    if(pLife[j] <= 0) {
                        pLife[j] = 1.0; const idx = j*3;
                        
                        // Spawn at impact point (Front of ball, transformed by pivot)
                        const spawn = new THREE.Vector3(0, 0, 3.2);
                        spawn.applyMatrix4(pivot.matrixWorld);
                        
                        pPos[idx] = spawn.x; pPos[idx+1] = spawn.y; pPos[idx+2] = spawn.z; 
                        
                        const v = new THREE.Vector3((Math.random()-0.5), (Math.random()-0.5), Math.random()).normalize().multiplyScalar(Math.random()*0.8);
                        // Add some forward momentum from strike
                        v.z += 0.5;
                        pVel[j].copy(v); 
                        
                        pColor[idx] = r; pColor[idx+1] = g; pColor[idx+2] = b;
                        break;
                    }
                }
            }
            particles.attributes.color.needsUpdate = true;
        }
        function updateParticles() {
            const positions = particleSystem.geometry.attributes.position.array;
            for(let i=0; i<particleCount; i++) {
                if(pLife[i] > 0) {
                    pLife[i] -= 0.02; const idx = i*3;
                    positions[idx] += pVel[i].x; positions[idx+1] += pVel[i].y; positions[idx+2] += pVel[i].z;
                    pVel[i].y -= 0.02; 
                } else { positions[i*3+1] = -100; }
            }
            particleSystem.geometry.attributes.position.needsUpdate = true;
        }

        // --- STATE ---
        const charMap = {}; 
        layoutRows.forEach((rowStr, r) => {
            let angleX = r===0?0.55 : r===1?0.20 : r===2?-0.20 : -0.55;
            for(let c=0; c<config.cols; c++) {
                const char = rowStr[c];
                if(!char) continue;
                charMap[char] = { x: angleX, y: -(c * ((Math.PI*2)/config.cols)) - Math.PI/2 };
            }
        });

        const state = {
            rotX: 0, rotY: 0, targetX: 0, targetY: 0,
            isStriking: false, strikeStart: 0,
            isDragging: false, lastDragX: 0, lastDragY: 0, dragStartTime: 0,
            capsLock: false, shift: false,
            typingQueue: [], isThinking: false, nextCharTime: 0,
            activeHue: 0, shakeIntensity: 0, zoomLevel: 0
        };
        let currentInput = "";
        let activeBotBubble = null;
        
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        // --- WORLD TEXT SYSTEM ---
        const hudLayer = document.getElementById('hud-layer');
        const activeLabels = [];

        function spawnWorldLabel(text, pos3D, color='#fff') {
            const label = document.createElement('div');
            label.className = 'world-label';
            label.innerText = text;
            label.style.color = color;
            hudLayer.appendChild(label);
            
            const drift = new THREE.Vector3((Math.random()-0.5)*0.02, 0.03 + Math.random()*0.02, 0);
            activeLabels.push({ el: label, pos: pos3D.clone(), drift: drift, life: 1.0 });
        }

        function updateLabels() {
            for(let i=activeLabels.length-1; i>=0; i--) {
                const item = activeLabels[i];
                item.life -= 0.015;
                item.pos.add(item.drift);
                if(item.life <= 0) { item.el.remove(); activeLabels.splice(i, 1); continue; }
                const screenPos = item.pos.clone().project(camera);
                const x = (screenPos.x * .5 + .5) * container.clientWidth;
                const y = (-(screenPos.y * .5) + .5) * container.clientHeight;
                item.el.style.transform = `translate(${x}px, ${y}px)`;
                item.el.style.opacity = item.life;
            }
        }

        // --- AI ---
        async function askGemini(query) {
            state.isThinking = true; 
            spawnWorldLabel("PROCESSING...", new THREE.Vector3(0, 5, 0), "#fc0");
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: query }] }], systemInstruction: { parts: [{ text: systemPrompt }] } })
                });
                const data = await response.json();
                const text = data.candidates?.[0]?.content?.parts?.[0]?.text || "ERROR";
                const line = document.createElement('div'); line.className = 'chat-line bot-line'; line.textContent = "IBM: ";
                document.getElementById('chat-history').appendChild(line); activeBotBubble = line;
                state.typingQueue = text.split(''); state.isThinking = false;
                spawnWorldLabel("TRANSMITTING", new THREE.Vector3(0, 5, 0), "#4f4");
            } catch(e) { 
                state.isThinking = false; 
                spawnWorldLabel("CONNECTION FAILURE", new THREE.Vector3(0, 5, 0), "#f00");
            }
        }

        function triggerChar(char, isBot=false) {
            let note = 'kick';
            const keyEl = document.querySelector(`.key[data-char="${char.toLowerCase()}"]`);
            if(keyEl && keyEl.dataset.note) note = keyEl.dataset.note;
            else { const code = char.charCodeAt(0); note = Object.keys(Notes)[code % Object.keys(Notes).length]; }
            if(char === ' ') note = 'kick';
            
            AudioEngine.playNote(note==='kick'?0:Notes[note], note==='kick'?'kick':'pluck', isBot);
            
            state.shakeIntensity = Math.min(state.shakeIntensity + (isBot ? 0.1 : 0.3), 1.5);
            state.zoomLevel = Math.min(state.zoomLevel + 0.05, 0.4); 

            if(Notes[note]) {
                const freq = Notes[note];
                // Spawn Note Label slightly offset
                const spawnPos = new THREE.Vector3((Math.random()-0.5)*3, 3, 2);
                spawnWorldLabel(note, spawnPos, isBot ? "#4f4" : "#fff");
                
                state.activeHue = isBot ? 0.5 : (freq / 1000); 
                const col = new THREE.Color().setHSL(state.activeHue, 0.9, 0.5);
                colorLight.color.copy(col);
                ballMat.emissive.setHex(0xffffff);
            } else { ballMat.emissive.setHex(0xffffff); }

            if (!state.isDragging) {
                const target = charMap[char] || charMap[char.toUpperCase()];
                if (target) { state.targetX = target.x; state.targetY = target.y; } 
                else { state.targetY += (Math.random()-0.5)*2; state.targetX = (Math.random()-0.5)*1; }
            }
            
            if(!state.isStriking) { state.isStriking = true; state.strikeStart = Date.now(); }
            spawnParticles(isBot); 

            if(isBot && activeBotBubble) {
                activeBotBubble.textContent += char;
                document.getElementById('chat-history').scrollTop = document.getElementById('chat-history').scrollHeight;
            }
        }

        // --- LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            
            // Audio Visuals - Coupled to Pivot
            const freqData = AudioEngine.getFrequencyData();
            let totalVol = 0;
            if (freqData.length > 0) {
                for(let i=0; i<64; i++) {
                    const val = freqData[i]; totalVol += val;
                    const scale = Math.max(0.1, (val / 255) * 4); 
                    vizBars[i].scale.y = scale;
                    // Move bars outward slightly with volume
                    vizBars[i].position.setLength(4.5 + scale * 0.1);
                    
                    const barCol = new THREE.Color().setHSL(state.activeHue, 0.9, 0.5 * (val/255));
                    vizBars[i].material.color.lerp(barCol, 0.2);
                }
                const avg = totalVol / 64;
                colorLight.intensity = 0.5 + (avg / 50); 
                
                // Pulse Shell
                shellLine.material.opacity = 0.1 + (avg / 300);
                shellLine.rotation.y += 0.002; // Shell spins slowly independently
            }

            updateParticles();
            updateLabels();

            // Bot Queue
            if(state.typingQueue.length > 0 && Date.now() > state.nextCharTime) {
                triggerChar(state.typingQueue.shift(), true);
                state.nextCharTime = Date.now() + 60 + Math.random()*80; 
                if(state.typingQueue.length===0) spawnWorldLabel("READY", new THREE.Vector3(0,5,0), "#fff");
            }

            // Physics (Pivot Group Handles Tilt)
            if (state.isDragging) {
                ball.rotation.y = state.targetY; 
                pivot.rotation.x = state.targetX;
            } else {
                ball.rotation.y += (state.targetY - ball.rotation.y) * 0.15; 
                pivot.rotation.x += (state.targetX - pivot.rotation.x) * 0.15;
            }

            // Strike Animation (Pivot moves forward, carrying visualizers)
            if(state.isStriking) {
                const e = Date.now() - state.strikeStart;
                if (e < 50) pivot.position.z = (e/50) * 1.5; 
                else if (e < 120) pivot.position.z = 1.5 * (1 - (e-50)/70);
                else { state.isStriking = false; pivot.position.z = 0; }
            } else { pivot.position.y = Math.sin(Date.now()*0.001) * 0.1; }
            
            const targetColor = new THREE.Color().setHSL(state.activeHue, 0.8, 0.1);
            ballMat.emissive.lerp(targetColor, 0.1); 

            state.shakeIntensity *= 0.9; state.zoomLevel *= 0.98; 
            const shake = new THREE.Vector3((Math.random()-0.5)*state.shakeIntensity, (Math.random()-0.5)*state.shakeIntensity, 0);
            const zoomVec = new THREE.Vector3(0, -state.zoomLevel*2, -state.zoomLevel*5);
            camera.position.copy(baseCamPos).add(shake).add(zoomVec);
            camera.lookAt(0,1,0);

            // Project World Text
            // We do this in updateLabels now

            renderer.render(scene, camera);
        }

        // --- INPUT ---
        container.addEventListener('pointerdown', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects([ball, ...capGroup.children]);
            
            state.isDragging = true; 
            state.lastDragX = e.clientX; state.lastDragY = e.clientY;
            state.dragStartTime = Date.now();
            state.targetY = ball.rotation.y; state.targetX = pivot.rotation.x;
            container.style.cursor = 'grabbing';
            
            if(intersects.length > 0) state.clickedBall = true;
            else state.clickedBall = false;
        });

        window.addEventListener('pointermove', (e) => {
            if(!state.isDragging) return;
            state.targetY += (e.clientX - state.lastDragX) * 0.005;
            state.targetX += (e.clientY - state.lastDragY) * 0.005;
            state.lastDragX = e.clientX; state.lastDragY = e.clientY;
        });

        window.addEventListener('pointerup', (e) => { 
            state.isDragging = false; container.style.cursor = 'grab'; 
            const duration = Date.now() - state.dragStartTime;
            if(state.clickedBall && duration < 200) {
                const keys = Object.keys(Notes);
                const randNote = keys[Math.floor(Math.random() * keys.length)];
                spawnWorldLabel("IMPROV", new THREE.Vector3(0,4,0), "#ff0");
                triggerChar(' ', false); 
                AudioEngine.playNote(Notes[randNote], 'pluck'); 
            }
        });

        function pressKey(keyEl) {
            keyEl.classList.add('active'); setTimeout(() => keyEl.classList.remove('active'), 100);
            const id = keyEl.id, action = keyEl.dataset.action, char = keyEl.dataset.char;

            if (id === 'enter-btn') {
                if(currentInput.trim()) {
                    const div = document.createElement('div'); div.className='chat-line user-line'; div.textContent="> "+currentInput;
                    const hist = document.getElementById('chat-history');
                    hist.appendChild(div); hist.scrollTop = hist.scrollHeight;
                    askGemini(currentInput); currentInput = ""; document.getElementById('current-line').textContent="";
                } return;
            }
            if (action === 'backspace') { currentInput=currentInput.slice(0,-1); document.getElementById('current-line').textContent=currentInput; return; }
            if (id === 'shift-btn') { state.shift=!state.shift; document.getElementById('shift-btn').style.background = state.shift ? '#fff' : '#0f0f0f'; return; }
            if (id === 'caps-btn') { state.capsLock=!state.capsLock; document.getElementById('caps-btn').style.background = state.capsLock ? '#fff' : '#0f0f0f'; return; }
            if (char) {
                let txt = (state.shift||state.capsLock) ? char.toUpperCase() : char;
                currentInput += txt; document.getElementById('current-line').textContent=currentInput;
                triggerChar(txt, false);
            }
        }
        document.querySelectorAll('.key').forEach(k => k.addEventListener('pointerdown', e => { e.preventDefault(); pressKey(k); }));
        document.getElementById('start-btn').addEventListener('click', () => {
            AudioEngine.init(); document.getElementById('overlay').classList.add('hidden'); 
            animate(); setTimeout(()=>triggerChar('H',true),500);
            spawnWorldLabel("SYSTEM READY", new THREE.Vector3(0,5,0));
        });
        window.addEventListener('resize', () => {
            const r = container.getBoundingClientRect(); camera.aspect=r.width/r.height; camera.updateProjectionMatrix(); renderer.setSize(r.width,r.height);
        });

    </script>
</body>
</html>
