<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>ES+ / Variety Engine</title>
<link rel="stylesheet" href="es-plus/style.css">
<style>
/* Mobile invariant: desktop minimization may hide a pane, never rewrite its internal surface. */
@media(max-width:720px){
  .pane.min>.body{display:grid!important}
  .pane.min>.codeBody,.codeBody{display:grid!important;grid-template-columns:38px minmax(0,1fr)!important;direction:ltr;min-width:0;overflow:hidden}
  .codeBody>.gutter{grid-column:1;grid-row:1;min-width:0;direction:ltr}
  .codeBody>.code{grid-column:2;grid-row:1;min-width:0;max-width:100%;direction:ltr;writing-mode:horizontal-tb}
  .pane.min>.soundBody,.soundBody{display:grid!important;grid-template-rows:minmax(170px,.7fr) minmax(90px,.3fr)!important;min-width:0}
  .pane.min>.sourceBody,.sourceBody{display:grid!important}
}
</style>
</head><body>
<div class="app">
<header class="top"><div class="brand">ES+</div><button id="apiBtn" class="api"><span id="apiDot" class="dot"></span><span id="apiText">API</span></button><div class="grow"></div><button id="runBtn" class="cmd" disabled>RUN</button><button id="playBtn" class="cmd play" disabled>PLAY</button></header>
<div id="trace" class="trace"><strong>START</strong>&nbsp; describe something → MAKE</div>
<main id="workspace" class="workspace">
<section id="sourcePane" class="pane" data-pane="source" style="flex-basis:100%"><div class="head">SOURCE<span id="sourceState" class="state">ready</span><button class="minBtn" data-min="source">−</button></div><div class="body sourceBody"><div class="compose"><textarea id="prompt" class="prompt" placeholder="Describe a sound, motion, place, game, feeling…"></textarea><div class="composeBar"><button id="drawBtn">DRAW</button><button id="clearBtn">CLEAR</button><button id="makeBtn" class="make">MAKE</button></div></div><div id="sketchWrap" class="sketchWrap" hidden><div class="sketchHint">optional drawing</div><canvas id="sketch" class="sketch"></canvas><button id="clearInk" class="clearInk">×</button></div></div></section>
<div class="grip" data-grip="0" hidden></div>
<section id="codePane" class="pane min" data-pane="code"><div class="head">CODE<span id="codeState" class="state">empty</span><button class="minBtn" data-min="code">+</button></div><div class="body codeBody"><div id="gutter" class="gutter"></div><textarea id="code" class="code" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea></div></section>
<div class="grip" data-grip="1" hidden></div>
<section id="soundPane" class="pane min" data-pane="sound"><div class="head">SOUND<span id="soundState" class="state">empty</span><button class="minBtn" data-min="sound">+</button></div><div class="body soundBody"><div class="timelineWrap"><div id="timeline" class="timeline"><div class="empty">MAKE → RUN → PLAY</div></div></div><div class="specWrap"><canvas id="spec" class="spec"></canvas><div class="specLabel">result</div></div></div></section>
</main>
<footer class="rail"><span class="railLabel">STONES</span><div id="stones" style="display:flex;gap:5px;min-width:0;overflow:auto"></div><button id="keepBtn" class="keep" disabled>KEEP</button></footer>
<nav class="mobileNav"><button class="on" data-mobile="source">SOURCE</button><button id="mobileCode" data-mobile="code" disabled>CODE</button><button id="mobileSound" data-mobile="sound" disabled>SOUND</button></nav>
</div>
<div id="sheetBack" class="sheetBack"><div class="sheet"><div class="sheetRow"><input id="keyInput" type="password" placeholder="OPENAI API KEY" autocomplete="off"><input id="modelInput" value="gpt-5.6-terra" aria-label="model"></div><div class="sheetRow"><input id="routeInput" value="https://api.openai.com/v1" aria-label="API route"><button id="connectBtn" class="primary">CONNECT</button></div><div class="sheetStatus"><span id="sheetDot" class="dot"></span><span id="sheetStatus">not checked</span></div><div class="sheetActions"><button id="forgetBtn">FORGET KEY</button><button id="closeSheet">CLOSE</button></div></div></div>
<script src="es-plus/app.js"></script></body></html>
