<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>ORBITAL LOOM: MASON-TE EDITION</title>
    <style>
        :root {
            --te-orange: #ff4d00;
            --te-grey: #2e2e2e;
            --te-light-grey: #b0b0b0;
            --te-bg: #1a1a1a;
            --lcd-bg: #121812;
            --lcd-text: #00ffaa;
            --font-mono: 'Share Tech Mono', 'Courier New', monospace;
        }

        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
        
        body {
            margin: 0; overflow: hidden;
            background-color: #050505;
            font-family: var(--font-mono);
            color: var(--te-light-grey);
        }

        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between;
        }

        /* --- TOP DEVICE HEADER --- */
        #top-hud {
            pointer-events: auto; padding: 20px;
            display: flex; justify-content: space-between; align-items: flex-start;
        }

        .device-info {
            background: var(--te-grey); border-radius: 4px; padding: 8px 12px;
            border-bottom: 2px solid #000;
        }
        .title { font-size: 14px; font-weight: bold; letter-spacing: 2px; color: #fff; }
        .version { font-size: 9px; color: var(--te-orange); margin-top: 2px; opacity: 0.8; }

        #btn-engine {
            background: var(--te-orange); border: none; color: #fff;
            padding: 10px 18px; font-size: 10px; font-weight: bold;
            cursor: pointer; border-radius: 4px; box-shadow: 0 4px 0 #992e00;
            text-transform: uppercase; transition: transform 0.1s;
        }
        #btn-engine:active { transform: translateY(2px); box-shadow: 0 2px 0 #992e00; }
        #btn-engine.active { background: #fff; color: var(--te-orange); box-shadow: 0 4px 0 #ccc; }

        /* XR Button Override - Top Right */
        #XRButton {
            position: absolute !important; top: 20px !important; right: 20px !important;
            bottom: auto !important; left: auto !important; width: auto !important;
            background: var(--te-grey) !important; border: 1px solid #444 !important;
            color: #fff !important; font-family: var(--font-mono) !important;
            font-size: 10px !important; padding: 10px 15px !important; border-radius: 4px !important;
        }

        /* --- THE MODULE RACK (Bottom) --- */
        #console-container {
            width: 100%; display: flex; justify-content: center;
            padding-bottom: max(15px, env(safe-area-inset-bottom));
            pointer-events: none;
        }

        #console {
            pointer-events: auto; width: 95%; max-width: 500px;
            background: var(--te-bg); border-radius: 8px; padding: 12px;
            display: flex; flex-direction: column; gap: 10px;
            border: 1px solid #333; box-shadow: 0 20px 60px rgba(0,0,0,0.9);
        }

        /* Channel Strip Indicators */
        #track-rack {
            display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px;
        }
        .track-module {
            background: #111; height: 40px; border-radius: 3px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; border: 1px solid #222; transition: all 0.2s;
        }
        .track-module.active { background: #333; border-color: var(--track-color); }
        .track-module .led {
            width: 6px; height: 6px; border-radius: 50%; background: #222;
            margin-bottom: 4px; transition: background 0.3s;
        }
        .track-module.active .led { background: var(--track-color); box-shadow: 0 0 8px var(--track-color); }
        .track-module .label { font-size: 8px; color: #555; }
        .track-module.active .label { color: #fff; }

        /* Focused Control Unit */
        #focused-unit {
            background: var(--te-grey); border-radius: 6px; padding: 10px;
            display: flex; flex-direction: column; gap: 8px; border: 1px solid #444;
        }

        #lcd-screen {
            background: var(--lcd-bg); border-radius: 3px; padding: 8px;
            display: flex; justify-content: space-between; align-items: center;
            border: 1px inset #000;
        }
        .lcd-main { font-size: 13px; color: var(--lcd-text); text-transform: uppercase; letter-spacing: 1px; }
        .lcd-sub { font-size: 9px; color: #558855; }

        #tuning-strip {
            width: 100%; height: 34px; background: #000; border-radius: 4px;
            position: relative; overflow: hidden; display: flex; align-items: center;
            justify-content: center; cursor: ew-resize; border: 1px solid #333;
        }
        #tuning-strip::after {
            content: ''; position: absolute; height: 100%; width: 2px; background: var(--te-orange);
            left: 50%; transform: translateX(-50%);
        }
        .scroll-hint { font-size: 8px; color: #333; letter-spacing: 4px; }

        /* Main Trigger Unit */
        #trigger-unit {
            display: flex; align-items: center; justify-content: space-between; gap: 10px;
        }
        .big-knob {
            width: 54px; height: 54px; border-radius: 50%;
            background: var(--te-grey); border: 2px solid #444;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; position: relative;
        }
        .big-knob::before {
            content: ''; position: absolute; top: 10px; left: 50%; width: 2px; height: 10px;
            background: #fff; transform-origin: bottom center;
        }
        .big-knob:active { transform: scale(0.95); }

        .action-btn {
            background: #fff; border: none; border-radius: 4px; padding: 10px 15px;
            font-family: var(--font-mono); font-size: 11px; font-weight: bold;
            color: #000; cursor: pointer; flex-grow: 1; height: 44px;
            text-transform: uppercase;
        }
        .action-btn.orange { background: var(--te-orange); color: #fff; }
        .action-btn:active { background: #ccc; }

        /* Reticle */
        #reticle {
            position: absolute; top: 50%; left: 50%; width: 4px; height: 4px;
            transform: translate(-50%, -50%); background: #fff; border-radius: 50%;
            pointer-events: none; opacity: 0.5; transition: all 0.2s; z-index: 5;
        }
        #reticle.active {
            width: 32px; height: 32px; background: transparent;
            border: 2px solid var(--te-orange); opacity: 1;
        }

        #toast {
            position: absolute; top: 15%; left: 50%; transform: translateX(-50%);
            color: var(--te-orange); font-size: 12px; font-weight: bold; opacity: 0; transition: 0.3s;
        }
        #toast.show { opacity: 1; }

    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="ui-layer">
        <div id="top-hud">
            <div class="device-info">
                <div class="title">ORBITAL LOOM</div>
                <div class="version">M_TE // 110 BPM</div>
            </div>
            <button id="btn-engine">START_AUDIO</button>
        </div>

        <div id="toast">SYSTEM_UPDATE</div>

        <div id="console-container">
            <div id="console">
                <!-- Track Selectors -->
                <div id="track-rack">
                    <!-- JS Injected -->
                </div>

                <!-- Focused Ring Controls -->
                <div id="focused-unit">
                    <div id="lcd-screen">
                        <div>
                            <div class="lcd-main" id="lcd-track-name">KICK-01</div>
                            <div class="lcd-sub" id="lcd-mode">MASON MODE</div>
                        </div>
                        <div style="text-align: right">
                            <div class="lcd-main" id="lcd-val">S_01</div>
                            <div class="lcd-sub">SELECT</div>
                        </div>
                    </div>

                    <div id="tuning-strip">
                        <div class="scroll-hint">SCROLL TO TUNE</div>
                    </div>
                </div>

                <!-- Action Triggers -->
                <div id="trigger-unit">
                    <button class="action-btn" id="btn-mode-toggle">SWITCH MODE</button>
                    <button class="action-btn orange" id="btn-place">PLACE BLOCK</button>
                    <button class="action-btn" id="btn-clear-track">CLR RING</button>
                </div>
            </div>
        </div>
    </div>

    <div id="reticle"></div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { XRButton } from 'three/addons/webxr/XRButton.js';

        // --- DATA ---
        const CONFIG = { RINGS: 8, SLOTS: 16, RADIUS: 4, HEIGHT: 1.0, BPM: 110 };
        const PALETTE = ['#FF4D00', '#00FFAA', '#00CCFF', '#AA00FF', '#FFCC00', '#FF0055', '#55FF00', '#FFFFFF'];
        
        const STATIONS = [
            { name: "GROOVE SALAD", url: "https://ice6.somafm.com/groovesalad-128-mp3" },
            { name: "DRONE ZONE", url: "https://ice6.somafm.com/dronezone-128-mp3" },
            { name: "DEF CON", url: "https://ice6.somafm.com/defcon-128-mp3" },
            { name: "SECRET AGENT", url: "https://ice6.somafm.com/secretagent-128-mp3" },
            { name: "SPACE STATION", url: "https://ice6.somafm.com/spacestation-128-mp3" }
        ];

        // --- STATE ---
        const state = {
            isPlaying: false,
            focusTrack: 0,
            hoverGrid: null,
            blocks: [], // { id, ring, slot, mesh }
            playhead: 0,
            currentStep: 0,
            nextId: 1
        };

        // --- AUDIO ENGINE ---
        class DeviceAudio {
            constructor() {
                this.ctx = null;
                this.master = null;
                this.tracks = [];
                // Pre-init settings
                for(let i=0; i<8; i++) {
                    this.tracks.push({
                        id: i, mode: i < 2 ? 'RADIO' : 'MASON',
                        idx: 0, audioEl: new Audio(), gain: null
                    });
                    this.tracks[i].audioEl.crossOrigin = "anonymous";
                    this.tracks[i].audioEl.loop = true;
                }
            }

            async init() {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                this.master = this.ctx.createGain();
                this.master.gain.value = 0.5;
                this.master.connect(this.ctx.destination);

                this.tracks.forEach((t, i) => {
                    t.gain = this.ctx.createGain();
                    t.gain.gain.value = 0;
                    t.gain.connect(this.master);
                    const source = this.ctx.createMediaElementSource(t.audioEl);
                    source.connect(t.gain);
                    this.updateSource(i);
                });
                await this.ctx.resume();
            }

            updateSource(id) {
                const t = this.tracks[id];
                if(t.mode === 'RADIO') {
                    const s = STATIONS[t.idx % STATIONS.length];
                    t.audioEl.src = s.url;
                    t.audioEl.play().catch(()=>{});
                    return s.name;
                } else {
                    return `SYNTH-P ${t.idx + 1}`;
                }
            }

            trigger(id, dur) {
                if(!this.ctx) return;
                const t = this.tracks[id];
                const now = this.ctx.currentTime;
                
                if(t.mode === 'RADIO') {
                    t.gain.gain.cancelScheduledValues(now);
                    t.gain.gain.setValueAtTime(0, now);
                    t.gain.gain.linearRampToValueAtTime(0.8, now + 0.02);
                    t.gain.gain.linearRampToValueAtTime(0, now + dur);
                } else {
                    const osc = this.ctx.createOscillator();
                    const env = this.ctx.createGain();
                    osc.type = id % 2 === 0 ? 'square' : 'sawtooth';
                    osc.frequency.value = (60 + (id * 12) + (t.idx * 5));
                    osc.connect(env); env.connect(this.master);
                    env.gain.setValueAtTime(0.3, now);
                    env.gain.exponentialRampToValueAtTime(0.01, now + dur);
                    osc.start(now); osc.stop(now + dur);
                }
            }
        }

        const audio = new DeviceAudio();

        // --- 3D SCENE ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 100);
        camera.position.set(0, 6, 12);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);
        document.body.appendChild(XRButton.createButton(renderer, {
            optionalFeatures: ['dom-overlay'], domOverlay: { root: document.getElementById('ui-layer') }
        }));

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, 4, 0);

        scene.add(new THREE.AmbientLight(0xffffff, 1.5));
        const dLight = new THREE.DirectionalLight(0xffffff, 1);
        dLight.position.set(5, 10, 5);
        scene.add(dLight);

        // --- MASONRY GEOMETRY ---
        const towerGroup = new THREE.Group();
        scene.add(towerGroup);

        // Core with exact Mortar Alignment
        function createCore() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 1024;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#0a0a0a'; ctx.fillRect(0,0,1024,1024);
            ctx.strokeStyle = '#222'; ctx.lineWidth = 2;
            
            const rH = 1024 / CONFIG.RINGS;
            const sW = 1024 / CONFIG.SLOTS;

            for(let i=0; i<CONFIG.RINGS; i++) {
                const y = i * rH;
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1024, y); ctx.stroke();
                const offset = (i % 2 === 1) ? sW / 2 : 0;
                for(let j=0; j<=CONFIG.SLOTS; j++) {
                    let x = (j * sW) + offset;
                    if(x > 1024) x -= 1024;
                    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + rH); ctx.stroke();
                }
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: 0.8, side: THREE.DoubleSide });
            const geo = new THREE.CylinderGeometry(CONFIG.RADIUS-0.05, CONFIG.RADIUS-0.05, CONFIG.RINGS * CONFIG.HEIGHT, 64, 1);
            geo.rotateY(-Math.PI / CONFIG.SLOTS); // Align texture seam
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.y = (CONFIG.RINGS * CONFIG.HEIGHT)/2 - (CONFIG.HEIGHT/2);
            return mesh;
        }
        towerGroup.add(createCore());

        const hitGeo = new THREE.CylinderGeometry(CONFIG.RADIUS+0.5, CONFIG.RADIUS+0.5, CONFIG.RINGS * CONFIG.HEIGHT, 32, 1);
        const hitCylinder = new THREE.Mesh(hitGeo, new THREE.MeshBasicMaterial({ visible: false }));
        hitCylinder.position.y = (CONFIG.RINGS * CONFIG.HEIGHT)/2 - (CONFIG.HEIGHT/2);
        towerGroup.add(hitCylinder);

        // Vertical Scanner Beam
        const scannerPivot = new THREE.Group();
        const scanBeam = new THREE.Mesh(
            new THREE.BoxGeometry(0.15, CONFIG.RINGS * CONFIG.HEIGHT + 2, 0.4),
            new THREE.MeshBasicMaterial({ color: varColor('--te-orange'), transparent: true, opacity: 0.6 })
        );
        scanBeam.position.set(0, 4, CONFIG.RADIUS + 0.5);
        scannerPivot.add(scanBeam);
        scene.add(scannerPivot);

        function createBrick(color, ring, slot) {
            const innerR = CONFIG.RADIUS;
            const outerR = CONFIG.RADIUS + 0.6;
            const h = CONFIG.HEIGHT - 0.15;
            const arc = (Math.PI * 2) / CONFIG.SLOTS;
            
            const shape = new THREE.Shape();
            shape.absarc(0, 0, outerR, -arc/2 + 0.05, arc/2 - 0.05, false);
            shape.absarc(0, 0, innerR, arc/2 - 0.05, -arc/2 + 0.05, true);
            
            const geo = new THREE.ExtrudeGeometry(shape, { depth: h, bevelEnabled: true, bevelSize: 0.04, bevelThickness: 0.04 });
            geo.rotateX(-Math.PI/2);
            geo.center();
            
            const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color, roughness: 0.4, metalness: 0.5, emissive: color, emissiveIntensity: 0.2 }));
            
            // Placement logic matched to core
            const angleStep = (Math.PI * 2) / CONFIG.SLOTS;
            let angle = slot * angleStep + (angleStep/2);
            if(ring % 2 === 1) angle += (angleStep / 2);
            
            mesh.position.set(Math.sin(angle) * CONFIG.RADIUS, ring * CONFIG.HEIGHT + CONFIG.HEIGHT/2, Math.cos(angle) * CONFIG.RADIUS);
            mesh.rotation.y = angle;
            return mesh;
        }

        const ghost = createBrick(0xffffff, 0, 0);
        ghost.material = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: 0.3 });
        scene.add(ghost);

        // --- UTILS ---
        function varColor(name) { return new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue(name).trim()); }
        function haptic(p=10) { if(navigator.vibrate) navigator.vibrate(p); }
        function showToast(m) { const t=document.getElementById('toast'); t.innerText=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 1000); }

        // --- LOGIC ---
        const raycaster = new THREE.Raycaster();
        const clock = new THREE.Clock();

        function getGridPos(pt) {
            let y = pt.y; if(y < 0) y = 0;
            const ring = Math.floor(y / CONFIG.HEIGHT);
            const angle = Math.atan2(pt.x, pt.z);
            let nA = angle < 0 ? angle + Math.PI*2 : angle;
            const stepRad = (Math.PI * 2) / CONFIG.SLOTS;
            if(ring % 2 === 1) { nA -= (stepRad/2); if(nA < 0) nA += Math.PI*2; }
            const slot = Math.floor(nA / stepRad) % CONFIG.SLOTS;
            return { ring: Math.min(ring, CONFIG.RINGS-1), slot };
        }

        function placeBlock() {
            if(!state.hoverGrid) return;
            const { ring, slot } = state.hoverGrid;
            haptic(20);

            const existIdx = state.blocks.findIndex(b => b.ring === ring && b.slot === slot);
            if(existIdx >= 0) {
                towerGroup.remove(state.blocks[existIdx].mesh);
                state.blocks.splice(existIdx, 1);
            } else {
                const mesh = createBrick(PALETTE[ring], ring, slot);
                towerGroup.add(mesh);
                state.blocks.push({ id: state.nextId++, ring, slot, mesh });
                audio.trigger(ring, 0.1);
            }
        }

        renderer.setAnimationLoop(() => {
            raycaster.setFromCamera({x:0,y:0}, camera);
            const hits = raycaster.intersectObject(hitCylinder);
            const reticle = document.getElementById('reticle');

            if(hits.length > 0) {
                state.hoverGrid = getGridPos(hits[0].point);
                const { ring, slot } = state.hoverGrid;
                
                // Snap Ghost
                const angleStep = (Math.PI * 2) / CONFIG.SLOTS;
                let angle = slot * angleStep + (angleStep/2);
                if(ring % 2 === 1) angle += (angleStep / 2);
                ghost.position.set(Math.sin(angle)*CONFIG.RADIUS, ring*CONFIG.HEIGHT+CONFIG.HEIGHT/2, Math.cos(angle)*CONFIG.RADIUS);
                ghost.rotation.y = angle;
                ghost.visible = true;

                reticle.classList.add('active');
                reticle.style.borderColor = PALETTE[ring];
            } else {
                ghost.visible = false; state.hoverGrid = null; reticle.classList.remove('active');
            }

            if(state.isPlaying) {
                const dt = clock.getDelta();
                const rps = (CONFIG.BPM / 60) / 4; 
                scannerPivot.rotation.y += rps * (Math.PI * 2) * dt;
                
                let nR = (scannerPivot.rotation.y % (Math.PI*2)) / (Math.PI*2);
                if(nR < 0) nR += 1;
                const step = Math.floor(nR * CONFIG.SLOTS);

                if(step !== state.currentStep) {
                    state.currentStep = step;
                    state.blocks.filter(b => b.slot === step).forEach(b => {
                        audio.trigger(b.ring, 0.2);
                        b.mesh.scale.set(1.15, 1.15, 1.15);
                    });
                }
            }

            state.blocks.forEach(b => b.mesh.scale.lerp(new THREE.Vector3(1,1,1), 0.1));
            controls.update();
            renderer.render(scene, camera);
        });

        // --- UI ---
        const buildRack = () => {
            const rack = document.getElementById('track-rack');
            PALETTE.forEach((color, i) => {
                const mod = document.createElement('div');
                mod.className = `track-module ${i===0?'active':''}`;
                mod.style.setProperty('--track-color', color);
                mod.innerHTML = `<div class="led"></div><div class="label">R-${i+1}</div>`;
                mod.onclick = () => focusTrack(i);
                rack.appendChild(mod);
            });
        };

        const focusTrack = (id) => {
            haptic();
            state.focusTrack = id;
            document.querySelectorAll('.track-module').forEach((m,i)=>m.classList.toggle('active', i===id));
            const t = audio.tracks[id];
            document.getElementById('lcd-track-name').innerText = `RING ${id+1} : ${TRACKS[id].name}`;
            document.getElementById('lcd-mode').innerText = `${t.mode} MODE`;
            document.getElementById('lcd-val').innerText = t.mode==='RADIO' ? `ST_${t.idx+1}` : `S_${t.idx+1}`;
        };

        const TRACKS = [
            {name:"KICK"}, {name:"SNARE"}, {name:"HIHAT"}, {name:"BASS"},
            {name:"LEAD"}, {name:"PAD"}, {name:"ARP"}, {name:"NOISE"}
        ];

        document.getElementById('btn-engine').onclick = async (e) => {
            if(!audio.ctx) { await audio.init(); focusTrack(0); }
            else audio.ctx.resume();
            state.isPlaying = !state.isPlaying;
            e.target.innerText = state.isPlaying ? "STOP_AUDIO" : "RESUME";
            e.target.classList.toggle('active', state.isPlaying);
        };

        document.getElementById('btn-mode-toggle').onclick = () => {
            const t = audio.tracks[state.focusTrack];
            t.mode = t.mode === 'RADIO' ? 'MASON' : 'RADIO';
            audio.updateSource(state.focusTrack);
            focusTrack(state.focusTrack);
            showToast("MODE_SWAP");
        };

        document.getElementById('btn-clear-track').onclick = () => {
            haptic(50);
            state.blocks = state.blocks.filter(b => {
                if(b.ring === state.focusTrack) { towerGroup.remove(b.mesh); return false; }
                return true;
            });
        };

        // Tuning Strip Touch Logic
        let sX = 0;
        const strip = document.getElementById('tuning-strip');
        strip.ontouchstart = (e) => { sX = e.touches[0].clientX; };
        strip.ontouchmove = (e) => {
            const x = e.touches[0].clientX;
            const diff = sX - x;
            if(Math.abs(diff) > 40) {
                haptic(15);
                const dir = diff > 0 ? 1 : -1;
                const t = audio.tracks[state.focusTrack];
                t.idx = (t.idx + dir + 10) % 10;
                const name = audio.updateSource(state.focusTrack);
                focusTrack(state.focusTrack);
                sX = x;
            }
        };

        document.getElementById('btn-place').onclick = placeBlock;

        buildRack();
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
