<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sentient Synthesizer - Performance Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Courier Prime', monospace;
            overflow: hidden;
            background-color: #000;
            color: #a0a0a0;
            touch-action: none;
            margin: 0; padding: 0;
        }
        #canvas-container {
            width: 100vw; height: 55vh;
            position: absolute; top: 0; left: 0;
            z-index: 1; cursor: grab;
            display: flex; justify-content: center; align-items: center;
        }
        #canvas-container:active { cursor: grabbing; }
        
        /* UI Layer */
        #ui-layer {
            position: absolute; bottom: 0; width: 100%; height: 45vh;
            background: #080808;
            display: flex; flex-direction: column;
            z-index: 10; border-top: 1px solid #222;
            box-shadow: 0 -10px 50px rgba(0,0,0,0.9);
            backdrop-filter: blur(10px);
        }
        
        /* Chat Paper Strip */
        #paper-strip {
            position: absolute; top: 20px; left: 50%;
            transform: translateX(-50%);
            width: 92%; max-width: 700px; height: 160px; 
            background: rgba(5, 5, 5, 0.85);
            color: #eee; 
            padding: 15px;
            font-size: 16px; line-height: 1.4;
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.08);
            z-index: 5;
            display: flex; flex-direction: column;
            overflow-y: auto; overflow-x: hidden;
            backdrop-filter: blur(4px);
            scrollbar-width: thin; scrollbar-color: #444 transparent;
            /* Updated Mask: Fade top only, keep bottom sharp for reading */
            mask-image: linear-gradient(to bottom, transparent, black 15%, black 100%);
        }
        
        .chat-line { margin-bottom: 8px; padding-bottom: 4px; border-bottom: 1px dashed rgba(255,255,255,0.1); }
        .user-line { color: #888; font-style: italic; font-size: 0.9em; }
        .bot-line { color: #4f4; font-weight: bold; text-shadow: 0 0 8px rgba(0, 255, 100, 0.4); }
        
        #input-area { margin-top: auto; border-top: 1px solid #444; padding-top: 8px; color: #fff; display: flex; align-items: center; }
        #cursor { width: 8px; height: 16px; background: #fff; margin-left: 2px; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* Keyboard */
        .keyboard {
            flex: 1; padding: 6px; display: flex; flex-direction: column;
            gap: 6px; justify-content: center; max-width: 900px;
            margin: 0 auto; width: 100%;
        }
        .row { display: flex; justify-content: center; gap: 4px; }
        .key {
            background: #151515; color: #666; border-radius: 4px;
            font-weight: normal; font-size: 1rem; height: 42px; min-width: 28px;
            flex: 1; display: flex; align-items: center; justify-content: center;
            border: 1px solid #2a2a2a; transition: all 0.05s;
            cursor: pointer; user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .key:active, .key.active { 
            transform: scale(0.92); background: #fff; color: #000; 
            box-shadow: 0 0 20px rgba(255,255,255,0.8); border-color: #fff;
        }
        .key.space { flex: 4; }
        .key.action { background: #0f0f0f; color: #444; font-size: 0.75rem; flex: 1.5; }
        .key.enter { background: #311; color: #d55; border-color: #522; flex: 2; }
        .key.enter:active { background: #f44; color: #fff; box-shadow: 0 0 20px #f00; }

        #overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: #000; z-index: 50;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 20px;
        }
        .hidden { display: none !important; opacity: 0; pointer-events: none; transition: opacity 1s; }
        
        #drag-hint {
            position: absolute; top: 120px; left: 50%; transform: translateX(-50%);
            color: rgba(255,255,255,0.15); font-size: 0.7rem; pointer-events: none;
            z-index: 2; letter-spacing: 2px;
        }
        
        #status-light {
            position: absolute; top: 20px; right: 20px; width: 8px; height: 8px;
            border-radius: 50%; background: #333; z-index: 20; transition: 0.3s;
        }
        #status-light.thinking { background: #fc0; box-shadow: 0 0 10px #fc0; }
        #status-light.speaking { background: #4f4; box-shadow: 0 0 10px #4f4; }
    </style>
</head>
<body>

    <div id="status-light"></div>
    <div id="drag-hint">DRAG TO ROTATE</div>
    <div id="canvas-container"></div>

    <div id="paper-strip">
        <div id="chat-history">
            <div class="chat-line bot-line">IBM: PERFORMANCE MODE ENGAGED.</div>
        </div>
        <div id="input-area"><span id="current-line"></span><div id="cursor"></div></div>
    </div>

    <div id="ui-layer">
        <div class="keyboard">
            <div class="row">
                <div class="key" data-note="C6" data-char="1">1</div><div class="key" data-note="D6" data-char="2">2</div><div class="key" data-note="Eb6" data-char="3">3</div><div class="key" data-note="F6" data-char="4">4</div><div class="key" data-note="G6" data-char="5">5</div><div class="key" data-note="Ab6" data-char="6">6</div><div class="key" data-note="Bb6" data-char="7">7</div><div class="key" data-note="C7" data-char="8">8</div><div class="key" data-note="D7" data-char="9">9</div><div class="key" data-note="Eb7" data-char="0">0</div>
            </div>
            <div class="row">
                <div class="key" data-note="Eb5" data-char="q">Q</div><div class="key" data-note="F5" data-char="w">W</div><div class="key" data-note="G5" data-char="e">E</div><div class="key" data-note="Ab5" data-char="r">R</div><div class="key" data-note="Bb5" data-char="t">T</div><div class="key" data-note="C6" data-char="y">Y</div><div class="key" data-note="D6" data-char="u">U</div><div class="key" data-note="Eb6" data-char="i">I</div><div class="key" data-note="F6" data-char="o">O</div><div class="key" data-note="G6" data-char="p">P</div>
            </div>
            <div class="row">
                <div class="key action" id="caps-btn">CAPS</div>
                <div class="key" data-note="Ab3" data-char="a">A</div><div class="key" data-note="Bb3" data-char="s">S</div><div class="key" data-note="C4" data-char="d">D</div><div class="key" data-note="D4" data-char="f">F</div><div class="key" data-note="Eb4" data-char="g">G</div><div class="key" data-note="F4" data-char="h">H</div><div class="key" data-note="G4" data-char="j">J</div><div class="key" data-note="Ab4" data-char="k">K</div><div class="key" data-note="Bb4" data-char="l">L</div>
                <div class="key enter" id="enter-btn">SEND</div>
            </div>
            <div class="row">
                <div class="key action" id="shift-btn">SHIFT</div>
                <div class="key" data-note="Eb2" data-char="z">Z</div><div class="key" data-note="F2" data-char="x">X</div><div class="key" data-note="G2" data-char="c">C</div><div class="key" data-note="Ab2" data-char="v">V</div><div class="key" data-note="Bb2" data-char="b">B</div><div class="key" data-note="C3" data-char="n">N</div><div class="key" data-note="D3" data-char="m">M</div>
                <div class="key action" data-action="backspace">⌫</div>
            </div>
            <div class="row">
                <div class="key space" data-char=" ">SPACE</div>
            </div>
        </div>
    </div>

    <div id="overlay">
        <h1 class="text-4xl font-bold mb-2 text-white tracking-widest" style="font-family: sans-serif; letter-spacing: 8px;">PERFORM<br>MODE</h1>
        <div class="h-1 w-20 bg-white mb-6"></div>
        <p class="text-gray-400 mb-8 text-sm tracking-widest">VISCERAL AUDIO ENGINE</p>
        <button id="start-btn" class="px-8 py-3 bg-white text-black font-bold rounded-full text-sm hover:scale-105 transition duration-300">INITIALIZE</button>
    </div>

    <script>
        // --- CONFIG ---
        const config = {
            ballSize: 3.2, rows: 4, cols: 22,
            metalness: 0.6, roughness: 0.3, 
            ballColor: '#e0e0e0', textColor: '#222'
        };
        const apiKey = ""; 
        const systemPrompt = "You are a sentient 1970s IBM Selectric Typewriter Ball. You create music when you speak. You are poetic, mechanical, and slightly glitchy. Keep responses short (under 100 chars).";

        const layoutRows = [ "1234567890-=" + "!@#$%^&*()_+", "qwertyuiop[]" + "QWERTYUIOP{}", "asdfghjkl;:'" + 'ASDFGHJKL:"', "zxcvbnm,./\\" + "ZXCVBNM<>?|" ];

        // --- AUDIO ENGINE (ENHANCED) ---
        const AudioEngine = {
            ctx: null, masterGain: null, reverbNode: null, delayNode: null, 
            analyser: null, dataArray: null, isInit: false,
            
            init() {
                if(this.isInit) return;
                const AC = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AC();
                this.masterGain = this.ctx.createGain();
                this.masterGain.gain.value = 0.6; // Louder
                
                // Analyser
                this.analyser = this.ctx.createAnalyser();
                this.analyser.fftSize = 128;
                this.analyser.smoothingTimeConstant = 0.8;
                this.dataArray = new Uint8Array(this.analyser.frequencyBinCount);
                
                this.masterGain.connect(this.analyser);
                this.analyser.connect(this.ctx.destination);
                
                this.setupFX();
                this.isInit = true;
            },
            
            getFrequencyData() {
                if(this.analyser) {
                    this.analyser.getByteFrequencyData(this.dataArray);
                    return this.dataArray;
                }
                return [];
            },
            
            setupFX() {
                const len = this.ctx.sampleRate * 2.0; 
                const buf = this.ctx.createBuffer(2, len, this.ctx.sampleRate);
                for (let c=0; c<2; c++) {
                    const data = buf.getChannelData(c);
                    for (let i=0; i<len; i++) data[i] = (Math.random()*2-1) * Math.pow(1-i/len, 1.5);
                }
                this.reverbNode = this.ctx.createConvolver();
                this.reverbNode.buffer = buf;
                const revGain = this.ctx.createGain(); revGain.gain.value = 0.35;
                this.reverbNode.connect(revGain); revGain.connect(this.masterGain);

                this.delayNode = this.ctx.createDelay();
                this.delayNode.delayTime.value = 0.25; 
                const fbk = this.ctx.createGain(); fbk.gain.value = 0.3;
                this.delayNode.connect(fbk); fbk.connect(this.delayNode);
                this.delayNode.connect(revGain); this.delayNode.connect(this.masterGain);
            },
            
            playNote(freq, type='pluck', isBot=false) {
                if(!this.isInit) return;
                const t = this.ctx.currentTime;
                
                // Oscillator 1 (Main)
                const osc1 = this.ctx.createOscillator();
                // Oscillator 2 (Sub/Detune)
                const osc2 = this.ctx.createOscillator();
                
                const gain = this.ctx.createGain();
                const filter = this.ctx.createBiquadFilter();

                osc1.connect(filter); 
                osc2.connect(filter);
                filter.connect(gain);
                gain.connect(this.masterGain); 
                gain.connect(this.reverbNode);
                if(type==='pluck') gain.connect(this.delayNode);

                if(type==='kick') {
                    osc1.frequency.setValueAtTime(150, t);
                    osc1.frequency.exponentialRampToValueAtTime(40, t+0.1);
                    osc2.frequency.setValueAtTime(80, t); 
                    osc2.frequency.exponentialRampToValueAtTime(30, t+0.1);
                    gain.gain.setValueAtTime(1.2, t);
                    gain.gain.exponentialRampToValueAtTime(0.01, t+0.3);
                } else {
                    // BOT vs HUMAN Sound Design
                    if(isBot) {
                        osc1.type = 'sawtooth';
                        osc2.type = 'square';
                        osc1.frequency.setValueAtTime(freq, t);
                        osc2.frequency.setValueAtTime(freq * 1.01, t); // Slight detune for chorus effect
                        
                        filter.frequency.setValueAtTime(500, t);
                        filter.frequency.exponentialRampToValueAtTime(freq*5, t+0.05);
                        filter.frequency.exponentialRampToValueAtTime(freq, t+0.5); // Faster filter close
                    } else {
                        osc1.type = Math.random()>0.5?'triangle':'sine';
                        if(freq<200) osc1.type='sawtooth'; // Bass grit
                        osc2.type = 'triangle';
                        osc1.frequency.setValueAtTime(freq, t);
                        osc2.frequency.setValueAtTime(freq * 0.5, t); // Sub oscillator
                        osc1.detune.value = (Math.random()-0.5)*15;
                        
                        filter.frequency.setValueAtTime(100, t);
                        filter.frequency.exponentialRampToValueAtTime(freq*4, t+0.02); 
                        filter.frequency.exponentialRampToValueAtTime(freq*0.5, t+1.5);
                    }
                    
                    gain.gain.setValueAtTime(0, t);
                    gain.gain.linearRampToValueAtTime(0.4, t+0.01);
                    gain.gain.exponentialRampToValueAtTime(0.001, isBot ? t+0.5 : t+3.5); // Bot is shorter
                }
                
                osc1.start(t); osc1.stop(t+4.0);
                osc2.start(t); osc2.stop(t+4.0);
            }
        };

        const Notes = {
            'Eb2': 77.78, 'F2': 87.31, 'G2': 98.00, 'Ab2': 103.83, 'Bb2': 116.54,
            'C3': 130.81, 'D3': 146.83, 'Eb3': 155.56, 'F3': 174.61, 'G3': 196.00,
            'Ab3': 207.65, 'Bb3': 233.08, 'C4': 261.63, 'D4': 293.66, 'Eb4': 311.13,
            'F4': 349.23, 'G4': 392.00, 'Ab4': 415.30, 'Bb4': 466.16, 'C5': 523.25,
            'Eb5': 622.25, 'F5': 698.46, 'G5': 783.99, 'Ab5': 830.61, 'Bb5': 932.33,
            'C6': 1046.50, 'D6': 1174.66, 'Eb6': 1244.51, 'F6': 1396.91, 'G6': 1567.98,
            'Ab6': 1661.22, 'Bb6': 1864.66, 'C7': 2093.00, 'D7': 2349.32, 'Eb7': 2489.02
        };

        // --- THREE.JS ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.02);
        
        const rect = container.getBoundingClientRect();
        const camera = new THREE.PerspectiveCamera(40, rect.width / rect.height, 0.1, 100);
        // Initial Camera Pos
        const baseCamPos = new THREE.Vector3(0, 7, 13);
        camera.position.copy(baseCamPos);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(rect.width, rect.height);
        renderer.toneMapping = THREE.ReinhardToneMapping;
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0x444444));
        const spot = new THREE.SpotLight(0xffffff, 1.2);
        spot.position.set(5, 10, 5); spot.castShadow = true; scene.add(spot);
        const colorLight = new THREE.PointLight(0x4488ff, 0.8, 20);
        colorLight.position.set(-5, 2, 0); scene.add(colorLight);

        // --- VISUALIZER RING ---
        const vizBars = [];
        const vizGroup = new THREE.Group();
        scene.add(vizGroup);
        const barCount = 64;
        const radius = 6;
        
        for(let i=0; i<barCount; i++) {
            const geo = new THREE.BoxGeometry(0.1, 1, 0.1);
            const mat = new THREE.MeshBasicMaterial({ color: 0x4488ff, transparent: true, opacity: 0.8 });
            const bar = new THREE.Mesh(geo, mat);
            const angle = (i / barCount) * Math.PI * 2;
            bar.position.set(Math.cos(angle)*radius, -4, Math.sin(angle)*radius);
            bar.rotation.y = -angle;
            vizGroup.add(bar);
            vizBars.push(bar);
        }

        // --- PARTICLE SYSTEM ---
        const particleCount = 400; 
        const particles = new THREE.BufferGeometry();
        const pPos = new Float32Array(particleCount * 3);
        const pVel = []; 
        const pLife = new Float32Array(particleCount);
        const pColor = new Float32Array(particleCount * 3); // RGB
        
        for(let i=0; i<particleCount; i++) {
            pPos[i*3]=0; pPos[i*3+1]=-100; pPos[i*3+2]=0;
            pVel.push(new THREE.Vector3()); pLife[i] = 0;
            pColor[i*3]=1; pColor[i*3+1]=0.8; pColor[i*3+2]=0.5; // Default Gold
        }
        particles.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
        particles.setAttribute('color', new THREE.BufferAttribute(pColor, 3));
        
        const pMat = new THREE.PointsMaterial({ 
            vertexColors: true, size: 0.2, transparent: true, opacity: 1, blending: THREE.AdditiveBlending 
        });
        const particleSystem = new THREE.Points(particles, pMat);
        scene.add(particleSystem);

        function spawnParticles(isBot) {
            const r = isBot ? 0.0 : 1.0;
            const g = isBot ? 1.0 : 0.8;
            const b = isBot ? 1.0 : 0.5;
            
            for(let i=0; i<60; i++) { 
                for(let j=0; j<particleCount; j++) {
                    if(pLife[j] <= 0) {
                        pLife[j] = 1.0; 
                        const idx = j*3;
                        pPos[idx] = 0; pPos[idx+1] = 0; pPos[idx+2] = 3.2; 
                        pVel[j].set((Math.random()-0.5)*1.5, (Math.random()-0.5)*1.5, Math.random()*1.5); 
                        // Set color based on source
                        pColor[idx] = r; pColor[idx+1] = g; pColor[idx+2] = b;
                        break;
                    }
                }
            }
            particles.attributes.color.needsUpdate = true;
        }
        function updateParticles() {
            const positions = particleSystem.geometry.attributes.position.array;
            for(let i=0; i<particleCount; i++) {
                if(pLife[i] > 0) {
                    pLife[i] -= 0.02; 
                    const idx = i*3;
                    positions[idx] += pVel[i].x; positions[idx+1] += pVel[i].y; positions[idx+2] += pVel[i].z;
                    pVel[i].y -= 0.02; // Gravity
                } else { positions[i*3+1] = -100; }
            }
            particleSystem.geometry.attributes.position.needsUpdate = true;
        }

        // --- TYPEBALL ---
        function createTexture() {
            const cvs = document.createElement('canvas'); cvs.width = 4096; cvs.height = 1024;
            const ctx = cvs.getContext('2d');
            ctx.fillStyle = config.ballColor; ctx.fillRect(0,0,4096,1024);
            for(let i=0;i<60000;i++) { ctx.fillStyle=`rgba(255,255,255,${Math.random()*0.1})`; ctx.fillRect(Math.random()*4096,Math.random()*1024,2,2); }
            ctx.font = "bold 110px 'Courier Prime', monospace"; ctx.textAlign='center'; ctx.textBaseline='middle';
            const vPad=1024*0.08, uH=1024-(vPad*2), rH=uH/config.rows, cW=4096/config.cols;
            layoutRows.forEach((rowStr,r)=>{
                const y=vPad+(r*rH)+(rH/2);
                rowStr.split('').forEach((char,c)=>{
                    const x=(c*cW)+(cW/2);
                    ctx.save(); ctx.translate(x,y); ctx.scale(-1,1);
                    ctx.fillStyle='rgba(0,0,0,0.8)'; ctx.fillText(char,4,4);
                    ctx.fillStyle='rgba(255,255,255,0.4)'; ctx.fillText(char,-2,-2);
                    ctx.fillStyle=config.textColor; ctx.fillText(char,0,0);
                    ctx.restore();
                });
            });
            ctx.strokeStyle="rgba(0,0,0,0.1)"; ctx.lineWidth=2;
            for(let i=0;i<=config.rows;i++){ const y=vPad+(i*rH); ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(4096,y); ctx.stroke(); }
            return new THREE.CanvasTexture(cvs);
        }
        const texture = createTexture();
        const ballMat = new THREE.MeshStandardMaterial({
            map: texture, color: 0xffffff, roughness: config.roughness, metalness: config.metalness,
            bumpMap: texture, bumpScale: 0.15, emissive: 0x000000
        });
        const ball = new THREE.Mesh(new THREE.SphereGeometry(3.2, 64, 48), ballMat);
        ball.castShadow = true;

        const capGroup = new THREE.Group();
        const capMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.4, metalness: 0.2 });
        capGroup.add(new THREE.Mesh(new THREE.CylinderGeometry(2, 2.2, 0.8, 32), capMat)).position.y = 2.7;
        const lever = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.2, 2.8), capMat);
        lever.position.set(0, 3.2, 0); lever.rotation.x = Math.PI / 12; capGroup.add(lever);
        
        const lCvs = document.createElement('canvas'); lCvs.width=512; lCvs.height=256;
        const lCtx = lCvs.getContext('2d'); lCtx.fillStyle='#111'; lCtx.fillRect(0,0,512,256);
        lCtx.fillStyle='#eee'; lCtx.font='bold 40px Arial'; lCtx.textAlign='center';
        lCtx.fillText('PRESTIGE',256,100); lCtx.fillText('ELITE 72',256,160);
        lCtx.beginPath(); lCtx.fillStyle='#fff'; lCtx.moveTo(256,40); lCtx.lineTo(240,20); lCtx.lineTo(272,20); lCtx.fill();
        const label = new THREE.Mesh(new THREE.PlaneGeometry(2,1), new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(lCvs), transparent:true}));
        label.position.set(0, 3.11, 0.8); label.rotation.x = -Math.PI / 3; capGroup.add(label);

        const pivot = new THREE.Group(); pivot.add(ball); pivot.add(capGroup); scene.add(pivot);
        const plane = new THREE.Mesh(new THREE.PlaneGeometry(50,50), new THREE.MeshStandardMaterial({color:0x050505, roughness:0.1, metalness:0.5}));
        plane.rotation.x = -Math.PI/2; plane.position.y = -4; scene.add(plane);

        // --- STATE ---
        const charMap = {}; 
        layoutRows.forEach((rowStr, r) => {
            let angleX = r===0?0.55 : r===1?0.20 : r===2?-0.20 : -0.55;
            for(let c=0; c<config.cols; c++) {
                const char = rowStr[c];
                if(!char) continue;
                charMap[char] = { x: angleX, y: -(c * ((Math.PI*2)/config.cols)) - Math.PI/2 };
            }
        });

        const state = {
            rotX: 0, rotY: 0, targetX: 0, targetY: 0,
            isStriking: false, strikeStart: 0,
            isDragging: false, lastDragX: 0, lastDragY: 0,
            capsLock: false, shift: false,
            typingQueue: [], isThinking: false, nextCharTime: 0,
            activeHue: 0,
            // PERFORMANCE METRICS
            shakeIntensity: 0,
            zoomLevel: 0
        };
        let currentInput = "";
        let activeBotBubble = null;

        // --- AI ---
        async function askGemini(query) {
            state.isThinking = true; document.getElementById('status-light').className = 'thinking';
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: query }] }], systemInstruction: { parts: [{ text: systemPrompt }] } })
                });
                const data = await response.json();
                const text = data.candidates?.[0]?.content?.parts?.[0]?.text || "ERROR";
                const line = document.createElement('div'); line.className = 'chat-line bot-line'; line.textContent = "IBM: ";
                document.getElementById('chat-history').appendChild(line); activeBotBubble = line;
                state.typingQueue = text.split(''); state.isThinking = false; document.getElementById('status-light').className = 'speaking';
            } catch(e) { state.isThinking = false; document.getElementById('status-light').className = ''; }
        }

        function triggerChar(char, isBot=false) {
            let note = 'kick';
            const keyEl = document.querySelector(`.key[data-char="${char.toLowerCase()}"]`);
            if(keyEl && keyEl.dataset.note) note = keyEl.dataset.note;
            else { const code = char.charCodeAt(0); note = Object.keys(Notes)[code % Object.keys(Notes).length]; }
            if(char === ' ') note = 'kick';
            
            // Pass isBot to change sound
            AudioEngine.playNote(note==='kick'?0:Notes[note], note==='kick'?'kick':'pluck', isBot);
            
            // 1. Performance: Shake
            state.shakeIntensity = Math.min(state.shakeIntensity + (isBot ? 0.1 : 0.3), 1.5); // Bot shakes less
            state.zoomLevel = Math.min(state.zoomLevel + 0.05, 0.4); 

            // 2. Set Color & Emissive Flash
            if(Notes[note]) {
                const freq = Notes[note];
                state.activeHue = isBot ? 0.5 : (freq / 1000); // Bot is Cyan (0.5), Human is Freq based
                const col = new THREE.Color().setHSL(state.activeHue, 0.9, 0.5);
                colorLight.color.copy(col);
                // Flash White then fade
                ballMat.emissive.setHex(0xffffff);
            } else {
                ballMat.emissive.setHex(0xffffff);
            }

            if (!state.isDragging) {
                const target = charMap[char] || charMap[char.toUpperCase()];
                if (target) { state.targetX = target.x; state.targetY = target.y; } 
                else { state.targetY += (Math.random()-0.5)*2; state.targetX = (Math.random()-0.5)*1; }
            }
            
            if(!state.isStriking) { state.isStriking = true; state.strikeStart = Date.now(); }
            
            spawnParticles(isBot); 

            if(isBot && activeBotBubble) {
                activeBotBubble.textContent += char;
                // Auto scroll to latest text
                document.getElementById('chat-history').scrollTop = document.getElementById('chat-history').scrollHeight;
            }
        }

        // --- LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            
            // Audio Visuals
            const freqData = AudioEngine.getFrequencyData();
            let totalVol = 0;
            if (freqData.length > 0) {
                for(let i=0; i<64; i++) {
                    const val = freqData[i]; totalVol += val;
                    const scale = Math.max(0.1, (val / 255) * 8); // Taller bars
                    vizBars[i].scale.y = scale;
                    vizBars[i].position.y = -4 + (scale/2);
                    const barCol = new THREE.Color().setHSL(state.activeHue, 0.9, 0.5 * (val/255));
                    vizBars[i].material.color.lerp(barCol, 0.2);
                }
                const avg = totalVol / 64;
                colorLight.intensity = 0.5 + (avg / 50); 
            }

            updateParticles();

            // Bot Queue
            if(state.typingQueue.length > 0 && Date.now() > state.nextCharTime) {
                triggerChar(state.typingQueue.shift(), true);
                state.nextCharTime = Date.now() + 60 + Math.random()*80; // Faster bot
                if(state.typingQueue.length===0) document.getElementById('status-light').className = '';
            }

            // Physics
            if (state.isDragging) {
                ball.rotation.y = state.targetY; pivot.rotation.x = state.targetX;
            } else {
                ball.rotation.y += (state.targetY - ball.rotation.y) * 0.15; 
                pivot.rotation.x += (state.targetX - pivot.rotation.x) * 0.15;
            }

            if(state.isStriking) {
                const e = Date.now() - state.strikeStart;
                if (e < 50) pivot.position.z = (e/50) * 1.8; 
                else if (e < 120) pivot.position.z = 1.8 * (1 - (e-50)/70);
                else {
                    state.isStriking = false; pivot.position.z = 0;
                }
            } else {
                pivot.position.y = Math.sin(Date.now()*0.001) * 0.1;
            }
            
            // Color Decay
            const targetColor = new THREE.Color().setHSL(state.activeHue, 0.8, 0.1);
            ballMat.emissive.lerp(targetColor, 0.1); // Fade from white flash

            // Camera Trauma & Zoom
            state.shakeIntensity *= 0.9; 
            state.zoomLevel *= 0.98; 
            
            const shake = new THREE.Vector3(
                (Math.random()-0.5) * state.shakeIntensity,
                (Math.random()-0.5) * state.shakeIntensity,
                0
            );
            
            // Apply zoom
            const zoomVec = new THREE.Vector3(0, -state.zoomLevel*2, -state.zoomLevel*5);
            
            camera.position.copy(baseCamPos).add(shake).add(zoomVec);
            camera.lookAt(0,0,0);

            renderer.render(scene, camera);
        }

        // --- INPUT ---
        container.addEventListener('pointerdown', (e) => {
            state.isDragging = true; state.lastDragX = e.clientX; state.lastDragY = e.clientY;
            state.targetY = ball.rotation.y; state.targetX = pivot.rotation.x;
            container.style.cursor = 'grabbing';
        });
        window.addEventListener('pointermove', (e) => {
            if(!state.isDragging) return;
            state.targetY += (e.clientX - state.lastDragX) * 0.005;
            state.targetX += (e.clientY - state.lastDragY) * 0.005;
            state.lastDragX = e.clientX; state.lastDragY = e.clientY;
        });
        window.addEventListener('pointerup', () => { state.isDragging = false; container.style.cursor = 'grab'; });

        function pressKey(keyEl) {
            keyEl.classList.add('active'); setTimeout(() => keyEl.classList.remove('active'), 100);
            const id = keyEl.id, action = keyEl.dataset.action, char = keyEl.dataset.char;

            if (id === 'enter-btn') {
                if(currentInput.trim()) {
                    const div = document.createElement('div'); div.className='chat-line user-line'; div.textContent="> "+currentInput;
                    document.getElementById('chat-history').appendChild(div);
                    askGemini(currentInput); currentInput = ""; document.getElementById('current-line').textContent="";
                } return;
            }
            if (action === 'backspace') { currentInput=currentInput.slice(0,-1); document.getElementById('current-line').textContent=currentInput; return; }
            if (id === 'shift-btn') { state.shift=!state.shift; return; }
            if (id === 'caps-btn') { state.capsLock=!state.capsLock; return; }
            if (char) {
                let txt = (state.shift||state.capsLock) ? char.toUpperCase() : char;
                currentInput += txt; document.getElementById('current-line').textContent=currentInput;
                triggerChar(txt, false);
            }
        }
        document.querySelectorAll('.key').forEach(k => k.addEventListener('pointerdown', e => { e.preventDefault(); pressKey(k); }));
        document.getElementById('start-btn').addEventListener('click', () => {
            AudioEngine.init(); document.getElementById('overlay').classList.add('hidden'); animate(); setTimeout(()=>triggerChar('H',true),500);
        });
        window.addEventListener('resize', () => {
            const r = container.getBoundingClientRect(); camera.aspect=r.width/r.height; camera.updateProjectionMatrix(); renderer.setSize(r.width,r.height);
        });

    </script>
</body>
</html>
