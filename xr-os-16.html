<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>ORBITAL LOOM: M_PRO GLASS</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <style>
        :root {
            --te-orange: #ff4d00;
            --te-bg: rgba(18, 18, 18, 0.75);
            --te-grey: rgba(46, 46, 46, 0.6);
            --lcd-text: #00ffaa;
            --font-mono: 'Share Tech Mono', 'Courier New', monospace;
        }

        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; outline: none; }
        
        body {
            margin: 0; overflow: hidden;
            background-color: #020202;
            font-family: var(--font-mono);
            color: #fff;
        }

        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between;
        }

        /* --- GLASS HUD --- */
        #top-hud {
            pointer-events: auto; padding: 20px;
            display: flex; justify-content: space-between; align-items: flex-start;
            z-index: 100;
        }

        .glass-panel {
            background: var(--te-bg);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 4px;
            display: flex;
            align-items: center; gap: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        #btn-engine {
            background: var(--te-orange); border: none; color: #fff;
            padding: 8px 16px; font-size: 10px; font-weight: bold;
            border-radius: 2px; cursor: pointer; text-transform: uppercase;
        }
        #btn-engine.active { background: #fff; color: var(--te-orange); }

        #XRButton {
            position: absolute !important; top: 20px !important; right: 20px !important;
            bottom: auto !important; left: auto !important; width: auto !important;
            background: var(--te-bg) !important; 
            backdrop-filter: blur(25px) !important;
            border: 1px solid var(--te-orange) !important;
            font-family: var(--font-mono) !important; font-size: 10px !important;
            padding: 12px 18px !important; border-radius: 4px !important;
            opacity: 1 !important; z-index: 1000 !important; color: var(--te-orange) !important;
        }

        /* --- CONSOLE --- */
        #console-container {
            width: 100%; display: flex; justify-content: center;
            padding-bottom: max(15px, env(safe-area-inset-bottom));
            pointer-events: none;
        }

        #console {
            pointer-events: auto; width: 94%; max-width: 480px;
            background: var(--te-bg);
            backdrop-filter: blur(30px);
            border-radius: 8px; padding: 15px;
            display: flex; flex-direction: column; gap: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 100px rgba(0,0,0,0.8);
        }

        #track-rack { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
        .track-mod {
            height: 40px; background: rgba(0,0,0,0.3); border: 1px solid #333;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; border-radius: 4px;
        }
        .track-mod.active { background: rgba(255, 255, 255, 0.1); border-color: var(--t-color); border-bottom-width: 4px; }
        .track-mod .led { width: 6px; height: 6px; border-radius: 50%; background: #222; }
        .track-mod.active .led { background: var(--t-color); box-shadow: 0 0 10px var(--t-color); }

        #lcd {
            background: rgba(0,0,0,0.5); border: 1px inset rgba(255,255,255,0.05); border-radius: 4px;
            padding: 12px; display: flex; justify-content: space-between; align-items: center;
        }
        .lcd-v { color: var(--lcd-text); font-size: 16px; text-transform: uppercase; letter-spacing: 2px; }
        .lcd-m { color: #3a3; font-size: 9px; opacity: 0.8; }

        #jog-dial {
            height: 50px; background: rgba(0,0,0,0.4); border: 1px solid #444; border-radius: 4px;
            position: relative; overflow: hidden; display: flex; align-items: center;
            justify-content: center; cursor: ew-resize;
            background-image: repeating-linear-gradient(90deg, rgba(255,255,255,0.05), rgba(255,255,255,0.05) 1px, transparent 1px, transparent 15px);
        }
        #jog-dial::after { content:''; position:absolute; height:100%; width:3px; background:var(--te-orange); left:50%; transform:translateX(-50%); box-shadow:0 0 12px var(--te-orange); }

        #action-row { display: flex; gap: 8px; }
        .btn-act {
            flex: 1; height: 48px; border: none; border-radius: 4px;
            font-family: var(--font-mono); font-size: 11px; font-weight: bold;
            cursor: pointer; text-transform: uppercase;
        }
        .btn-main { background: var(--te-orange); color: #fff; box-shadow: 0 4px 0 #992e00; }
        .btn-sec { background: #fff; color: #000; box-shadow: 0 4px 0 #999; }

        #reticle {
            position: absolute; top: 50%; left: 50%; width: 4px; height: 4px;
            transform: translate(-50%, -50%); background: #fff; border-radius: 50%;
            pointer-events: none; opacity: 0.8; transition: all 0.2s; z-index: 5;
        }
        #reticle.active { width: 40px; height: 40px; background: transparent; border: 2px solid var(--te-orange); opacity: 1; }

    </style>
</head>
<body>

    <div id="ui-layer">
        <div id="top-hud">
            <div class="glass-panel">
                <div>
                    <div style="font-size:12px; font-weight:bold; letter-spacing:1px;">ORBITAL LOOM</div>
                    <div id="status-bpm" style="font-size:9px; color:#aaa">110 BPM // PHASE_INVERT_LOCK</div>
                </div>
                <button id="btn-engine">START</button>
            </div>
        </div>

        <div id="console-container">
            <div id="console">
                <div id="track-rack"></div>
                <div id="lcd">
                    <div>
                        <div class="lcd-v" id="lcd-name">KICK</div>
                        <div class="lcd-m" id="lcd-mode">BUILD MODE</div>
                    </div>
                    <div style="text-align:right">
                        <div class="lcd-v" id="lcd-selection">1.0</div>
                        <div class="lcd-m" id="lcd-param">VALUE</div>
                    </div>
                </div>
                <div id="jog-dial"></div>
                <div id="action-row">
                    <button class="btn-act btn-sec" id="btn-mode">BUILD</button>
                    <button class="btn-act btn-main" id="btn-place">PLACE</button>
                    <button class="btn-act btn-sec" id="btn-clear" style="flex:0.3">CLR</button>
                </div>
            </div>
        </div>
    </div>

    <div id="reticle"></div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { XRButton } from 'three/addons/webxr/XRButton.js';

        // --- MATH RECALIBRATION ---
        const CFG = { 
            RINGS: 8, 
            SLOTS: 16, 
            RADIUS: 3.5, 
            WALL_DEPTH: 0.5, 
            HEIGHT: 1.0, 
            BPM: 110 
        };

        const PALETTE = ['#FF4D00', '#00FFAA', '#00CCFF', '#AA00FF', '#FFCC00', '#FF0055', '#55FF00', '#FFFFFF'];
        const TRACK_NAMES = ['KICK', 'SNARE', 'HIHAT', 'BASS', 'LEAD', 'PAD', 'ARP', 'NOISE'];
        const MODES = ['BUILD', 'SCALE', 'TUNE', 'SHIFT'];

        const state = {
            isPlaying: false, focusTrack: 0, modeIdx: 0,
            blocks: [], hoverPos: null, currentStep: 0,
            bpm: 110,
            trackSettings: Array.from({length:8}, () => ({ 
                scale: 1.0, filter: 4000, idx: 0, mode: 'MASON', rotation: 0 
            }))
        };

        // --- SOUND ENGINE ---
        class TEAUMason {
            constructor() {
                this.ctx = null; this.tracks = [];
                for(let i=0; i<8; i++) this.tracks.push({ audio: new Audio(), gain: null, filter: null });
            }
            async init() {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                const master = this.ctx.createGain(); master.gain.value = 0.6; master.connect(this.ctx.destination);
                this.tracks.forEach((t, i) => {
                    t.gain = this.ctx.createGain(); t.gain.gain.value = 0;
                    t.filter = this.ctx.createBiquadFilter(); t.filter.type = 'lowpass';
                    t.filter.frequency.value = state.trackSettings[i].filter;
                    t.filter.connect(t.gain); t.gain.connect(master);
                });
                await this.ctx.resume();
            }
            trigger(id) {
                if(!this.ctx) return;
                const set = state.trackSettings[id]; const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator(); const env = this.ctx.createGain();
                osc.type = id % 2 === 0 ? 'square' : 'sawtooth';
                osc.frequency.value = (45 + (id * 12) + (set.idx * 5));
                const f = this.ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = set.filter;
                osc.connect(f); f.connect(env); env.connect(this.ctx.destination);
                env.gain.setValueAtTime(0.3, now); env.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(); osc.stop(now + 0.15);
            }
            snap(vol = 0.25) {
                if(!this.ctx) return;
                const o = this.ctx.createOscillator(); const g = this.ctx.createGain();
                o.frequency.setValueAtTime(1400, this.ctx.currentTime);
                o.frequency.exponentialRampToValueAtTime(10, this.ctx.currentTime + 0.04);
                g.gain.setValueAtTime(vol, this.ctx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.04);
                o.connect(g); g.connect(this.ctx.destination);
                o.start(); o.stop(this.ctx.currentTime + 0.04);
            }
        }
        const audio = new TEAUMason();

        // --- RENDERER ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 100);
        camera.position.set(0, 6, 12);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);
        
        const xrBtn = XRButton.createButton(renderer, {
            optionalFeatures: ['dom-overlay'], domOverlay: { root: document.getElementById('ui-layer') }
        });
        document.body.appendChild(xrBtn);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; controls.target.set(0, 4, 0);
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        const dl = new THREE.DirectionalLight(0xffffff, 1.2); dl.position.set(5,10,5); scene.add(dl);

        // --- TOWER ---
        const towerGroup = new THREE.Group(); scene.add(towerGroup);
        const ringGroups = Array.from({length: CFG.RINGS}, () => new THREE.Group());
        ringGroups.forEach((g, i) => { g.position.y = i * CFG.HEIGHT; towerGroup.add(g); });

        function createCore() {
            const canvas = document.createElement('canvas'); canvas.width = 1024; canvas.height = 1024;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#0a0a0a'; ctx.fillRect(0,0,1024,1024);
            ctx.strokeStyle = '#333'; ctx.lineWidth = 4;
            const rH = 1024 / CFG.RINGS; const sW = 1024 / CFG.SLOTS;
            for(let i=0; i<CFG.RINGS; i++) {
                const y = i * rH; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1024, y); ctx.stroke();
                const offset = (i % 2 === 1) ? sW / 2 : 0;
                for(let j=0; j<=CFG.SLOTS; j++) {
                    let x = (j * sW) + offset;
                    ctx.beginPath(); ctx.moveTo(x % 1024, y); ctx.lineTo(x % 1024, y + rH); ctx.stroke();
                }
            }
            const mat = new THREE.MeshStandardMaterial({ 
                map: new THREE.CanvasTexture(canvas), transparent: true, opacity: 0.8, side: THREE.DoubleSide 
            });
            mat.map.wrapS = mat.map.wrapT = THREE.RepeatWrapping;
            const geo = new THREE.CylinderGeometry(CFG.RADIUS, CFG.RADIUS, CFG.RINGS * CFG.HEIGHT, 64, 1, true);
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.y = (CFG.RINGS * CFG.HEIGHT) / 2;
            return mesh;
        }
        towerGroup.add(createCore());

        const hitCylinder = new THREE.Mesh(
            new THREE.CylinderGeometry(CFG.RADIUS+0.05, CFG.RADIUS+0.05, CFG.RINGS * CFG.HEIGHT, 32, 1),
            new THREE.MeshBasicMaterial({ visible: false, side: THREE.DoubleSide })
        );
        hitCylinder.position.y = (CFG.RINGS * CFG.HEIGHT) / 2;
        towerGroup.add(hitCylinder);

        const scannerPivot = new THREE.Group();
        const beam = new THREE.Mesh(new THREE.BoxGeometry(0.1, CFG.RINGS*CFG.HEIGHT+2, 0.4), new THREE.MeshBasicMaterial({ color: 0xff4d00, transparent:true, opacity:0.8 }));
        beam.position.set(0, (CFG.RINGS * CFG.HEIGHT)/2, CFG.RADIUS+0.1); 
        scannerPivot.add(beam); 
        scene.add(scannerPivot);

        // --- SOLID 3D MASONRY ---
        function createBrick(color, ring, slot, widthScale = 1.0) {
            const baseArc = (Math.PI * 2) / CFG.SLOTS;
            const arc = baseArc * widthScale * 0.95;
            
            // Build keystone footprint centered at PI/2 to align with Front axis
            const shape = new THREE.Shape();
            const start = Math.PI/2 - arc/2;
            const end = Math.PI/2 + arc/2;
            shape.absarc(0, 0, CFG.RADIUS + CFG.WALL_DEPTH, start, end, false); 
            shape.absarc(0, 0, CFG.RADIUS, end, start, true); 
            
            const geo = new THREE.ExtrudeGeometry(shape, {
                depth: CFG.HEIGHT - 0.1,
                bevelEnabled: true,
                bevelThickness: 0.04,
                bevelSize: 0.04,
                bevelSegments: 2
            });
            geo.rotateX(-Math.PI/2);
            geo.translate(0, - (CFG.HEIGHT - 0.1) / 2, 0); 
            
            const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ 
                color, roughness:0.1, metalness:0.9, emissive:color, emissiveIntensity:0.2, side: THREE.DoubleSide
            }));
            
            const stepRad = (Math.PI * 2) / CFG.SLOTS;
            let angle = slot * stepRad;
            if(ring % 2 === 1) angle += (stepRad / 2); 
            
            mesh.rotation.y = angle;
            mesh.position.y = CFG.HEIGHT / 2;
            return mesh;
        }

        const ghost = createBrick(0xffffff, 0, 0);
        ghost.material = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent:true, opacity:0.3, side: THREE.DoubleSide });
        scene.add(ghost);

        // --- INTERACTION LOGIC (PHASE INVERTED) ---
        const raycaster = new THREE.Raycaster();
        const clock = new THREE.Clock();

        function getGridPos(pt) {
            // Convert intersection from World to Local to fix AR drift
            const localPt = towerGroup.worldToLocal(pt.clone());
            
            let y = Math.max(0, localPt.y);
            const ring = Math.min(Math.floor(y / CFG.HEIGHT), CFG.RINGS-1);
            
            // PHASE INVERSION: -x and -z pulls the projection to the side facing the camera
            const angle = Math.atan2(-localPt.x, -localPt.z);
            let nA = angle < 0 ? angle + Math.PI*2 : angle;
            
            // Sync with local ring rotation
            nA -= ringGroups[ring].rotation.y;
            if(nA < 0) nA += Math.PI*2;
            
            const stepRad = (Math.PI * 2) / CFG.SLOTS;
            if(ring % 2 === 1) { 
                nA -= (stepRad/2); if(nA < 0) nA += Math.PI*2; 
            }
            const slot = Math.round(nA / stepRad) % CFG.SLOTS;
            return { ring, slot };
        }

        function toggleBrick() {
            if(!state.hoverPos) return;
            const { ring, slot } = state.hoverPos;
            const set = state.trackSettings[ring];
            const idx = state.blocks.findIndex(b => b.ring===ring && b.slot===slot);
            if(idx>=0) { 
                ringGroups[ring].remove(state.blocks[idx].mesh); state.blocks.splice(idx, 1); 
            }
            else {
                if (navigator.vibrate) navigator.vibrate([15, 30]);
                audio.snap();
                const mesh = createBrick(PALETTE[ring], ring, slot, set.scale);
                mesh.scale.set(1.4, 1.4, 1.4);
                ringGroups[ring].add(mesh);
                state.blocks.push({ ring, slot, mesh });
                audio.trigger(ring);
            }
        }

        renderer.setAnimationLoop(() => {
            raycaster.setFromCamera({x:0,y:0}, camera);
            const hits = raycaster.intersectObject(hitCylinder);
            const reticle = document.getElementById('reticle');

            if(hits.length > 0) {
                state.hoverPos = getGridPos(hits[0].point);
                const { ring, slot } = state.hoverPos;
                const set = state.trackSettings[ring];
                const stepRad = (Math.PI * 2) / CFG.SLOTS;
                let angle = slot * stepRad;
                if(ring % 2 === 1) angle += (stepRad / 2);

                ghost.position.y = ring * CFG.HEIGHT + CFG.HEIGHT/2;
                ghost.rotation.y = angle + ringGroups[ring].rotation.y; 
                ghost.visible = (state.modeIdx === 0);
                reticle.classList.add('active'); reticle.style.borderColor = PALETTE[ring];
            } else {
                ghost.visible = false; state.hoverPos = null; reticle.classList.remove('active');
            }

            if(state.isPlaying) {
                const dt = clock.getDelta();
                const rps = (state.bpm / 60) / 4; 
                scannerPivot.rotation.y += rps * (Math.PI * 2) * dt;
                let sA = scannerPivot.rotation.y % (Math.PI*2);
                if(sA < 0) sA += Math.PI*2;
                
                const step = Math.floor((sA / (Math.PI*2)) * CFG.SLOTS);
                if(step !== state.currentStep) {
                    state.currentStep = step;
                    state.blocks.forEach(b => {
                        const stepRad = (Math.PI*2)/CFG.SLOTS;
                        let bA = b.slot * stepRad;
                        if(b.ring % 2 === 1) bA += stepRad/2;
                        bA += ringGroups[b.ring].rotation.y;
                        bA = bA % (Math.PI*2); if(bA < 0) bA += Math.PI*2;

                        if(Math.abs(bA - sA) < 0.15 || Math.abs(bA - sA) > (Math.PI*2 - 0.15)) {
                           audio.trigger(b.ring);
                           b.mesh.scale.set(1.15, 1.15, 1.15);
                        }
                    });
                }
            }
            state.blocks.forEach(b => b.mesh.scale.lerp(new THREE.Vector3(1,1,1), 0.15));
            controls.update();
            renderer.render(scene, camera);
        });

        // --- AR SESSION START ---
        renderer.xr.addEventListener('sessionstart', () => {
            towerGroup.position.set(0, 0, -3); 
            hitCylinder.position.z = -3;
            scannerPivot.position.z = -3;
        });

        // --- UI ---
        const rack = document.getElementById('track-rack');
        PALETTE.forEach((c, i) => {
            const m = document.createElement('div');
            m.className = `track-mod ${i===0?'active':''}`;
            m.style.setProperty('--t-color', c);
            m.innerHTML = `<div class="led"></div>`;
            m.onclick = () => focus(i);
            rack.appendChild(m);
        });

        function focus(id) {
            state.focusTrack = id;
            document.querySelectorAll('.track-mod').forEach((m,i)=>m.classList.toggle('active', i===id));
            updateLCD();
        }

        function updateLCD() {
            const id = state.focusTrack; const set = state.trackSettings[id];
            document.getElementById('lcd-name').innerText = TRACK_NAMES[id];
            document.getElementById('lcd-mode').innerText = MODES[state.modeIdx] + " MODE";
            let v = (state.modeIdx===0) ? set.mode : 
                    (state.modeIdx===1) ? (set.scale*100).toFixed(0)+"%" :
                    (state.modeIdx===2) ? set.idx+1 :
                    (ringGroups[id].rotation.y * 57.2).toFixed(0)+"°";
            document.getElementById('lcd-selection').innerText = v;
            document.getElementById('lcd-param').innerText = MODES[state.modeIdx];
        }

        document.getElementById('btn-engine').onclick = async (e) => {
            if(!audio.ctx) { await audio.init(); focus(0); }
            else audio.ctx.resume();
            state.isPlaying = !state.isPlaying;
            e.target.innerText = state.isPlaying ? "ON" : "OFF";
            e.target.classList.toggle('active', state.isPlaying);
        };

        document.getElementById('btn-mode').onclick = (e) => {
            state.modeIdx = (state.modeIdx + 1) % MODES.length;
            e.target.innerText = MODES[state.modeIdx]; updateLCD();
        };

        let isDragging = false, sX = 0;
        const dial = document.getElementById('jog-dial');
        const onStart = (cX) => { isDragging = true; sX = cX; };
        const onMove = (cX) => {
            if (!isDragging) return;
            const dx = sX - cX;
            const set = state.trackSettings[state.focusTrack];
            if(Math.abs(dx) > 25) {
                if (navigator.vibrate) navigator.vibrate(2);
                audio.snap(0.05);
                const dir = dx > 0 ? 1 : -1;
                if(state.modeIdx === 1) set.scale = Math.max(0.1, Math.min(3.0, set.scale - dir * 0.1));
                if(state.modeIdx === 2) set.idx = (set.idx + dir + 12) % 12;
                if(state.modeIdx === 3) ringGroups[state.focusTrack].rotation.y += (dir * 0.05);
                updateLCD(); sX = cX;
            }
        };

        dial.addEventListener('touchstart', (e) => onStart(e.touches[0].clientX));
        dial.addEventListener('touchmove', (e) => onMove(e.touches[0].clientX));
        dial.addEventListener('touchend', () => isDragging = false);
        dial.addEventListener('mousedown', (e) => onStart(e.clientX));
        window.addEventListener('mousemove', (e) => onMove(e.clientX));
        window.addEventListener('mouseup', () => isDragging = false);

        document.getElementById('btn-place').onclick = toggleBrick;
        document.getElementById('btn-clear').onclick = () => {
            state.blocks = state.blocks.filter(b => {
                if(b.ring === state.focusTrack) { ringGroups[b.ring].remove(b.mesh); return false; }
                return true;
            });
        };

        const con = renderer.xr.getController(0);
        con.addEventListener('select', toggleBrick);
        scene.add(con);
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        focus(0);
    </script>
</body>
</html>
