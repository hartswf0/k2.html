name: TRACE smoke

on:
  push:
    paths:
      - "trace/**"
      - ".github/workflows/trace-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: JavaScript syntax
        run: find trace -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: TRACE release invariants
        run: node trace/smoke.mjs
