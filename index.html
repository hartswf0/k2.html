<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LATENT AUDIO SUITE</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎛️</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #030303;
            --panel: rgba(8, 8, 8, 0.9);
            --border: rgba(255, 255, 255, 0.15);
            --text-main: #f2f2f2;
            --text-dim: #a1a1a6;
            --scan: rgba(255, 255, 255, 0.04);
            --highlight: #f5a623;
            --highlight-2: #39ffde;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at 10% -10%, rgba(57, 255, 222, 0.14), transparent 45%),
                radial-gradient(circle at 90% 10%, rgba(245, 165, 35, 0.08), transparent 40%),
                var(--bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
        }

        .mono {
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 0.2em;
        }

        .hero-text {
            background: linear-gradient(180deg, #ffffff 0%, #c0c0c0 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.35em;
        }

        header {
            width: 100%;
            max-width: 1180px;
            margin: 0 auto;
            padding: 2rem 4vw 1rem;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .hero-stack {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .hero-sub {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.85);
        }

        .hero-pill {
            padding: 4px 12px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-transform: uppercase;
            letter-spacing: 0.4em;
            font-size: 0.7rem;
        }

        .hero-meta {
            display: flex;
            gap: 12px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            color: var(--text-dim);
        }

        .scanline {
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(transparent, transparent 6px, var(--scan) 6px, var(--scan) 8px);
            pointer-events: none;
            z-index: 5;
            opacity: 0.45;
        }

        .control-shell {
            width: 100%;
            max-width: 1180px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 0 4vw;
        }

        .control-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            font-size: 0.75rem;
        }

        .control-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
        }

        .control-card {
            border-radius: 14px;
            padding: 18px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--control-color, rgba(255, 255, 255, 0.3));
            transition: transform 0.25s ease, border 0.25s ease;
            box-shadow: 0 0 22px rgba(0, 0, 0, 0.35);
        }

        .control-card h3 {
            margin: 0;
            font-size: 1.1rem;
            letter-spacing: 0.25em;
            color: var(--control-color, #f5a623);
        }

        .control-card p {
            margin: 0.4rem 0 0;
            color: var(--text-dim);
            font-size: 0.8rem;
            letter-spacing: 0.15em;
        }

        .control-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .search-shell {
            width: 100%;
            max-width: 1180px;
            margin: 0 auto;
            padding: 0 4vw 1rem;
        }

        .search-shell input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(12, 12, 12, 0.7);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.3em;
        }

        .search-shell input::placeholder {
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 0.4em;
        }

        .manifest-wrap {
            width: 100%;
            max-width: 1180px;
            margin: 0 auto;
            padding: 0 4vw 3rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .family-section {
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 28px;
            background: rgba(7, 7, 7, 0.85);
            position: relative;
            overflow: hidden;
        }

        .family-section::before {
            content: '';
            position: absolute;
            inset: 10% 5% auto;
            height: 180px;
            background: radial-gradient(circle, var(--family-accent, var(--highlight)) 0%, transparent 60%);
            opacity: 0.25;
            pointer-events: none;
        }

        .family-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 18px;
        }

        .family-name {
            margin: 0;
            font-size: clamp(1.6rem, 2.6vw, 2.2rem);
            letter-spacing: 0.25em;
            font-weight: 700;
        }

        .family-meta {
            margin: 0.4rem 0 0;
            color: var(--text-dim);
            font-size: 0.85rem;
            letter-spacing: 0.2em;
            max-width: 60ch;
        }

        .family-pill {
            letter-spacing: 0.5em;
            font-size: 0.7rem;
            padding: 4px 12px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.04);
            text-transform: uppercase;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 18px;
        }

        .tool-card {
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 24px;
            background: rgba(14, 14, 14, 0.95);
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: transform 0.3s ease, border 0.3s ease, box-shadow 0.3s ease;
            overflow: hidden;
        }

        .tool-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            transform-origin: left;
            transform: scaleX(0);
            background: linear-gradient(90deg, var(--highlight-2), var(--family-accent, var(--highlight)));
            transition: transform 0.3s ease;
        }

        .tool-card:hover {
            transform: translateY(-6px);
            border-color: var(--family-accent, var(--highlight));
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.55);
        }

        .tool-card:hover::before {
            transform: scaleX(1);
        }

        .card-title {
            margin: 0;
            font-size: 1.1rem;
            letter-spacing: 0.1em;
            font-weight: 600;
        }

        .card-body {
            margin: 0;
            color: var(--text-dim);
            line-height: 1.5;
            font-size: 0.9rem;
        }

        .tag-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .tag {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.35em;
            padding: 3px 10px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.02);
            color: var(--text-dim);
        }

        .card-foot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: #7d7d7d;
            letter-spacing: 0.25em;
        }

        .loading {
            border: 1px dashed rgba(255, 255, 255, 0.3);
            border-radius: 16px;
            padding: 36px;
            text-align: center;
            color: var(--text-dim);
            letter-spacing: 0.3em;
            text-transform: uppercase;
        }

        @media (max-width: 768px) {
            header, .control-shell, .search-shell, .manifest-wrap {
                padding: 1.5rem 4vw;
            }

            .family-section {
                padding: 20px;
            }

            .control-grid {
                grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            }
        }
    </style>
</head>

<body class="p-6 md:p-12">
    <div class="scanline"></div>

    <header>
        <div class="hero-stack">
            <div class="hero-sub">
                <span class="status-dot"></span>
                <span class="mono text-xs text-green-500 tracking-widest">SYSTEM ONLINE</span>
                <span class="hero-pill">Latent Command</span>
            </div>
            <h1 class="text-4xl md:text-6xl font-bold tracking-tighter hero-text">LATENT AUDIO SUITE</h1>
            <p class="header-tagline">Primitive futurism meets teenage engineering control surfaces.</p>
            <div class="hero-meta">
                <span>VERSION 2.4.0</span>
                <span>LOCAL MP3 CORE ACTIVE</span>
            </div>
        </div>
    </header>

    <div class="search-shell">
        <input id="search-input" type="search" placeholder="Search instruments, families, tags..." autocomplete="off">
    </div>

    <div class="control-shell">
        <div class="control-title">
            <span>Control Surfaces</span>
            <span class="mono text-[10px]">Color-coded families</span>
        </div>
        <div class="control-grid" id="control-surfaces"></div>
    </div>

    <main class="manifest-wrap">
        <div id="manifest-sections" class="flex flex-col gap-6"></div>
        <div id="manifest-error" class="loading">Loading manifest...</div>
    </main>

    <script>
        const manifestSections = document.getElementById('manifest-sections');
        const manifestError = document.getElementById('manifest-error');
        const searchInput = document.getElementById('search-input');
        const controlSurfaceGrid = document.getElementById('control-surfaces');

        const controlFamilies = ['core', 'transmission', 'chronos', 'xr'];
        let sectionRegistry = [];

        const createControlCard = (family) => {
            const card = document.createElement('div');
            card.className = 'control-card';
            card.style.setProperty('--control-color', family.accent || '#f5a623');
            card.innerHTML = `
                <h3>${family.name}</h3>
                <p>${family.description}</p>
            `;
            return card;
        };

        const createEntryCard = (entry, family, index) => {
            const card = document.createElement('a');
            card.href = entry.file;
            card.className = 'tool-card';
            card.style.setProperty('--family-accent', family.accent || '#f5a623');
            const tagsHtml = entry.tags.slice(0, 3)
                .map(tag => `<span class="tag">${tag}</span>`)
                .join('');
            card.innerHTML = `
                <div class="card-head">
                    <p class="card-title">${entry.title}</p>
                    <span class="family-pill">${family.name}</span>
                </div>
                <p class="card-body">${entry.description}</p>
                <div class="tag-row">${tagsHtml}</div>
                <div class="card-foot">
                    <span class="mono text-[10px]">${(entry.status || 'Live').toUpperCase()}</span>
                    <span class="mono text-[10px]">LAUNCH →</span>
                </div>
            `;
            const searchTokens = [
                entry.title,
                entry.description,
                family.name,
                family.description,
                entry.tags.join(' ')
            ].join(' ').toLowerCase();
            card.dataset.search = searchTokens;
            return card;
        };

        const renderManifest = (data) => {
            manifestSections.innerHTML = '';
            sectionRegistry = [];
            controlSurfaceGrid.innerHTML = '';
            const entries = [];

            data.families.forEach((family, familyIndex) => {
                const section = document.createElement('section');
                section.className = 'family-section';
                section.style.setProperty('--family-accent', family.accent || '#f5a623');
                const head = document.createElement('div');
                head.className = 'family-head';
                const title = document.createElement('h2');
                title.className = 'family-name';
                title.textContent = family.name;
                const meta = document.createElement('p');
                meta.className = 'family-meta';
                meta.textContent = family.description;
                const pill = document.createElement('span');
                pill.className = 'family-pill';
                pill.textContent = family.id.toUpperCase();
                head.append(title, meta, pill);
                const grid = document.createElement('div');
                grid.className = 'card-grid';
                const cards = family.entries.map((entry, entryIndex) => {
                    const card = createEntryCard(entry, family, entryIndex);
                    grid.appendChild(card);
                    return card;
                });
                section.append(head, grid);
                manifestSections.appendChild(section);
                sectionRegistry.push({ section, grid, cards });
                if (controlFamilies.includes(family.id)) {
                    controlSurfaceGrid.appendChild(createControlCard(family));
                }
            });

            manifestError.style.display = 'none';
            filterCards(searchInput.value);
        };

        const filterCards = (term) => {
            if (!sectionRegistry.length) return;
            const normalTerm = term.trim().toLowerCase();
            let matchFound = false;
            sectionRegistry.forEach(({ section, cards }) => {
                let sectionMatch = false;
                cards.forEach((card) => {
                    const visible = !normalTerm || card.dataset.search.includes(normalTerm);
                    card.style.display = visible ? '' : 'none';
                    sectionMatch = sectionMatch || visible;
                });
                section.style.display = sectionMatch ? '' : 'none';
                matchFound = matchFound || sectionMatch;
            });
            if (!matchFound) {
                manifestError.style.display = 'block';
                manifestError.textContent = normalTerm
                    ? `No instruments match “${term}”`
                    : 'No instruments available';
            } else {
                manifestError.style.display = 'none';
            }
        };

        fetch('manifest.json')
            .then((response) => {
                if (!response.ok) throw new Error('Failed to load manifest');
                return response.json();
            })
            .then(renderManifest)
            .catch((error) => {
                manifestError.style.display = 'block';
                manifestError.textContent = `Unable to load manifest: ${error.message}`;
            });

        searchInput.addEventListener('input', (event) => {
            filterCards(event.target.value);
        });
    </script>




    <footer class="mt-12 pt-6 border-t border-white/10 flex justify-between items-center text-zinc-600 text-xs mono">
        <div>AUDIO ENGINE: WEBAUDIO + HTML5</div>
        <div>LATENT SPACE CORP © 2026</div>
    </footer>

</body>

</html>
