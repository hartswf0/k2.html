<script>(()=>{"use strict";const $=x=>document.getElementById(x),PX=70,TL=30;const sounds=[['KICK_DEEP','kick'],['SNARE_DRY','snare'],['HAT_CLOSED','hat'],['BASS_SUB','bass'],['SYNTH_GLASS','synth'],['CHORD_MINOR','chord']],sm=Object.fromEntries(sounds.map(x=>[x[0],x[1]]));const E={state:$('state'),takesBtn:$('takesBtn'),logBtn:$('logBtn'),apiBtn:$('apiBtn'),apiDot:$('apiDot'),apiText:$('apiText'),filter:$('filter'),sounds:$('sounds'),soundCount:$('soundCount'),sketchState:$('sketchState'),hit:$('hit'),lines:$('lines'),code:$('code'),mix:$('mix'),timeline:$('timeline'),ruler:$('ruler'),tracks:$('tracks'),playhead:$('playhead'),mixState:$('mixState'),aiState:$('aiState'),messages:$('messages'),chat:$('chat'),send:$('send'),tokens:$('tokens'),takeRead:$('takeRead'),undo:$('undo'),run:$('run'),play:$('play'),stop:$('stop'),pos:$('pos'),apiSheet:$('apiSheet'),key:$('key'),check:$('check'),model:$('model'),apiStatus:$('apiStatus'),doneApi:$('doneApi'),takesSheet:$('takesSheet'),takeList:$('takeList'),toast:$('toast'),workspace:$('workspace')};let st={executed:null,dirty:true,running:false,playing:false,line:null,history:[],takes:[],logs:[],links:[],mode:'make'},api={ready:false,key:'',model:''},ac=null,nodes=[],raf=null,timer=null,ps=0,pd=0;const START='setTempo(112)\nfitMedia(KICK_DEEP, 1, 1, 5)';function toast(t){E.toast.textContent=t;E.toast.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>E.toast.classList.remove('on'),1000)}function log(type,data={}){let a={id:'a'+Date.now()+Math.random().toString(36).slice(2,5),time:new Date().toISOString(),type,...data};st.logs.push(a);trail();return a}function state(t,k=''){E.state.textContent=t;E.state.className='state '+k}function lns(){E.lines.textContent=Array.from({length:E.code.value.split('\n').length},(_,i)=>i+1).join('\n')}function parse(src){let r={tempo:112,events:[],max:9,source:src};src.split('\n').forEach((raw,i)=>{let s=raw.trim();if(!s||s[0]==='#')return;let m=s.match(/^(\w+)\((.*)\)$/);if(!m)throw
