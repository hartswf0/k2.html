<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ESOS</title>
<style>
html,body{height:100%;margin:0;background:#fffef7;color:#0b0c0c;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}body{display:grid;place-items:center}#s{font-size:11px;font-weight:800;letter-spacing:.08em;text-align:center;line-height:1.7;padding:24px}
</style>
<div id="s">ESOS · LOADING</div>
<script>
(async()=>{
  const names=[
    'p01a.b64','p01b.b64','p02.b64','p03.b64','p04.b64','p05.b64','p06.b64','p07.b64','p08.b64',
    'p09a.b64','p09b.b64','p10a.b64','p10b.b64','p11a.b64','p11b.b64','p12x.b64','p12b.b64'
  ];
  const files=names.map(x=>'esos_parts/'+x+'?v=4');
  const EXPECTED=90456;

  function decode64(b64){
    const bin=atob(b64);
    const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
    return new TextDecoder('utf-8',{fatal:true}).decode(bytes);
  }

  function validHTML(html){
    if(!html.startsWith('<!doctype html>')) return false;
    if(!html.includes('<title>ESOS — Learning Surface</title>')) return false;
    if(!html.includes('function renderTeacher')) return false;
    if(!html.includes('function observerAccount')) return false;
    if(!html.includes('function bindGutters')) return false;
    if(!html.includes('bootSequence();')) return false;
    if(!html.trim().endsWith('</html>')) return false;
    const scripts=[...html.matchAll(/<script>([\s\S]*?)<\/script>/g)];
    if(!scripts.length) return false;
    try{ for(const m of scripts) new Function(m[1]); }
    catch(_){ return false; }
    return true;
  }

  function repairOneExtraChar(parts){
    const raw=parts.join('');
    if(raw.length===EXPECTED){
      try{ const html=decode64(raw); if(validHTML(html)) return {html,repair:'none'}; }catch(_){}
    }
    if(raw.length!==EXPECTED+1) return null;
    const boundaries=[]; let n=0;
    for(let i=0;i<parts.length-1;i++){
      n+=parts[i].length;
      boundaries.push({index:n,left:names[i],right:names[i+1]});
    }
    for(const b of boundaries){
      for(let delta=-4;delta<=4;delta++){
        const pos=b.index+delta;
        if(pos<0||pos>=raw.length) continue;
        const candidate=raw.slice(0,pos)+raw.slice(pos+1);
        try{
          const html=decode64(candidate);
          if(validHTML(html)) return {html,repair:`${b.left}|${b.right}@${delta}`};
        }catch(_){}
      }
    }
    return null;
  }

  function patchApp(html){
    const normalize=`function normalizeSong(s){\n  s=s&&typeof s===\"object\"?s:{};\n  const currentTake=s.currentTake||null;\n  return {\n    id:s.id||\"song_01\",name:s.name||\"SONG 01\",createdAt:s.createdAt||new Date().toISOString(),\n    takes:Array.isArray(s.takes)?s.takes:[],actions:Array.isArray(s.actions)?s.actions:[],edges:Array.isArray(s.edges)?s.edges:[],\n    stones:Array.isArray(s.stones)?s.stones:[],theory:Array.isArray(s.theory)?s.theory:[],\n    currentTake,currentBranch:s.currentBranch||\"main\",branches:s.branches&&typeof s.branches===\"object\"?s.branches:{main:currentTake},\n    onboarding:Number.isFinite(s.onboarding)?s.onboarding:0\n  }\n}\n`;

    html=html.replace('let song=loadSong()||{',normalize+'let song=normalizeSong(loadSong())||{');
    html=html.replace(
      'function loadSong(){try{return JSON.parse(localStorage.getItem("esos_learning_song")||"null")}catch(_){return null}}',
      'function loadSong(){try{const raw=localStorage.getItem("esos_learning_song")||localStorage.getItem("esos_song_current")||"null";return JSON.parse(raw)}catch(_){return null}}'
    );

    const early=`/* boot controls first: saved-state faults must never trap onboarding */\nels.checkApi.addEventListener(\"click\",checkApi);\nels.enterBtn.addEventListener(\"click\",enter);\nels.offlineBtn.addEventListener(\"click\",offline);\nsetTimeout(()=>{if(!els.boot.classList.contains(\"out\")){els.bootline.textContent=api.ready?\"READY\":\"AI OPTIONAL · ENTERING\";finishBoot()}},2600);\n\n`;
    html=html.replace('/* init */\nels.sketch.value=',early+'/* init */\nels.sketch.value=');
    html=html.replace(
      'els.apiChip.addEventListener("click",openApi);els.checkApi.addEventListener("click",checkApi);els.enterBtn.addEventListener("click",enter);els.offlineBtn.addEventListener("click",offline);',
      'els.apiChip.addEventListener("click",openApi);'
    );
    html=html.replace(
      '}catch(err){api.ready=false;els.gateStatus.textContent=`failed · ${err.message}`;els.gateStatus.className="bootstatus bad";renderApi()}',
      '}catch(err){api.ready=false;sessionStorage.removeItem("esos_api_key");els.gateStatus.textContent=`AI off · ${err.message}`;els.gateStatus.className="bootstatus bad";renderApi()}'
    );
    return html;
  }

  try{
    const parts=[];
    for(let i=0;i<files.length;i++){
      document.getElementById('s').textContent=`ESOS · LOADING · ${i+1}/${files.length}`;
      const r=await fetch(files[i],{cache:'no-store'});
      if(!r.ok) throw new Error(names[i]+' '+r.status);
      parts.push((await r.text()).trim());
    }

    const rawLength=parts.reduce((n,p)=>n+p.length,0);
    document.getElementById('s').textContent=`ESOS · VERIFYING · ${rawLength}`;
    const repaired=repairOneExtraChar(parts);
    if(!repaired) throw new Error(`payload ${rawLength} · repair failed`);

    const html=patchApp(repaired.html);
    if(!validHTML(html)) throw new Error('patched app failed validation');
    console.info('ESOS payload repair:',repaired.repair);
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.getElementById('s').textContent='ESOS · LOAD FAULT · '+e.message;
  }
})();
</script>
