n').forEach(b=>b.classList.toggle('on',b.dataset.m===m));aiView()}async function call(input){let r=await fetch('https://api.openai.com/v1/responses',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+AI.key},body:JSON.stringify({model:AI.model,input})});if(!r.ok)throw Error(r.status+' '+r.statusText);let d=await r.json(),t=d.output_text||'';if(!t)for(let x of d.output||[])for(let c of x.content||[])if(typeof c.text==='string')t+=c.text;return t}async function send(){let q=E.chat.value.trim();if(!q)return;if(!AI.ready){toast('AI OFF · music still works');return}E.chat.value='';if(st.mode!=='make'){try{msg(st.mode.toUpperCase(),await call(`${st.mode==='teach'?'Teach with OBSERVE, PREDICT, TRY, RUN, COMPARE.':'Give OBSERVED, INFERRED, CONFIDENCE, ALTERNATIVE, TEST. No chain-of-thought.'}\nCode:\n${E.code.value}\nQuestion:${q}`))}catch(e){toast(e.message)}return}let p=rec('prompt',{text:q});try{let o=JSON.parse((await call(`Edit this EarSketch sketch using only setTempo and fitMedia. Valid sounds: ${S.map(x=>x.name+'['+x.family+']').join(',')}. Current:\n${E.code.value}\nRequest:${q}\nJSON only {"operation":"short","change":"short","sketch":"complete replacement"}`)).replace(/^```json\s*|```$/g,''));parse(o.sketch);rec('ai_proposal',{promptId:p.id,...o});aiView()}catch(e){toast('AI '+e.message)}}function applyAI(x){let old=E.code.value;st.history.push(old);E.code.value=x.sketch;lines();dirty();let a=old.split('\n'),b=x.sketch.split('\n'),chg=[];for(let i=0;i<Math.max(a.length,b.length);i++)if((a[i]||'')!==(b[i]||''))chg.push(i+1);chg.forEach(line=>st.links.push({promptId:x.promptId,line,conf:chg.length===1?.97:Math.max(.65,.94-(chg.length-1)*.06)}));rec('ai_apply',{lines:chg});aiView();focus(1)}
