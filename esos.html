<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ESOS</title>
<style>
html,body{height:100%;margin:0;background:#fffef7;color:#0b0c0c;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}body{display:grid;place-items:center}#s{font-size:11px;font-weight:800;letter-spacing:.08em}
</style>
<div id="s">ESOS · LOADING</div>
<script>
(async()=>{
  const files=[
    'p01.b64','p02.b64','p03.b64','p04.b64','p05.b64','p06.b64','p07.b64','p08.b64','p09.b64',
    'p10a.b64','p10b.b64','p11a.b64','p11b.b64','p12a.b64','p12b.b64'
  ].map(x=>'esos_parts/'+x);
  try{
    const parts=[];
    for(const file of files){
      const r=await fetch(file,{cache:'no-store'});
      if(!r.ok) throw new Error(file+' '+r.status);
      parts.push((await r.text()).trim());
    }
    const bin=atob(parts.join(''));
    const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
    const html=new TextDecoder('utf-8').decode(bytes);
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.getElementById('s').textContent='ESOS · LOAD FAULT · '+e.message;
  }
})();
</script>
